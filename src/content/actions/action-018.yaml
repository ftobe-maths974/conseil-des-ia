title: "Certifier les outils IA pédagogiques avant tout déploiement en établissement"
body: >
  Un label national conditionne l'accès des outils IA aux établissements scolaires publics. La certification évalue biais, transparence, protection des données mineurs et impact sur l'autonomie cognitive.
