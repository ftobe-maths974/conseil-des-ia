id: action-018
phase: action
slot: 2
lever_type: auditer
chamber: singularite-vs-standard
reversibility: yellow
scope: systemique
title: "Certifier les outils IA pédagogiques avant tout déploiement en établissement"
body: >
  Un label national conditionne l'accès des outils IA aux établissements scolaires publics. La certification évalue biais, transparence, protection des données mineurs et impact sur l'autonomie cognitive.
tags: 
  - education
  - certification
  - enfants
  - pedagogie
amplifies:
  - action-017
facilitator_note:
  si_silence: "Demandez : si vous étiez parent, accepteriez-vous qu'un outil non certifié enseigne les mathématiques à votre enfant — si cet outil améliorait objectivement ses résultats ?"
  si_debat_bloque: "Fait choc : en France, 67 % des établissements scolaires utilisent au moins un outil numérique non évalué par le ministère, selon un audit de la Cour des comptes de 2023."
  relance_cle: "Certifier avant de déployer protège les élèves — mais ralentit l'innovation et avantage les acteurs qui ont les ressources pour décrocher la certification. Comment éviter que la protection devienne une barrière à l'entrée ?"
version: "1.0"
