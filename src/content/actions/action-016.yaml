id: action-016
phase: action
slot: 4
lever_type: auditer
chamber: invisibilite-vs-arbitrage
reversibility: green
scope: organisationnel
title: "Documenter et diffuser en interne les critères d'entraînement des IA utilisées"
body: >
  L'équipe IA publie une fiche technique de chaque modèle déployé : données d'entraînement, critères d'évaluation, limitations connues. Accessible à tous les collaborateurs concernés.
tags: 
  - documentation
  - transparence
  - formation
  - interne
facilitator_note:
  si_silence: "Demandez : dans votre organisation, combien de personnes savent vraiment sur quoi ont été entraînés les outils IA qu'elles utilisent tous les jours ? Est-ce que cette ignorance pose un problème ?"
  si_debat_bloque: "Angle positif : cette action ne change pas les outils, elle change la culture. Quelles décisions seraient différentes si chaque équipe savait exactement quelles données ont formé son outil IA ?"
  relance_cle: "Si les collaborateurs découvrent que leur IA a été entraînée sur des données biaisées ou problématiques, qu'est-ce qu'ils peuvent faire de cette information — et qui décide de la suite ?"
version: "1.0"
