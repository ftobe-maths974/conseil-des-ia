chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Instaurer un droit d'appel humain sur toute décision automatisée"
body: >
  Tout individu affecté par une décision prise ou recommandée par une IA peut demander un réexamen par un humain identifié. Ce droit est formalisé dans les CGU et les procédures internes.
tags: 
  - recours
  - transparence
  - droits
  - gouvernance
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un ici a déjà tenté de contester une décision d'un algorithme ? Que s'est-il passé — ou pourquoi ne l'a-t-on pas essayé ?"
  si_debat_bloque: "Fait choc : le RGPD prévoit ce droit d'appel depuis 2018, mais moins de 3 % des personnes concernées par une décision automatisée l'ont jamais exercé. Le problème n'est pas le droit, c'est l'accès."
  relance_cle: "Qui décide de qui est qualifié pour réviser une décision IA — et comment s'assure-t-on que ce réviseur humain ne va pas simplement valider ce que l'algorithme avait dit ?"
version: "1.0"
