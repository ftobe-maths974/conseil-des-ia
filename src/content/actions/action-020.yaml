id: action-020
phase: action
chamber: singularite-vs-standard
reversibility: green
scope: organisationnel
title: "Expérimenter un protocole IA minimal en situation de crise"
body: >
  Une organisation définit un protocole de dégradation gracieuse : quels services IA sont maintenus en cas de panne, lesquels sont suspendus et qui reprend la décision manuelle. Testé deux fois par an.
tags: 
  - resilience
  - crise
  - protocole
  - continuite
facilitator_note:
  si_silence: "Demandez : si demain matin tous vos outils IA tombaient en panne simultanément, quelles décisions critiques ne pourraient plus être prises ? Votre organisation saurait-elle comment réagir dans l'heure ?"
  si_debat_bloque: "Fait choc : lors de la panne de Microsoft Azure en juillet 2024, plusieurs hôpitaux ont dû suspendre des opérations non urgentes parce que leurs systèmes de planification IA étaient indisponibles — sans protocole de dégradation préétabli."
  relance_cle: "Un protocole de dégradation gracieuse révèle ce qui est vraiment essentiel. Quel usage IA, si supprimé brutalement, mettrait en danger une activité que votre organisation n'a pas le droit de stopper ?"
version: "1.0"
