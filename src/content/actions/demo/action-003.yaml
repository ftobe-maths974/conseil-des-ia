title: "Former 100 % des managers à interpréter les recommandations IA"
body: >
  Un programme de formation certifiant permet à chaque responsable de comprendre les sorties des outils IA de son périmètre, d'en identifier les limites et de les contester si nécessaire.
tags: 
  - formation
  - litteratie
  - autonomie
  - management
facilitator_note:
  si_silence: "Demandez : est-ce qu'un responsable peut prendre de meilleures décisions s'il ne comprend pas l'outil qu'il utilise ? Accepterait-on ça pour n'importe quel autre équipement critique ?"
  si_debat_bloque: "Angle pragmatique : même sans changer les systèmes, former les personnes modifie les comportements. Quelles décisions changeraient concrètement si les managers comprenaient vraiment les limites de leur IA ?"
  relance_cle: "Former sans changer les outils, c'est apprendre à lire une carte inexacte. Quelle serait la condition minimale pour que cette formation ait un effet réel et pas seulement symbolique ?"
version: "1.0"
