id: action-001
phase: action
slot: 1
lever_type: interdire
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Interdire la délégation totale du scoring de crédit à un algorithme opaque"
body: >
  Toute décision de crédit ou d'accès à un service public reposant sur un score IA doit pouvoir être expliquée, contestée et réattribuée à un décideur humain identifié. Il est interdit de confier à un prestataire externe la capacité de modifier unilatéralement les critères de scoring sans validation préalable de l'organisme responsable.
tags: 
  - delegation
  - finance
  - opacite
  - dependance
facilitator_note:
  si_silence: "Demandez : si demain votre banque vous refusait un prêt sans pouvoir vous expliquer pourquoi, que feriez-vous ? À qui vous adresseriez-vous ?"
  si_debat_bloque: "Fait choc : en 2023, la Cour de justice de l'UE a condamné une banque autrichienne pour scoring IA opaque — 8 ans après les faits, et seulement parce qu'une avocate avait les moyens de poursuivre."
  si_trop_technique: "Revenez au mandat : peu importe le modèle, la question est — qui est responsable quand ce système se trompe et ruine la vie de quelqu'un ?"
  relance_cle: "Si cette action est adoptée sans garde-fous, dans combien de temps ne pourra-t-on plus faire machine arrière — et qui aura perdu quelque chose d'irremplaçable ?"
version: "1.0"
