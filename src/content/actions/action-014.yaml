title: "Auditer annuellement les biais des outils IA de recrutement"
body: >
  Un tiers indépendant évalue chaque année les biais statistiques des systèmes IA utilisés dans les processus RH. Les résultats sont transmis aux représentants du personnel et aux candidats sur demande.
