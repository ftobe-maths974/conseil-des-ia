title: "Conditionner les autorisations de datacenter IA à 100 % d'énergie renouvelable"
body: >
  Toute nouvelle infrastructure d'entraînement ou d'inférence IA dépassant un seuil de puissance doit être alimentée exclusivement en énergie renouvelable certifiée. Modifie la réglementation des permis de construire industriels.
tags: 
  - datacenter
  - renouvelable
  - legislation
  - climat
blocks:
  - action-009
facilitator_note:
  si_silence: "Demandez : est-ce qu'une telle règle aurait empêché la construction du datacenter qui consomme l'eau agricole de régions en sécheresse — ou aurait-il trouvé un contournement ?"
  si_debat_bloque: "Fait choc : en 2024, Microsoft et Google ont annoncé des objectifs 100 % renouvelable — mais via des mécanismes de compensation qui permettent de continuer à utiliser du charbon localement tout en achetant des certificats verts à distance."
  si_trop_technique: "Pas besoin d'entrer dans les certifications énergétiques. La vraie question est : une contrainte applicable mais imparfaite vaut-elle mieux qu'une règle parfaite mais systématiquement contournée ?"
  relance_cle: "Si les énergies renouvelables disponibles ne suffisent pas à alimenter toute l'IA qu'on veut construire, cette contrainte nous oblige à choisir. Qui décide quels datacenters passent en premier ?"
version: "1.0"
