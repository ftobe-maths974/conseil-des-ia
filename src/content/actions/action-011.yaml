title: "Conditionner les autorisations de datacenter IA à 100 % d'énergie renouvelable"
body: >
  Toute nouvelle infrastructure d'entraînement ou d'inférence IA dépassant un seuil de puissance doit être alimentée exclusivement en énergie renouvelable certifiée. Modifie la réglementation des permis de construire industriels.
