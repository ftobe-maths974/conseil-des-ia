title: "Plafonner la consommation énergétique des infrastructures IA internes"
body: >
  Un budget énergétique annuel est alloué à l'ensemble des usages IA d'une organisation. Tout dépassement déclenche un audit et un gel des nouveaux déploiements.
tags: 
  - energie
  - budget
  - gouvernance
  - sobriete
facilitator_note:
  si_silence: "Demandez : si votre organisation avait un budget carbone pour l'IA comme elle a un budget financier, quels usages seraient les premiers sacrifiés — et par qui ?"
  si_debat_bloque: "Fait choc : plusieurs grandes banques européennes intègrent déjà le coût carbone de leurs services numériques dans leur comptabilité RSE. Quand c'est mesuré, les arbitrages changent — même sans contrainte légale."
  relance_cle: "Un plafond énergétique force les arbitrages que le marché évite. Qui dans l'organisation aurait le pouvoir — et la légitimité — de décider quels usages IA sont prioritaires sur les autres ?"
version: "1.0"
