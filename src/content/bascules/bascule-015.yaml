id: bascule-015
phase: bascule
chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Les datacenters IA entrent en compétition avec l'agriculture pour l'eau locale"
situation: >
  Le refroidissement des serveurs nécessite des volumes massifs d'eau douce. Dans
  des régions soumises à des sécheresses récurrentes, les datacenters des grandes
  plateformes IA obtiennent des droits d'eau prioritaires sur les usages agricoles
  locaux — sans consultation publique.
question: >
  Quand une infrastructure numérique prive une communauté de ressources vitales, comment arbitre-t-on entre intérêt global et survie locale ?
tags:
  - eau
  - territoire
  - datacenter
  - agriculture
facilitator_note:
  si_silence: "Demandez : si vous étiez maire d'une commune, comment décideriez-vous entre un datacenter qui crée 500 emplois et l'eau pour les 200 agriculteurs de votre territoire ?"
  si_debat_bloque: "Fait choc : dans plusieurs États américains, des permis d'eau ont été attribués à des datacenters sans consultation des communautés locales, sous couvert de secret commercial. Les agriculteurs ont appris la décision dans la presse."
  si_trop_technique: "Ramenez au niveau de gouvernance : ce n'est pas un problème technique, c'est un problème de qui décide et avec qui. Qui doit avoir voix au chapitre quand l'infrastructure numérique mondiale entre en compétition avec les besoins locaux ?"
  relance_cle: "L'eau est un bien commun. La capacité de calcul de l'IA l'est aussi, d'une certaine façon. Ces deux biens communs peuvent-ils coexister, ou est-ce que l'un absorbe nécessairement l'autre ?"
version: "1.0"
