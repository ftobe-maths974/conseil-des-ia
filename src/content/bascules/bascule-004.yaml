id: bascule-004
phase: bascule
chamber: invisibilite-vs-arbitrage
reversibility: red
scope: organisationnel
title: "Tu n'as pas eu le job. L'algorithme ne dit pas pourquoi."
situation: >
  Amazon a abandonné en 2018 un outil de tri de CV qui pénalisait
  automatiquement les femmes. Des outils similaires tournent encore
  dans des services RH, sans obligation de transparence
  dans la majorité des pays.
question: >
  Quand une décision est prise par un algorithme sans explication
  possible, à qui réclame-t-on justice ?
tags: [biais, rh, recrutement, transparence, discrimination]
facilitator_note:
  si_silence: "Demandez : combien d'entre vous ont passé un test de recrutement en ligne, un entretien vidéo analysé par IA ? Ce que vous avez vécu, c'est déjà ça."
  si_debat_bloque: "Fait choc : l'outil d'Amazon pénalisait les CV contenant le mot 'femmes' — comme dans 'capitaine de l'équipe de tennis féminine'. Des outils similaires tournent encore sans obligation de déclaration."
  si_trop_technique: "Revenez au vécu : si vous recevez un refus sans explication, à qui vous adressez-vous ? Il n'y a pas de numéro à appeler pour contester l'algorithme."
  relance_cle: "Quand personne n'a pris de décision — que c'est le modèle — qui est responsable de l'exclusion ?"
illustration: /images/cards/bascule-004.svg
version: "1.0"
