title: "Le score de crédit algorithmique remplace la relation bancaire"
situation: >
  Les banques délèguent l'évaluation du risque à des modèles qui agrègent des milliers
  de signaux — achats, géolocalisation, comportement en ligne. Le conseiller humain ne
  comprend plus les critères. Le client non plus.
question: >
  Peut-on refuser un crédit à quelqu'un sans être capable de lui expliquer pourquoi ?
tags:
  - credit
  - opacite
  - finance
  - droits
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un s'est déjà vu refuser un service financier sans explication ? Un compte, une carte, une assurance ?"
  si_debat_bloque: "Fait choc : des versions du score de crédit comportemental existent déjà en Europe dans l'assurance auto — votre style de conduite noté en temps réel peut faire varier votre prime sans que vous puissiez contester le calcul."
  si_trop_technique: "Ramenez à la relation humaine : votre conseiller bancaire pouvait expliquer un refus, même si vous étiez en désaccord. Avec un algorithme, il n'y a plus de dialogue possible. C'est ça la perte."
  relance_cle: "Peut-on avoir un recours contre une décision qu'aucun être humain n'a prise et que personne ne peut expliquer ?"
version: "1.0"
