id: bascule-009
phase: bascule
chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: organisationnel
title: "Le filtre algorithmique des CV crée une génération invisible"
situation: >
  Les ATS (systèmes de suivi des candidatures) éliminent entre 70 et 80 % des candidatures
  avant qu'un humain ne les lise. Les profils atypiques — reconversion, trous dans le CV,
  formation non standard — sont écartés de manière systématique et invisible.
question: >
  Quand l'algorithme de recrutement ne voit pas le candidat, qui est responsable de l'exclusion ?
tags:
  - recrutement
  - biais
  - cv
  - exclusion
facilitator_note:
  si_silence: "Demandez : combien d'entre vous ont un profil considéré 'atypique' selon les critères standard — reconversion, formation non linéaire, activité associative ou entrepreneuriale ?"
  si_debat_bloque: "Fait choc : les ATS éliminent 70 à 80% des candidatures avant qu'un humain ne les voie. Si vous n'avez pas le bon format de CV, vous n'existez pas — personne ne l'a décidé, c'est juste le seuil."
  si_trop_technique: "Posez la question de la responsabilité : quand l'algorithme écarte un candidat qualifié, qui est responsable ? L'entreprise ? L'éditeur du logiciel ? Le recruteur qui a coché 'utiliser le filtre' ?"
  relance_cle: "Si l'outil invisibilise certains profils sans que personne n'ait pris de décision discriminatoire, comment régule-t-on ce qui n'est pas une décision ?"
version: "1.0"
