id: bascule-005
phase: bascule
slot: 1
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
scope: organisationnel
title: "Tout le monde rend le même devoir. Personne n'a copié."
situation: >
  Depuis 2023, des enseignants détectent une homogénéisation des copies.
  Les structures, les formulations, les exemples convergent.
  Pas de plagiat au sens classique, mais une réduction mesurable
  de la diversité cognitive des réponses.
question: >
  Si l'IA optimise les réponses vers un standard moyen, qu'arrive-t-il
  aux idées marginales, aux raisonnements atypiques,
  aux erreurs créatives ?
tags: [education, creativite, homogeneisation, cognition, evaluation]
facilitator_note:
  si_silence: "Demandez : est-ce que vous reconnaissez ce phénomène dans votre promo ? Les rendus se ressemblent-ils plus qu'avant ? Évitez le jugement moral."
  si_debat_bloque: "Fait choc : des chercheurs ont mesuré une réduction de la diversité lexicale dans les travaux étudiants depuis 2023 — pas de plagiat détectable, mais un appauvrissement mesurable des formulations et des angles."
  si_trop_technique: "Sortez de la question de la triche. La vraie question : si tout le monde pense dans les mêmes cadres, qui produit les idées en rupture dont les organisations ont besoin dans 10 ans ?"
  relance_cle: "L'IA optimise vers la réponse la plus probable — ce qui est, par définition, la réponse la plus moyenne. Qu'est-ce qu'on perd quand on optimise la pensée ?"
