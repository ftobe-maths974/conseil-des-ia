id: bascule-014
phase: bascule
chamber: metabolisme-vs-progres
reversibility: yellow
scope: individuel
title: "Une requête à un LLM consomme 10 fois plus qu'une recherche Google"
situation: >
  Une conversation de 10 échanges avec un grand modèle de langage consomme
  autant d'énergie que 10 recherches web classiques. Avec des milliards de requêtes
  quotidiennes, l'IA générative représente une nouvelle catégorie de consommation
  énergétique — invisible pour l'utilisateur.
question: >
  Faut-il afficher l'empreinte carbone de chaque requête IA, comme on affiche les calories sur les aliments ?
tags:
  - energie
  - carbone
  - consommation
  - transparence
facilitator_note:
  si_silence: "Demandez au groupe d'estimer sa consommation IA quotidienne. Puis : si chaque requête affichait son coût en énergie comme une pompe à essence, est-ce que ça changerait vos usages ?"
  si_debat_bloque: "Fait choc : Microsoft a annoncé une augmentation de 30% de ses émissions carbone entre 2020 et 2023, directement liée à la croissance de ses services IA. Ses engagements net-zéro ont été repoussés de 10 ans."
  si_trop_technique: "Sortez de la comptabilité carbone. La question est simple : est-ce que les utilisateurs ont le droit de connaître le coût environnemental réel de ce qu'ils utilisent, comme pour n'importe quel produit ?"
  relance_cle: "Si afficher l'empreinte carbone de chaque requête faisait s'effondrer le marché de l'IA générative, qu'est-ce que ça nous dit sur la viabilité réelle de ses modèles économiques ?"
version: "1.0"
