id: tension-029
phase: tension
slot: 9
slot_theme: systeme
chamber: delegation-vs-souverainete
reversibility: red
title: "L'État délègue l'État de droit aux plateformes"
content: >
  En confiant la modération du discours public, la lutte contre la désinformation et la gestion de l'identité numérique à des plateformes privées, les États externalisent des fonctions régaliennes. Ces plateformes appliquent leurs propres normes — souvent sans mandat démocratique, sans recours citoyen, et avec des intérêts économiques incompatibles avec l'intérêt général.
data_point: >
  En 2023, Meta a supprimé plus de contenu politique en Europe que tous les tribunaux administratifs européens réunis n'en ont ordonné le retrait. Aucun de ces retraits n'a fait l'objet d'un contrôle judiciaire préalable.
question: >
  Quand l'État délègue sa souveraineté normative à des acteurs privés, qui gouverne réellement l'espace public numérique ?
tags:
  - etat
  - plateformes
  - regulation
  - democratie
suggestions_bascule:
  - "Le point de bascule est le moment où une plateforme décide seule des règles du débat public — quand la délégation de fait précède et remplace la délégation de droit."
  - "Le point de bascule est atteint quand un État ne peut plus contraindre une plateforme à rétablir un contenu supprimé — quand la souveraineté numérique est définitivement externalisée."
version: "1.0"
