id: tension-008
phase: tension
slot: 3
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: yellow
title: "L'authenticité devient un luxe"
content: >
  Les contenus vérifiés et certifiés non-synthétiques seront plus coûteux à produire et à distribuer. L'accès à l'information vérifiable risque de devenir un privilège économique.
data_point: >
  Le coût de la certification de contenu authentique (watermarking, traçabilité) représente entre 5 et 20 % du coût de production selon les formats.
question: >
  Une société où seuls les riches peuvent accéder à de l'information certifiée : dystopie ou trajectoire probable ?
tags: 
  - authenticite
  - inegalite
  - acces
  - certification
suggestions_bascule:
  - "Le point de bascule est le moment où l'accès à de l'information certifiée vraie est conditionné par un abonnement ou un statut économique — quand la vérité devient un service premium."
  - "Le point de bascule est quand deux citoyens ne peuvent plus débattre sur la même base factuelle parce qu'ils n'ont pas les mêmes moyens d'accès à l'information vérifiée."
version: "1.0"
