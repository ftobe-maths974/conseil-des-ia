id: tension-017
phase: tension
chamber: invisibilite-vs-arbitrage
reversibility: yellow
title: "L'arbitrage algorithmique reproduit et amplifie les biais existants"
content: >
  Les modèles appris sur des données historiques héritent des discriminations passées. Pire : ils les légitiment en leur donnant une apparence de neutralité statistique.
data_point: >
  Une étude sur 100 000 décisions d'un système IA de sélection scolaire aux États-Unis a montré que les étudiants issus de minorités étaient systématiquement défavorisés — avec un écart allant jusqu'à 18 points de score.
question: >
  Comment distinguer une 'discrimination statistiquement fondée' d'une 'discrimination systémique camouflée' ?
tags: 
  - biais
  - discrimination
  - statistique
  - justice
suggestions_bascule:
  - "Le point de bascule est le moment où une discrimination statistiquement documentée est maintenue parce qu'aucun acteur n'assume la responsabilité de la corriger."
  - "Le point de bascule est quand un biais algorithmique est présenté comme une 'réalité statistique objective' — quand les données du passé deviennent la norme imposée au futur."
version: "1.0"
