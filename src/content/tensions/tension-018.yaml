id: tension-018
phase: tension
slot: 3
slot_theme: organisation
chamber: invisibilite-vs-arbitrage
reversibility: yellow
title: "La personnalisation crée des individus incomparables"
content: >
  Quand les prix, les offres, les informations et les services sont personnalisés par IA, chaque individu vit dans une réalité différente. Il n'y a plus de terrain commun pour comparer, contester ou négocier collectivement.
data_point: >
  En 2023, Amazon pratiquait jusqu'à 2,5 millions d'ajustements de prix par jour, avec des variations pouvant atteindre 30 % pour le même article selon le profil d'achat.
question: >
  Peut-on parler d'égalité des citoyens dans un monde où chacun reçoit une offre, une information et un prix différents ?
tags: 
  - personnalisation
  - egalite
  - prix
  - discrimination
suggestions_bascule:
  - "Le point de bascule est le moment où deux personnes ne peuvent plus comparer leurs conditions — prix, informations, opportunités — parce que chacun vit dans une réalité personnalisée sans commune mesure."
  - "Le point de bascule est quand la personnalisation algorithmique rend impossible toute négociation collective — quand syndicats, associations de consommateurs et mouvements sociaux perdent leur base commune."
version: "1.0"
