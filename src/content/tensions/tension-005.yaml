id: tension-005
phase: tension
chamber: delegation-vs-souverainete
reversibility: red
title: "L'automatisation des décisions RH redessine les frontières de la dignité"
content: >
  Quand un algorithme décide qui est recruté, promu ou licencié, la relation de travail change de nature. Le salarié n'est plus jugé par un pair mais évalué par un système — sans possibilité de se défendre face à une logique.
data_point: >
  En France, 34 % des grandes entreprises utilisent une IA dans au moins une étape de leur processus de recrutement (2024).
question: >
  Où se situe la limite entre automatisation efficace et déshumanisation du rapport de travail ?
tags: 
  - rh
  - dignite
  - recrutement
  - algorithme
