id: tension-042
phase: tension
slot: 6
slot_theme: individu
chamber: singularite-vs-standard
reversibility: green
title: "L'IA ne comprend pas ma neurodivergence"
content: >
  Les modèles de langage sont entraînés sur des productions humaines majoritairement neurotypiques. Les personnes dyslexiques, autistes ou TDAH dont les modes d'expression s'écartent de la norme voient leurs requêtes mal comprises, leurs textes mal évalués, leur style de communication pénalisé. Le standard IA reproduit une norme cognitive qu'il impose comme universelle.
data_point: >
  Une étude de l'Université de Cambridge (2024) montre que les grands modèles de langage attribuent des scores de "cohérence" significativement plus faibles aux textes produits par des personnes autistes, même quand le sens est identique à celui de textes neurotypiques soumis aux mêmes modèles.
question: >
  Quand l'IA définit implicitement ce qu'est une "bonne" communication, quelle norme cognitive impose-t-elle à ceux qui s'en écartent ?
tags:
  - neurodiversite
  - accessibilite
  - norme
  - inclusion
suggestions_bascule:
  - "Le point de bascule est le moment où un outil IA évalue des étudiants neurodivergents avec des critères conçus pour la norme — quand le standard devient un outil d'exclusion scolaire."
  - "Le point de bascule est atteint quand une personne neurodivergente doit adapter son mode de pensée pour être comprise par l'IA — quand l'outil impose sa norme à l'humain."
version: "1.0"
