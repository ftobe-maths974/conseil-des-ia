title: "L'eau douce devient une variable des équations IA"
content: >
  Le refroidissement des datacenters consomme des quantités massives d'eau potable. Dans des régions en stress hydrique, les implantations IA entrent en compétition directe avec l'agriculture et les populations locales.
data_point: >
  Les datacenters de Microsoft dans la région de Phoenix (Arizona) consomment 6,4 milliards de litres d'eau par an dans une zone soumise à des restrictions hydriques sévères.
question: >
  Lorsque le refroidissement d'un serveur entre en compétition avec l'irrigation d'un champ, qui doit céder ?
