title: "La simulation parfaite rend la vérité indémontrable"
content: >
  Lorsqu'une IA peut reproduire n'importe quelle réalité de façon indiscernable, la preuve visuelle ou sonore perd sa valeur probatoire. Ce n'est pas seulement un problème judiciaire — c'est une crise épistémique.
data_point: >
  En 2024, plusieurs procès aux États-Unis ont été suspendus après la mise en doute de vidéos de surveillance présentées comme preuves.
question: >
  Si tout peut être simulé, sur quoi peut-on encore fonder une conviction collective ?
tags: 
  - preuve
  - epistemologie
  - vérité
  - simulation
suggestions_bascule:
  - "Le point de bascule est le moment où un tribunal ne peut plus valider une preuve visuelle sans expertise technique — quand la réalité visuelle cesse de faire foi par elle-même."
  - "Le point de bascule est quand le coût de vérification d'un document dépasse la valeur de l'information qu'il contient — quand vérifier devient plus coûteux que croire."
