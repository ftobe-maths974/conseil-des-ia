title: "L'empreinte invisible du prompt quotidien"
content: >
  Chaque requête adressée à un modèle de langage consomme de l'eau pour refroidir les serveurs et de l'énergie pour inférer la réponse. Cette consommation est invisible pour l'utilisateur — elle ne figure pas dans les interfaces, elle n'est pas mentionnée dans les CGU. Le geste numérique le plus banal a un coût physique que personne ne montre.
data_point: >
  Une requête à un grand modèle de langage consomme en moyenne 10 fois plus d'énergie qu'une recherche Google classique. Un utilisateur actif de ChatGPT génère environ 1,3 kg de CO₂ par mois, soit l'équivalent de 6 km en voiture thermique (IEA, 2024).
question: >
  Peut-on consommer l'IA de manière éclairée sans que son coût environnemental soit rendu visible à chaque usage ?
tags:
  - empreinte-carbone
  - consommation
  - transparence
  - individu
suggestions_bascule:
  - "Le point de bascule est le moment où un utilisateur réduit sa consommation d'IA après avoir vu son empreinte — quand la visibilité crée un comportement responsable."
  - "Le point de bascule est atteint quand l'affichage de l'empreinte environnementale est rendu obligatoire dans les interfaces IA — quand l'invisible devient contraignant."
