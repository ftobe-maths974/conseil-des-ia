id: tension-028
phase: tension
slot: 8
slot_theme: organisation
chamber: delegation-vs-souverainete
reversibility: yellow
title: "La délégation asymétrique : qui contrôle le contrôleur ?"
content: >
  Les organisations délèguent des décisions à des IA fournies par des tiers privés, mais les contrats imposent des audits limités et une opacité sur les modèles. L'organisation reste légalement responsable de décisions qu'elle ne peut ni comprendre ni contester en profondeur.
data_point: >
  D'après une enquête de l'ANSSI (2024), 71 % des entreprises françaises utilisant une IA en production ne peuvent pas accéder au code source du modèle en cas d'incident. 58 % déclarent ne pas savoir comment contester une décision IA erronée.
question: >
  Comment une organisation peut-elle répondre de décisions déléguées à un système sur lequel elle n'a pas de maîtrise réelle ?
tags:
  - responsabilite
  - audit
  - contrat
  - organisation
suggestions_bascule:
  - "Le point de bascule est le moment où une organisation ne peut plus expliquer une décision de son propre système — quand la délégation crée une zone d'irresponsabilité structurelle."
  - "Le point de bascule est atteint quand le prestataire IA conditionne la transparence à la signature d'un NDA — quand le droit de regard devient négociable."
version: "1.0"
