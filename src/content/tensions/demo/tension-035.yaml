title: "L'anxiété écologique face à l'enthousiasme technologique"
content: >
  Un nombre croissant de travailleurs du numérique rapportent une dissonance cognitive entre leur usage quotidien de l'IA et leurs convictions environnementales. Continuer à utiliser des outils dont on connaît l'impact carbone crée une forme de fatigue morale individuelle — trop petite pour peser, trop réelle pour être ignorée.
data_point: >
  Dans une enquête auprès de 2 400 professionnels du numérique (Greenpeace Digital, 2024), 61 % déclarent ressentir un conflit entre leurs pratiques numériques et leurs valeurs environnementales. Seuls 8 % ont réduit leur usage de l'IA générative pour cette raison.
question: >
  Quand la prise de conscience écologique individuelle ne suffit pas à changer les comportements collectifs, à quoi sert-elle ?
tags:
  - dissonance-cognitive
  - ecologie
  - responsabilite
  - comportement
suggestions_bascule:
  - "Le point de bascule est le moment où l'anxiété écologique devient un motif légitime de refus d'un outil imposé par l'employeur — quand la valeur personnelle devient revendication professionnelle."
  - "Le point de bascule est atteint quand la dissonance collective dépasse le seuil de l'inaction — quand assez de gens changent de comportement pour que les entreprises le remarquent."
version: "1.0"
