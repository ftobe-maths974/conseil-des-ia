id: tension-022
phase: tension
slot: 2
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
title: "L'homogénéisation culturelle est un effet secondaire de l'IA"
content: >
  Les grandes IA sont entraînées majoritairement sur du contenu anglophone occidental. En les déployant globalement, on diffuse implicitement des normes, des valeurs et des références culturelles dominantes.
data_point: >
  Wikipedia en anglais représente 20 % du contenu total de la plateforme mais concentre 80 % des données utilisées pour entraîner les grands modèles de langage.
question: >
  Peut-on déployer une IA globale sans imposer simultanément une vision du monde particulière ?
tags: 
  - culture
  - langue
  - homogeneisation
  - domination
suggestions_bascule:
  - "Le point de bascule est le moment où une IA globale remplace des pratiques culturelles locales non par substitution directe, mais par désintérêt progressif — quand la commodité de l'universel étouffe la résistance du particulier."
  - "Le point de bascule est quand une langue ou une culture ne dispose pas de corpus suffisant pour entraîner ses propres modèles — quand elle devient irrémédiablement dépendante d'une IA pensée dans une autre langue."
version: "1.0"
