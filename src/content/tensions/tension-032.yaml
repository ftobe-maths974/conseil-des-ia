id: tension-032
phase: tension
slot: 8
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: yellow
title: "Le notariat à l'ère de la signature synthétique"
content: >
  Les institutions qui certifient l'authenticité — notaires, huissiers, experts judiciaires — voient leur rôle fragilisé par des outils capables de générer des signatures, des voix et des visages indiscernables. Le modèle institutionnel de la preuve repose sur des tiers de confiance que la simulation rend techniquement dépassables.
data_point: >
  En 2023, le Conseil supérieur du notariat français a recensé 340 tentatives de fraude documentaire utilisant des contenus IA — contre 12 en 2021. 80 % n'ont été détectées que grâce à des indices non-documentaires.
question: >
  Les institutions de certification peuvent-elles maintenir leur autorité quand la technologie de simulation dépasse leurs outils de détection ?
tags:
  - certification
  - fraude
  - institution
  - authenticite
suggestions_bascule:
  - "Le point de bascule est le moment où un notaire ne peut plus distinguer un document original d'un faux sans recours à un tiers technique — quand l'expertise humaine devient insuffisante."
  - "Le point de bascule est atteint quand le coût de la certification dépasse celui de la fraude — quand l'économie de la preuve s'inverse."
version: "1.0"
