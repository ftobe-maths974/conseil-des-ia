id: tension-020
phase: tension
chamber: invisibilite-vs-arbitrage
reversibility: green
title: "L'audit algorithmique peut-il être démocratique ?"
content: >
  Des initiatives citoyennes d'audit des IA publiques émergent — journalistes de données, collectifs techniques, associations. Mais l'expertise requise crée une nouvelle élite de l'arbitrage.
data_point: >
  En France, le collectif AlgoJ a publié en 2023 un audit critique du système IA d'attribution des logements sociaux de trois métropoles, pointant des biais géographiques.
question: >
  Qui a légitimement le droit d'auditer les algorithmes qui nous gouvernent, et à quelle condition ?
tags: 
  - audit
  - democratie
  - expertise
  - legitimite
suggestions_bascule:
  - "Le point de bascule est le moment où auditer un algorithme public exige un niveau d'expertise que seule une poignée d'acteurs privés possède — quand la transparence démocratique crée une oligarchie de l'expertise."
  - "Le point de bascule est quand l'audit citoyen devient techniquement impossible sans les outils et données que seules les grandes entreprises détiennent — quand contrôler le contrôleur exige d'être le contrôleur."
version: "1.0"
