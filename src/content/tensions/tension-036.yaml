title: "La compensation carbone algorithmique comme licence de polluer"
content: >
  Certaines entreprises technologiques achètent des crédits carbone pour "neutraliser" l'empreinte de leurs services IA. Ce mécanisme de compensation permet de continuer à croître sans réduire les émissions à la source. Il crée une économie morale où la croissance de la consommation est autorisée par l'achat d'une absolution comptable.
data_point: >
  Microsoft a augmenté ses émissions de CO₂ de 30 % entre 2020 et 2024 en raison de l'expansion de ses datacenters IA, tout en annonçant une neutralité carbone via compensation. L'Agence Internationale de l'Énergie estime que 40 % des crédits carbone actuellement vendus ne correspondent à aucune réduction réelle (IEA, 2024).
question: >
  La compensation carbone est-elle un outil de transition ou un mécanisme de légitimation de la croissance numérique ?
tags:
  - compensation-carbone
  - greenwashing
  - datacenter
  - organisation
suggestions_bascule:
  - "Le point de bascule est le moment où une entreprise IA choisit de réduire sa consommation plutôt que de la compenser — quand la sobriété remplace l'indulgence comptable."
  - "Le point de bascule est atteint quand les régulateurs interdisent la compensation comme argument de neutralité carbone — quand le droit force la réduction à la source."
version: "1.0"
