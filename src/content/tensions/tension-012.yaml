id: tension-012
phase: tension
chamber: metabolisme-vs-progres
reversibility: yellow
title: "Le progrès technique crée les besoins qu'il prétend satisfaire"
content: >
  Chaque amélioration de l'efficacité IA génère de nouveaux usages qui consomment les gains réalisés — l'effet rebond. Une IA deux fois plus efficace traitant dix fois plus de requêtes consomme davantage qu'avant.
data_point: >
  L'effet rebond énergétique a été documenté dans tous les secteurs informatiques depuis les années 1970. Dans l'IA, les projections 2025-2030 prévoient une multiplication par 5 de la consommation malgré les gains d'efficacité.
question: >
  L'efficacité technique peut-elle être une solution au problème de consommation qu'elle contribue à créer ?
tags: 
  - effet-rebond
  - consommation
  - efficacite
  - paradoxe
suggestions_bascule:
  - "Le point de bascule est le moment où l'effet rebond est documenté et prévisible, mais où aucune organisation n'est prête à plafonner ses usages IA pour l'éviter."
  - "Le point de bascule est quand optimiser ne suffit plus et qu'il faut choisir explicitement de ne pas utiliser — quand l'efficacité technique ne peut plus compenser la croissance des usages."
version: "1.0"
