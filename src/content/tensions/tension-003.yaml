id: tension-003
phase: tension
chamber: delegation-vs-souverainete
reversibility: yellow
title: "La souveraineté numérique est une question de couche d'infrastructure"
content: >
  Les nations et organisations qui n'hébergent pas leurs propres modèles délèguent de fait une partie de leur souveraineté décisionnelle à des acteurs étrangers. Les CGU peuvent changer. Les accès peuvent être coupés.
data_point: >
  En 2023, un pays européen a vu son service public de traduction fermer après que le prestataire IA a modifié unilatéralement ses tarifs et conditions de disponibilité.
question: >
  Peut-on parler de souveraineté quand les capacités cognitives critiques reposent sur des serveurs hors territoire ?
tags: 
  - souverainete
  - infrastructure
  - geopolitique
  - dependance
suggestions_bascule:
  - "Le point de bascule est le moment où une organisation n'a plus les compétences internes pour basculer vers un autre fournisseur — quand la dépendance est structurelle, pas seulement contractuelle."
  - "Le point de bascule est quand un État ou une organisation ne peut plus fonctionner normalement si le service IA est coupé unilatéralement — quand la souveraineté décisionnelle est externalisée sans retour."
version: "1.0"
