id: tension-025
phase: tension
chamber: singularite-vs-standard
reversibility: red
title: "Les IA éducatives façonnent ce qu'on appelle apprendre"
content: >
  Quand des millions d'élèves apprennent avec les mêmes outils IA, ces outils définissent implicitement ce que signifie comprendre, mémoriser, raisonner. L'outil éducatif n'est jamais neutre — l'IA encore moins.
data_point: >
  En 2025, Khan Academy estime que 15 millions d'élèves dans le monde utilisent régulièrement son tuteur IA Khanmigo pour faire leurs devoirs et apprendre les mathématiques.
question: >
  Qui décide de ce que doit savoir un enfant quand c'est une IA privée qui lui enseigne ?
tags: 
  - education
  - apprentissage
  - enfants
  - norme
suggestions_bascule:
  - "Le point de bascule est le moment où une génération entière d'élèves a appris à travers le même outil IA — quand la définition de l'intelligence scolaire est fixée par une entreprise privée plutôt que par un débat pédagogique."
  - "Le point de bascule est quand l'outil éducatif IA a si profondément redéfini les normes d'apprentissage qu'un retour à des méthodes antérieures semble régressif ou inefficace — quand le standard pédagogique est privatisé."
version: "1.0"
