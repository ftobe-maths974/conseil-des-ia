title: "La confiance n'a jamais reposé uniquement sur la preuve"
content: >
  Les sociétés humaines ont toujours accordé de la confiance à des récits, des témoignages et des institutions — pas uniquement à des preuves matérielles. L'ère de la simulation force peut-être un retour à des formes de confiance communautaire.
question: >
  La crise de la preuve nous oblige-t-elle à réinventer des formes de vérification sociale plutôt que technique ?
