id: tension-014
phase: tension
chamber: metabolisme-vs-progres
reversibility: green
title: "L'IA peut-elle être l'outil de sa propre régulation environnementale ?"
content: >
  Des modèles IA sont déployés pour optimiser la consommation énergétique des réseaux, prévoir les pics de demande et réduire les gaspillages industriels. La même technologie est à la fois le problème et potentiellement la solution.
data_point: >
  DeepMind a réduit de 40 % la consommation de refroidissement des datacenters Google en 2016 grâce à un modèle IA — soit une économie de plusieurs centaines de millions de kWh par an.
question: >
  Peut-on confier à l'IA la responsabilité de réguler sa propre empreinte écologique ?
tags: 
  - optimisation
  - regulation
  - outil
  - energie
suggestions_bascule:
  - "Le point de bascule est le moment où on confie à l'IA la mesure de sa propre empreinte — quand le système qui pose problème devient aussi le système qui certifie qu'il ne pose plus problème."
  - "Le point de bascule est quand une organisation considère que l'optimisation IA de sa consommation énergétique suffit à justifier l'expansion indéfinie de ses capacités IA."
version: "1.0"
