id: tension-019
phase: tension
chamber: invisibilite-vs-arbitrage
reversibility: red
title: "Les victimes de discrimination algorithmique ne savent pas qu'elles en sont victimes"
content: >
  La discrimination algorithmique est par nature invisible à l'individu. Il ne sait pas qu'il a été défavorisé — et encore moins pourquoi. L'injustice sans témoin est difficile à nommer et impossible à réparer.
question: >
  Que faire d'une injustice que la victime ne peut pas percevoir et que l'auteur peut nier de bonne foi ?
tags: 
  - invisibilite
  - discrimination
  - justice
  - perception
suggestions_bascule:
  - "Le point de bascule est le moment où une discrimination est statistiquement prouvée au niveau d'une population mais où aucun individu ne peut prouver qu'il en est victime — quand l'injustice collective n'a pas de victime individuelle identifiable."
  - "Le point de bascule est quand l'opacité algorithmique rend structurellement impossible toute réparation individuelle d'une discrimination collective documentée."
version: "1.0"
