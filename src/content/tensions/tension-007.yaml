id: tension-007
phase: tension
chamber: preuve-vs-simulation
reversibility: yellow
title: "La détection du faux court toujours un temps de retard"
content: >
  Les outils de détection de deepfakes sont entraînés sur les modèles existants. Chaque nouvelle génération de synthèse dépasse les détecteurs actuels. C'est une course aux armements asymétrique.
data_point: >
  Les meilleurs détecteurs de deepfakes disponibles en 2024 ont un taux d'erreur de 15 à 30 % sur des contenus générés par les derniers modèles.
question: >
  Peut-on concevoir un système de confiance médiatique qui ne repose pas sur la capacité à détecter le faux ?
tags: 
  - detection
  - course
  - asymetrie
  - media
suggestions_bascule:
  - "Le point de bascule est le moment où aucune technologie disponible ne peut distinguer le vrai du faux avec un niveau de confiance suffisant pour un usage juridique ou journalistique."
  - "Le point de bascule est quand les institutions renoncent officiellement à s'appuyer sur la vérification technique — quand la course est perdue et qu'on l'admet."
version: "1.0"
