id: tension-015
phase: tension
chamber: metabolisme-vs-progres
reversibility: red
title: "La sobriété numérique est politiquement invendable"
content: >
  Réduire l'usage de l'IA impliquerait des sacrifices de confort, d'efficacité et de compétitivité que peu d'acteurs sont prêts à assumer. La sobriété volontaire reste marginale tant que la croissance reste la norme.
question: >
  Peut-on désirer collectivement moins d'IA quand l'IA offre plus de confort, de vitesse et d'accès ?
tags: 
  - sobriete
  - politique
  - desir
  - croissance
suggestions_bascule:
  - "Le point de bascule est le moment où un acteur qui prône la sobriété numérique perd en compétitivité face à des concurrents sans contrainte — quand la responsabilité individuelle devient un désavantage structurel."
  - "Le point de bascule est quand aucune force politique significative n'est capable de proposer une réduction de l'usage IA sans perdre des voix ou des parts de marché — quand la sobriété devient inéligible."
version: "1.0"
