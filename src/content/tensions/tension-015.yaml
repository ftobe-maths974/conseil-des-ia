title: "La sobriété numérique est politiquement invendable"
content: >
  Réduire l'usage de l'IA impliquerait des sacrifices de confort, d'efficacité et de compétitivité que peu d'acteurs sont prêts à assumer. La sobriété volontaire reste marginale tant que la croissance reste la norme.
question: >
  Peut-on désirer collectivement moins d'IA quand l'IA offre plus de confort, de vitesse et d'accès ?
