title: "La discrimination indirecte sans intention"
content: >
  Aucun paramètre de CITIZEN-SCAN ne mentionne l'origine, la religion ou la nationalité.
  Et pourtant, les données montrent que les usagers avec des prénoms à consonance
  maghrébine ou africaine sont surreprésentés dans les dépriorisations. Pas par
  intention : par corrélation avec d'autres variables elles-mêmes socialement construites
  — mobilité résidentielle, configurations familiales, patterns de consommation.
  La discrimination est réelle. Personne ne l'a voulue. Et pourtant elle se reproduit.
data_point: >
  Des études menées en France sur les algorithmes de crédit et de logement social
  montrent des taux de refus 1,8 à 2,4 fois supérieurs pour les demandeurs
  aux noms d'origine étrangère, à revenus et situations comparables.
question: >
  Une discrimination algorithmique non intentionnelle mais statistiquement prouvée
  engage-t-elle la responsabilité de l'institution qui déploie le système ?
tags:
  - discrimination-indirecte
  - biais
  - responsabilite
  - intention
facilitator_note:
  si_silence: "Demandez : si les données montrent une surreprésentation dans les refus corrélée à un prénom, et que L'Agence le sait — à partir de quand l'inaction devient-elle une intention ?"
  si_debat_bloque: "Changez de plan : le problème n'est pas le biais dans le modèle, c'est le biais dans les données de la société — peut-on corriger l'algorithme sans corriger ce qui l'alimente ?"
  relance_cle: "La vraie question : l'absence d'intention discriminatoire exonère-t-elle d'une obligation de résultat en matière d'égalité de traitement ?"
version: "1.0"
