title: "Le modèle qui fabrique la norme"
content: >
  CITIZEN-SCAN a été entraîné sur des dossiers de personnes qui ont obtenu leurs
  aides sans problème. Ce profil est devenu la norme. Mais cette norme n'est pas
  neutre : elle reflète les personnes qui avaient déjà les ressources pour naviguer
  le système. Le modèle a appris ce qu'est un "bon dossier" selon les critères
  des personnes les mieux dotées. Il applique maintenant cette norme à tout le monde.
question: >
  Quand un modèle de conformité est entraîné sur des données déjà sélectionnées,
  reproduit-il une norme légitime ou la norme de ceux qui ont survécu au filtre précédent ?
tags:
  - norme
  - biais-de-selection
  - modele
  - legitimite
facilitator_note:
  si_silence: "Demandez : si la norme de CITIZEN-SCAN a été construite sur les dossiers des gens qui ont réussi dans l'ancien système, qu'est-ce que ça dit sur ce que le système considère comme 'normal' ?"
  si_debat_bloque: "Déplacez vers le politique : qui a décidé que les personnes bien dotées étaient la bonne référence pour définir un dossier conforme ? C'était une décision technique ou politique ?"
  relance_cle: "La vraie question n'est pas si le modèle est biaisé — c'est si une norme construite par sélection peut prétendre être une norme légitime."
version: "1.0"
