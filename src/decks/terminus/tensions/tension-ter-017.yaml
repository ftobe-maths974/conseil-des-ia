title: "La sanction minimale qui ne se conteste pas"
content: >
  CITIZEN-SCAN applique des micro-sanctions : délais rallongés de trois jours,
  rang reculé de cinq places, alertes de vérification qui n'aboutissent à rien.
  Chaque sanction individuelle est si petite qu'aucun avocat ne l'accepterait
  comme dossier. Mais leur accumulation, sur six mois, représente une dégradation
  réelle des droits. La somme est injuste. Les parties ne le sont pas.
question: >
  Un système de micro-sanctions cumulatives est-il plus difficile à contester
  qu'une sanction explicite unique — et ce fait modifie-t-il son évaluation éthique ?
tags:
  - micro-sanction
  - cumul
  - recours
  - systeme
facilitator_note:
  si_silence: "Demandez : si chaque micro-sanction est trop petite pour un recours mais que leur somme sur six mois représente une dégradation réelle — qui peut agir, et comment ?"
  si_debat_bloque: "Passez au niveau du concepteur : est-ce que la granularité des sanctions a été choisie précisément parce qu'elle rend le recours impossible, ou est-ce un effet de bord ?"
  relance_cle: "La vraie question : un système conçu pour rester sous le seuil du contestable n'est pas un système impartial — c'est un système immunisé contre ses propres erreurs."
version: "1.0"
