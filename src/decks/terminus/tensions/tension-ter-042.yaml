id: tension-ter-042
phase: tension
slot: 6
slot_theme: organisation
chamber: metabolisme-vs-progres
reversibility: red
title: "La surveillance qui crée ce qu'elle cherche à éviter"
content: >
  Depuis l'introduction des capteurs de présence, plusieurs bénéficiaires d'aides
  ont commencé à héberger leurs proches de façon non déclarée pour éviter que leur
  présence soit détectée. D'autres ont cessé d'utiliser leurs droits pour ne pas
  être suivis. La surveillance a créé des comportements d'évitement qui ressemblent
  exactement aux anomalies qu'elle cherchait à détecter.
question: >
  Quand un système de surveillance produit les comportements suspects qu'il
  était censé détecter, est-ce un échec du dispositif ou une confirmation de sa logique ?
tags:
  - surveillance
  - comportement-evitement
  - contre-productif
  - detection
facilitator_note:
  si_silence: "Demandez : si des personnes cessent d'utiliser leurs droits pour ne pas être suivies, est-ce que le système a atteint son objectif — ou est-ce qu'il a produit quelque chose de plus grave ?"
  si_debat_bloque: "Poussez sur la logique du système : si la surveillance produit les comportements d'évitement qu'elle voulait détecter, est-ce un échec technique ou le résultat logique de toute surveillance intensive ?"
  relance_cle: "La vraie question n'est pas si le dispositif fonctionne — c'est si un système qui pousse des personnes à renoncer à leurs droits pour éviter d'être surveillées remplit encore sa mission."
version: "1.0"
