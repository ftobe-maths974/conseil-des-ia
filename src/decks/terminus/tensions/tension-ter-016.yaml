title: "L'explication qui simplifie trop"
content: >
  Pour rendre CITIZEN-SCAN contestable, L'Agence propose d'expliquer les décisions
  par des résumés automatiques en langage simple : "Votre dossier a été ralenti en
  raison d'une anomalie dans vos données de mobilité." Ces résumés sont générés
  par un second algorithme. Ils sont compréhensibles. Ils ne sont pas nécessairement
  vrais : le résumé simplifie un calcul matriciel de 140 variables en une phrase.
question: >
  Une explication compréhensible mais inexacte vaut-elle mieux qu'une explication
  exacte mais incompréhensible — ou les deux sont-elles également insuffisantes pour garantir le droit au recours ?
tags:
  - explication
  - complexite
  - droit-au-recours
  - simplification
facilitator_note:
  si_silence: "Demandez : si vous recevez l'explication 'anomalie dans vos données de mobilité' et que c'est faux mais compréhensible, que faites-vous — et que pouvez-vous contester réellement ?"
  si_debat_bloque: "Changez d'acteur : un avocat spécialisé en droit administratif — peut-il construire un recours sur une explication générée par un second algorithme qui simplifie le premier ?"
  relance_cle: "La vraie question : une explication qui permet de se sentir informé sans permettre de contester n'est pas un droit au recours, c'est une mise en scène de ce droit."
version: "1.0"
