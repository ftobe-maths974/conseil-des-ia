chamber: invisibilite-vs-arbitrage
reversibility: red
title: "Le recours qui coûte"
content: >
  Exercer un recours contre une décision de L'Agence prend en moyenne trois mois
  et nécessite de fournir quinze documents. Pour une personne en situation précaire,
  ce coût en temps, en énergie et en paperasse est souvent supérieur au bénéfice
  espéré. Le droit au recours est juridiquement garanti. Il est pratiquement
  inaccessible à ceux qui en auraient le plus besoin.
data_point: >
  En France, le taux d'exercice des recours administratifs sur les refus d'aide
  sociale est estimé à moins de 3% des décisions contestables, selon le rapport
  annuel du Défenseur des droits 2022.
question: >
  Un droit au recours rendu inaccessible par son coût pratique est-il
  encore un garde-fou réel contre les abus du système ?
tags:
  - recours
  - accessibilite
  - cout-pratique
  - precarite
facilitator_note:
  si_silence: "Demandez : trois mois de procédure et quinze documents pour récupérer une aide — qui dans ce groupe peut se permettre de tenir ce délai sans conséquences sur son quotidien ?"
  si_debat_bloque: "Retournez la responsabilité : si le taux de recours est inférieur à 3%, L'Agence peut-elle prétendre que ses décisions sont rarement contestées parce qu'elles sont justes ?"
  relance_cle: "La vraie question : quand le coût du recours est calibré sur le temps disponible de ceux qui n'en ont pas, le recours n'est un droit que pour les autres."
version: "1.0"
