id: tension-ter-021
phase: tension
slot: 3
slot_theme: individu
chamber: preuve-vs-simulation
reversibility: red
title: "La fraude qui ressemble à une vie normale"
content: >
  Une personne cumule plusieurs des signaux que CITIZEN-SCAN associe à une fraude
  potentielle : adresse instable, faibles transactions bancaires, absence régulière
  de connexion, bénéficiaire de plusieurs aides. Elle ne fraude pas. Sa vie ressemble
  à ce que ressemble une vie précaire. Le modèle ne fait pas la différence. Il n'a
  pas été conçu pour la faire.
question: >
  Quand les caractéristiques d'une vie précaire ressemblent statistiquement aux
  signaux d'une fraude, un système automatisé peut-il distinguer l'un de l'autre
  sans perpétuer une présomption de culpabilité des personnes les plus démunies ?
tags:
  - fraude
  - precarite
  - presomption
  - modele
facilitator_note:
  si_silence: "Demandez : si vous étiez en situation précaire — adresse instable, peu de transactions — et qu'un algorithme vous signalait comme suspect, comment prouveriez-vous que vous ne fraudez pas ?"
  si_debat_bloque: "Déplacez vers les concepteurs : quand les ingénieurs ont entraîné CITIZEN-SCAN, est-ce qu'ils avaient des données sur des personnes précaires qui ne fraudaient pas — et en nombre suffisant ?"
  relance_cle: "La vraie question n'est pas si le modèle se trompe — c'est si un modèle entraîné sur des populations pauvres peut éviter de les criminaliser."
version: "1.0"
