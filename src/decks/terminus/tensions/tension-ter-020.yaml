title: "La preuve qui n'est pas la réalité"
content: >
  Pour maintenir son score, une étudiante a appris à se connecter tous les deux
  jours à l'espace personnel de L'Agence, même quand elle n'a rien à faire. Elle
  génère de la trace pour le système, pas pour elle. Elle se comporte en fonction
  de ce que le système attend, pas en fonction de sa propre situation. Elle est
  conforme. Et pourtant quelque chose s'est déplacé : elle gère sa vie en fonction
  d'un algorithme qu'elle ne connaît pas.
question: >
  Quand une personne adapte ses comportements réels pour satisfaire les attentes
  d'un système de surveillance, qui est encore authentique — la personne ou sa trace ?
tags:
  - conformite
  - comportement
  - authenticity
  - adaptation
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un ici a déjà changé son comportement en sachant qu'il était observé — au travail, en voiture, en ligne ?"
  si_debat_bloque: "Poussez la logique : si tout le monde se comporte en fonction de l'algorithme, les données reflètent les attentes du système, pas la réalité des gens. Que mesure-t-on encore ?"
  relance_cle: "La vraie question n'est pas si elle triche — c'est si un système de contrôle qui modifie les comportements peut encore prétendre mesurer quelque chose de réel."
version: "1.0"
