chamber: invisibilite-vs-arbitrage
reversibility: green
title: "Ne pas savoir ce qu'on n'a pas obtenu"
content: >
  Quand CITIZEN-SCAN dépriorise un dossier, la personne concernée ne reçoit pas
  de notification. Elle attend simplement plus longtemps sans savoir pourquoi.
  Elle peut attribuer ce délai à la surcharge des services, à une erreur, à sa
  propre situation. Elle ne sait pas qu'un algorithme a décidé qu'elle était moins
  urgente que d'autres. L'absence d'information préserve la paix sociale — mais
  elle empêche toute contestation fondée.
question: >
  Une décision qui ne se sait pas est-elle moins dommageable qu'une décision
  explicite, ou plus difficile à contester et donc plus dangereuse ?
tags:
  - invisibilite
  - notification
  - contestation
  - depriorisation
facilitator_note:
  si_silence: "Demandez : si vous attendez depuis trois semaines et que personne ne vous dit pourquoi, à quel moment décidez-vous de relancer — et sur quelle base ?"
  si_debat_bloque: "Changez d'acteur : un travailleur social qui accompagne l'usager — comment peut-il l'aider à contester une décision dont ni lui ni l'usager ne connaissent l'existence ?"
  relance_cle: "La vraie question : une décision invisible n'est pas une décision absente — c'est une décision à l'abri de tout recours."
version: "1.0"
