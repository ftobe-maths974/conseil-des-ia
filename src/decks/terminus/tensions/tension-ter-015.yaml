id: tension-ter-015
phase: tension
slot: 6
slot_theme: organisation
chamber: invisibilite-vs-arbitrage
reversibility: red
title: "L'audit qui déstabilise"
content: >
  L'Agence commande un audit indépendant de CITIZEN-SCAN. L'audit identifie
  des biais significatifs. Publier les résultats permettrait aux personnes lésées
  de contester leurs décisions — mais créerait aussi un afflux de recours que
  L'Agence n'a pas les moyens de traiter et remettrait en cause des milliers de
  décisions passées. La direction hésite entre transparence et stabilité opérationnelle.
question: >
  Une institution peut-elle légitimement retarder la publication d'un audit
  révélant des biais pour préserver sa capacité opérationnelle à traiter les conséquences ?
tags:
  - audit
  - publication
  - recours
  - stabilite
facilitator_note:
  si_silence: "Demandez : L'Agence a commandé l'audit — elle en connaît les résultats — et elle hésite à le publier : à qui appartient ce rapport, et qui décide de sa diffusion ?"
  si_debat_bloque: "Passez au niveau des personnes lésées : elles ont subi des décisions biaisées sans le savoir — leur absence de connaissance leur retire-t-elle le droit à une réparation ?"
  relance_cle: "La vraie question : retarder la publication d'un audit pour raisons opérationnelles, c'est choisir la stabilité de l'institution contre la justice due aux usagers."
version: "1.0"
