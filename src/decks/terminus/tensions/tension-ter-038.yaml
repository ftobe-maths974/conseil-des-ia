title: "La charge cognitive de la conformité"
content: >
  Maintenir son dossier conforme à CITIZEN-SCAN demande un travail invisible constant :
  se connecter régulièrement, déclarer ses activités, télécharger les bons documents,
  répondre aux alertes dans les délais. Ce travail est simple pour qui dispose de
  temps, d'un bon internet et de compétences numériques. Il est épuisant pour une
  personne qui jongle entre un emploi précaire, des enfants et une santé fragile.
  La charge de conformité est inégalement répartie.
question: >
  Quand le maintien de ses droits requiert un travail administratif constant,
  ce travail est-il neutre — ou avantage-t-il ceux qui ont déjà le plus de ressources ?
tags:
  - charge-cognitive
  - inegalite
  - conformite
  - numerique
facilitator_note:
  si_silence: "Demandez : combien de temps par semaine pensez-vous qu'une personne précaire devrait consacrer à la gestion administrative de ses droits pour ne pas les perdre ?"
  si_debat_bloque: "Inversez la logique : si la charge de conformité est plus lourde pour les personnes les plus fragiles, est-ce que le système sélectionne les personnes capables de le supporter plutôt que celles qui ont besoin d'aide ?"
  relance_cle: "La vraie question n'est pas si les démarches sont simples — c'est si un système dont la charge pèse le plus sur les plus fragiles peut prétendre être un système d'aide."
version: "1.0"
