id: tension-ter-031
phase: tension
slot: 4
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: green
title: "La standardisation qui accélère l'accès"
content: >
  Grâce à CITIZEN-SCAN, L'Agence a réduit ses délais de traitement de 85%.
  Ce gain profite à la majorité des usagers dont les situations sont standard.
  Mais il a été obtenu en supprimant les procédures d'exception individuelles,
  jugées trop coûteuses. L'amélioration globale masque une dégradation spécifique :
  les personnes en situation atypique attendent maintenant deux fois plus longtemps
  qu'avant pour obtenir un traitement manuel.
question: >
  Une amélioration qui profite à la majorité mais aggrave la situation d'une
  minorité déjà fragile constitue-t-elle un progrès équitable ?
tags:
  - standardisation
  - equite
  - minorite
  - efficacite
facilitator_note:
  si_silence: "Demandez : si 85% des usagers sont traités deux fois plus vite mais que les 15% restants attendent deux fois plus longtemps, est-ce que cette amélioration mérite d'être présentée comme un progrès sans réserve ?"
  si_debat_bloque: "Poussez sur la définition du progrès : qui a défini que l'efficacité globale était le bon indicateur — et pourquoi les personnes en situation atypique ne sont-elles pas incluses dans ce calcul ?"
  relance_cle: "La vraie question n'est pas si le système est plus efficace — c'est si une efficacité qui aggrave la situation des plus fragiles constitue un progrès pour un service public."
version: "1.0"
