id: tension-ter-023
phase: tension
slot: 5
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: yellow
title: "Vérifier pour protéger, surveiller pour contrôler"
content: >
  L'Agence a justifié l'introduction des capteurs de présence dans les logements
  sociaux comme une mesure de protection des locataires isolés : détecter une
  personne âgée qui ne bouge plus. Mais le même dispositif sert également à vérifier
  la conformité des bénéficiaires d'aides. Le capteur bienveillant et le capteur
  de contrôle sont techniquement identiques. Seul l'usage diffère. Et l'usage change.
question: >
  Un dispositif de surveillance déployé pour protéger peut-il être reconfiguré
  pour contrôler — et cette ambivalence technologique change-t-elle son évaluation éthique ?
tags:
  - double-usage
  - surveillance
  - protection
  - controle
facilitator_note:
  si_silence: "Demandez : si vous installiez un capteur dans votre appartement pour que L'Agence détecte une urgence médicale, accepteriez-vous qu'il serve aussi à vérifier que vous respectez vos obligations ?"
  si_debat_bloque: "Poussez sur le moment du basculement : à quel moment précis un dispositif de protection devient-il un outil de contrôle — et qui décide que ce moment est arrivé ?"
  relance_cle: "La vraie question n'est pas l'intention initiale — c'est que rien dans la technologie n'empêche l'usage de changer, et que cela suffit à changer son évaluation éthique."
version: "1.0"
