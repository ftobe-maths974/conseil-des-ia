title: "Interopérabilité ou homogénéisation forcée"
content: >
  Pour que CITIZEN-SCAN fonctionne au niveau national, L'Agence a imposé à tous
  ses partenaires locaux un format de données unique. Les associations d'aide sociale
  qui avaient développé leurs propres systèmes de suivi — mieux adaptés à leurs
  populations — ont dû les abandonner. L'interopérabilité nationale a été obtenue
  en effaçant les adaptations locales. Les données sont maintenant comparables.
  Elles sont aussi moins pertinentes pour les cas qui s'écartent de la norme nationale.
question: >
  Quand l'interopérabilité d'un système national efface les adaptations locales
  plus pertinentes pour certaines populations, quel est le vrai bénéfice de l'unification ?
tags:
  - interoperabilite
  - standardisation
  - local
  - national
facilitator_note:
  si_silence: "Demandez : si une association locale avait un système mieux adapté à sa population et qu'on lui a demandé de l'abandonner pour s'aligner sur le national, qu'est-ce qui a été perdu — et pour qui ?"
  si_debat_bloque: "Retournez la question vers le politique : qui a décidé que l'uniformité nationale valait plus que la pertinence locale — et est-ce que ce choix a été explicite ou silencieux ?"
  relance_cle: "La vraie question n'est pas si l'interopérabilité est utile — c'est si l'unification a effacé une diversité qui protégeait des populations que la norme nationale ne voit pas."
version: "1.0"
