title: "Le progrès qui efface le lien"
content: >
  Avant CITIZEN-SCAN, certains agents de L'Agence connaissaient leurs usagers.
  Ils savaient qui appelait chaque semaine, qui avait des enfants malades, qui
  avait peur de perdre son logement. Ce lien avait une valeur difficile à mesurer :
  il permettait de détecter ce qu'aucun algorithme ne peut voir. Il a disparu.
  Les usagers sont maintenant des profils. Les agents des superviseurs d'alertes.
  Le service est plus rapide. Il est aussi plus vide.
question: >
  Quand l'optimisation d'un service public détruit les relations humaines
  qui lui donnaient une partie de son efficacité, peut-on encore parler de progrès ?
tags:
  - lien-humain
  - relation
  - optimisation
  - service-public
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un ici a vécu une situation où le fait qu'un agent vous connaisse personnellement a changé quelque chose — dans une administration, une banque, un hôpital ?"
  si_debat_bloque: "Poussez sur la mesure : si le lien humain permettait de détecter des situations qu'aucun algorithme ne peut voir, est-ce que sa disparition a un coût — et comment le calculerait-on ?"
  relance_cle: "La vraie question n'est pas si le service est plus rapide — c'est si un service public qui a supprimé les relations humaines pour les remplacer par des profils est encore un service public."
version: "1.0"
