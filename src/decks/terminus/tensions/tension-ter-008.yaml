chamber: delegation-vs-souverainete
reversibility: yellow
title: "La souveraineté fragmentée"
content: >
  CITIZEN-SCAN agrège des données provenant de douze systèmes différents : CAF,
  Pôle emploi, impôts, transport, santé, logement. Chacune de ces institutions a
  délégué ses données à un opérateur privé unique qui les croise. Aucune d'elles
  ne voit le tableau complet. Chacune est souveraine sur son fragment. Mais leur
  combinaison produit une décision que nulle n'aurait pu ni voulu prendre seule.
question: >
  Peut-on parler de souveraineté institutionnelle quand chaque acteur ne contrôle
  qu'une partie d'un système dont l'effet global n'appartient à personne ?
tags:
  - souverainete
  - interoperabilite
  - fragmentation
  - responsabilite-collective
facilitator_note:
  si_silence: "Demandez : si une décision de CITIZEN-SCAN lèse quelqu'un, quelle institution parmi les douze alimentatrices est responsable — et qui peut répondre devant un tribunal ?"
  si_debat_bloque: "Déplacez vers un autre domaine : est-ce différent de ce qui se passe avec les données de santé entre l'hôpital, la sécurité sociale et le médecin traitant ?"
  relance_cle: "La vraie question : la souveraineté fragmentée n'est pas une souveraineté partagée — c'est une souveraineté que personne n'exerce."
version: "1.0"
