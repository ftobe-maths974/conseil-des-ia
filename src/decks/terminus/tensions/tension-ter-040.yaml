id: tension-ter-040
phase: tension
slot: 4
slot_theme: organisation
chamber: metabolisme-vs-progres
reversibility: green
title: "La maintenance invisible"
content: >
  CITIZEN-SCAN nécessite une équipe de 12 personnes dédiées à sa maintenance,
  ses mises à jour et la gestion des incidents. Cette équipe travaille en permanence
  mais son coût n'apparaît pas dans les tableaux de bord de L'Agence. Quand la
  direction annonce des économies, elle ne compte pas l'infrastructure humaine
  nécessaire pour que l'automatisation fonctionne. Elle comptabilise les postes
  supprimés, pas les postes déplacés vers la maintenance du système.
question: >
  Les économies annoncées par l'automatisation sont-elles réelles quand elles
  ne comptabilisent pas la charge de maintenance qu'elles déplacent vers d'autres équipes ?
tags:
  - maintenance
  - comptabilite
  - cout-cache
  - automatisation
facilitator_note:
  si_silence: "Demandez : si L'Agence a supprimé 40 postes grâce à l'automatisation mais embauché 12 personnes pour maintenir le système, est-ce qu'on peut encore parler d'économies nettes ?"
  si_debat_bloque: "Poussez sur la comptabilité politique : pourquoi les postes supprimés apparaissent dans les tableaux de bord comme une réussite, mais pas les postes créés pour la maintenance ?"
  relance_cle: "La vraie question n'est pas si l'automatisation réduit les coûts — c'est si les économies annoncées sont réelles ou si elles déplacent simplement des coûts vers des cases qui ne sont pas comptées."
version: "1.0"
