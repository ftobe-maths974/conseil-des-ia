id: tension-ter-033
phase: tension
slot: 6
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: red
title: "Adapter le système ou adapter les gens"
content: >
  L'Agence a ouvert des ateliers d'accompagnement numérique pour aider les usagers
  à "optimiser leur profil CITIZEN-SCAN". Les participants apprennent à se connecter
  régulièrement, à déclarer leurs activités, à éviter les comportements qui déclenchent
  des alertes. Le système ne change pas. Ce sont les usagers qui apprennent à lui
  ressembler. L'adaptation va dans un seul sens.
question: >
  Quand une institution aide les usagers à s'adapter à un algorithme plutôt
  qu'à adapter l'algorithme aux usagers, quel est le sens réel de cette aide ?
tags:
  - adaptation
  - formation
  - conformite
  - direction
facilitator_note:
  si_silence: "Demandez : si L'Agence organisait des ateliers pour aider les usagers à optimiser leur score CITIZEN-SCAN, est-ce qu'elle les aide à obtenir leurs droits ou à paraître conformes ?"
  si_debat_bloque: "Retournez la logique : si les usagers apprennent à ressembler à ce que le système attend d'eux, les données du système deviennent-elles plus vraies ou plus fausses ?"
  relance_cle: "La vraie question n'est pas si l'accompagnement est utile — c'est de quel côté une institution publique doit exercer sa pression : sur les usagers ou sur son propre système."
version: "1.0"
