title: "La sanction qu'on mérite peut-être"
content: >
  Un usager a vu son score baisser après avoir déménagé trois fois en un an.
  Le système a interprété cette mobilité comme un signal d'instabilité. Dans
  les faits, il fuyait un logement insalubre. Il n'a pas fait de signalement.
  Il ne savait pas que ses déménagements étaient surveillés. La sanction repose
  sur une interprétation plausible d'un comportement réel. Elle est injuste dans
  son cas précis et peut-être juste en moyenne statistique.
question: >
  Une sanction algorithmique fondée sur un comportement réel mais mal interprété
  est-elle une erreur à corriger ou une conséquence acceptable d'un système de masse ?
tags:
  - interpretation
  - sanction
  - mobilite
  - contexte
facilitator_note:
  si_silence: "Demandez : l'usager ne savait pas que ses déménagements étaient surveillés — à quel moment aurait-il dû le savoir, et qui aurait dû le lui dire ?"
  si_debat_bloque: "Inversez la charge : si le système doit prouver qu'une interprétation est juste plutôt que l'usager prouver qu'elle est fausse, qu'est-ce que ça change dans la conception ?"
  relance_cle: "La vraie question : une sanction juste en moyenne mais injuste dans ce cas précis — pour qui conçoit-on ce système ?"
version: "1.0"
