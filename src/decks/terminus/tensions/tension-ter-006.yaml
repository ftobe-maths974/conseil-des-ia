chamber: delegation-vs-souverainete
reversibility: red
title: "La tutelle qui ne contrôle plus"
content: >
  L'autorité de tutelle de L'Agence reçoit chaque trimestre un rapport d'activité
  de CITIZEN-SCAN. Ce rapport indique des taux de traitement, des délais, des
  économies réalisées. Il n'indique pas les critères actifs, les erreurs de
  classification, ni les catégories de personnes surreprésentées dans les refus.
  La tutelle approuve les rapports sans pouvoir vérifier ce qu'elle approuve réellement.
question: >
  Quand l'autorité de contrôle ne peut plus évaluer ce qu'elle est censée contrôler,
  la délégation de pouvoir est-elle encore démocratiquement légitime ?
tags:
  - tutelle
  - controle
  - legitimite
  - democratie
facilitator_note:
  si_silence: "Demandez : si un élu de la tutelle approuve un rapport trimestriel sans pouvoir vérifier les critères actifs de CITIZEN-SCAN, qu'est-ce qu'il approuve réellement ?"
  si_debat_bloque: "Passez au niveau parlementaire : un député peut-il voter un budget pour un système dont il ne peut pas lire le fonctionnement — et est-ce différent de ce qui se passe ici ?"
  relance_cle: "La vraie question : la délégation démocratique suppose qu'on peut évaluer ce qu'on délègue — quand c'est impossible, le mandat démocratique est rompu."
version: "1.0"
