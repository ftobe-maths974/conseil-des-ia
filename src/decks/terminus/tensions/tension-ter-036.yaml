id: tension-ter-036
phase: tension
slot: 9
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: red
title: "La diversité des situations comme risque systémique"
content: >
  Plus CITIZEN-SCAN intègre des exceptions et des cas particuliers, plus il devient
  complexe et imprévisible. Les ingénieurs de l'opérateur expliquent qu'au-delà
  d'un certain niveau de complexité, le modèle devient instable et ses décisions
  plus difficiles à expliquer. La reconnaissance de la singularité a un coût
  technique réel. Le système le plus équitable n'est peut-être pas le plus fiable.
question: >
  Peut-on concevoir un système d'aide automatisé qui soit à la fois équitable
  envers toutes les situations de vie et techniquement auditable ?
tags:
  - complexite
  - equite
  - fiabilite
  - audit
facilitator_note:
  si_silence: "Demandez : si les ingénieurs disent qu'intégrer plus d'exceptions rend le système instable et moins auditable, est-ce une contrainte technique ou une raison de ne pas chercher à être équitable ?"
  si_debat_bloque: "Poussez vers la décision politique : si on ne peut pas avoir à la fois équité maximale et auditabilité maximale, qui doit décider du compromis — les ingénieurs ou les élus ?"
  relance_cle: "La vraie question n'est pas si c'est techniquement difficile — c'est si la difficulté technique est une raison suffisante pour renoncer à l'équité."
version: "1.0"
