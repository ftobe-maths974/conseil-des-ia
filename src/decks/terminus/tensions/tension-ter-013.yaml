id: tension-ter-013
phase: tension
slot: 4
slot_theme: organisation
chamber: invisibilite-vs-arbitrage
reversibility: green
title: "La transparence qui facilite la fraude"
content: >
  L'Agence refuse de publier les critères de CITIZEN-SCAN en invoquant le risque
  d'optimisation frauduleuse : si les critères sont connus, certains pourront
  adapter leur comportement pour gonfler leur score sans mériter l'aide. L'argument
  est réel. Mais il justifie l'opacité pour tout le monde — y compris les personnes
  de bonne foi qui veulent comprendre pourquoi elles ont été défavorisées.
question: >
  L'opacité d'un système public peut-elle se justifier par la protection contre
  la fraude quand elle prive également les personnes légitimes d'une possibilité de recours ?
tags:
  - opacite
  - fraude
  - justification
  - transparence
facilitator_note:
  si_silence: "Demandez : si les critères de CITIZEN-SCAN étaient publics, combien d'usagers de bonne foi changeraient leur comportement — et est-ce un problème ou une solution ?"
  si_debat_bloque: "Déplacez vers le droit : un juge peut-il valider un refus d'aide dont les critères sont secrets — et si oui, le contrôle juridictionnel a-t-il encore un sens ?"
  relance_cle: "La vraie question : l'opacité protège-t-elle vraiment contre la fraude, ou protège-t-elle surtout le système contre ses propres erreurs ?"
version: "1.0"
