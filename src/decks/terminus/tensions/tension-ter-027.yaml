title: "La fraude détectée et la vie détruite"
content: >
  CITIZEN-SCAN a détecté une fraude avérée dans 0,8% des dossiers contrôlés.
  Pour atteindre ce résultat, il a déclenché des procédures de contrôle sur
  14% des dossiers. Parmi les 13,2% sans fraude, plusieurs ont vécu des
  suspensions de droits pendant plusieurs semaines. Certains n'ont pas réussi
  à payer leur loyer. Le système "fonctionne". Il produit aussi des dommages
  collatéraux non comptabilisés.
question: >
  Quel taux de dommages causés à des personnes innocentes est-il acceptable
  pour garantir la détection d'une fraude dans un système d'aide sociale ?
tags:
  - taux-faux-positif
  - fraude
  - dommages
  - proportionnalite
facilitator_note:
  si_silence: "Demandez : parmi les 13,2% de dossiers contrôlés sans fraude, certains n'ont pas pu payer leur loyer. Est-ce que ce coût est comptabilisé quelque part dans l'évaluation du système ?"
  si_debat_bloque: "Posez la question en termes de budget : si corriger les dommages causés aux 13,2% coûtait plus cher que les fraudes récupérées sur les 0,8%, le système serait-il maintenu ?"
  relance_cle: "La vraie question n'est pas si le taux de détection est bon — c'est si les dommages causés aux innocents sont comptabilisés ou externalisés."
version: "1.0"
