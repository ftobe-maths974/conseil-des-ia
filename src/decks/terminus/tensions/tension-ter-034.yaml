id: tension-ter-034
phase: tension
slot: 7
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: green
title: "L'exception comme soupape ou comme droit"
content: >
  L'Agence a prévu une procédure d'exception pour les situations non standard.
  Elle est utilisée dans 0,3% des dossiers. Les agents qui l'instruisent signalent
  qu'ils sont soumis à une pression informelle pour en limiter le recours : trop
  d'exceptions "créent un précédent" et "complexifient le système". L'exception
  existe comme soupape de sécurité. Pas comme droit.
question: >
  Une procédure d'exception conçue pour être rarement utilisée peut-elle
  constituer un droit réel pour les personnes qui en ont besoin ?
tags:
  - exception
  - pression-interne
  - droit
  - pression
facilitator_note:
  si_silence: "Demandez : si vous étiez agent à L'Agence et qu'on vous disait informellement de ne pas trop utiliser la procédure d'exception pour ne pas créer de précédent, que feriez-vous ?"
  si_debat_bloque: "Poussez sur la définition du droit : si une procédure d'exception est prévue mais découragée en pratique, est-elle encore un droit ou une faveur ?"
  relance_cle: "La vraie question n'est pas si la procédure existe — c'est si un droit qu'on presse les agents de ne pas exercer est encore un droit."
version: "1.0"
