id: tension-ter-028
phase: tension
slot: 1
slot_theme: individu
chamber: singularite-vs-standard
reversibility: green
title: "Vivre autrement dans un système conçu pour la norme"
content: >
  Sofia, 28 ans, vit dans un van aménagé par choix. Elle travaille en freelance,
  change de département régulièrement, ne paie pas de loyer fixe. CITIZEN-SCAN
  n'a pas de catégorie pour elle. Son score est bas non parce qu'elle est précaire
  mais parce qu'elle est mobile et non standardisée. Ses droits sont réduits en
  conséquence. Elle n'a rien demandé. Elle a juste choisi de vivre autrement.
question: >
  Un système d'aide conçu pour une norme de vie sédentaire et standardisée
  peut-il être équitable envers des personnes qui ont choisi de ne pas y entrer ?
tags:
  - mobilite
  - norme
  - non-standard
  - equite
facilitator_note:
  si_silence: "Demandez : si Sofia avait choisi de vivre en van non par choix mais par nécessité, est-ce que ça changerait quelque chose à la réponse du système — et pourquoi ça changerait quelque chose pour nous ?"
  si_debat_bloque: "Inversez la charge : est-ce à Sofia de prouver qu'elle mérite des droits selon les critères du système, ou au système de s'adapter à des modes de vie légitimes mais non standards ?"
  relance_cle: "La vraie question n'est pas si Sofia a fait un bon choix — c'est si un système public peut légitimement pénaliser des modes de vie légaux qui ne ressemblent pas à la norme."
version: "1.0"
