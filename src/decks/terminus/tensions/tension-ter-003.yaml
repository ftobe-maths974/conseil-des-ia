id: tension-ter-003
phase: tension
slot: 3
slot_theme: individu
chamber: delegation-vs-souverainete
reversibility: red
title: "Le mandat qu'on n'a pas donné"
content: >
  Quand une personne dépose une demande à L'Agence, elle consent implicitement
  à ce que ses données soient traitées. Mais personne ne l'a informée que ce
  traitement serait délégué à un algorithme privé, que ses habitudes de mobilité
  seraient analysées, ou que des critères comportementaux entreraient dans le calcul.
  Le mandat confié à L'Agence ne couvrait pas CITIZEN-SCAN. Pourtant, la décision
  s'applique à elle.
question: >
  Quand une institution délègue son pouvoir de décision à un tiers sans consulter
  les personnes concernées, le consentement initial tient-il encore ?
tags:
  - consentement
  - mandat
  - delegation
  - information
facilitator_note:
  si_silence: "Demandez : si vous déposez un dossier à L'Agence aujourd'hui, pensez-vous que vous consentez à ce que vos données de mobilité soient analysées par un algorithme privé ?"
  si_debat_bloque: "Passez à l'angle juridique : un tribunal administratif peut-il valider une décision prise par un tiers non mentionné dans le mandat initial — et qui devrait répondre ?"
  relance_cle: "La vraie question : le consentement implicite est-il encore un consentement, ou juste une façon d'éviter de demander ?"
version: "1.0"
