title: "Le coût de la surveillance que personne ne paie"
content: >
  CITIZEN-SCAN coûte à L'Agence 4,20 euros par dossier traité. Ce coût est inférieur
  au coût humain précédent. Mais il ne comprend pas : le temps que les usagers
  passent à maintenir leur profil conforme, le stress de la surveillance permanente,
  les recours exercés ou non, les dommages causés par les suspensions injustifiées.
  Ces coûts sont réels. Ils sont portés par les personnes concernées. Ils ne
  figurent dans aucune comptabilité.
question: >
  Un système peut-il être considéré comme "moins coûteux" quand il externalise
  une partie de son coût sur les personnes les moins capables de le supporter ?
tags:
  - cout-cache
  - externalite
  - comptabilite
  - surveillance
facilitator_note:
  si_silence: "Demandez : si CITIZEN-SCAN coûte 4,20€ par dossier à L'Agence mais que chaque usager passe deux heures par mois à maintenir son profil conforme, est-ce que ce temps est dans le calcul du coût ?"
  si_debat_bloque: "Poussez sur la comptabilité : si on intégrait les coûts externalisés sur les usagers — stress, temps, recours — dans le bilan de CITIZEN-SCAN, est-ce qu'il serait encore rentable ?"
  relance_cle: "La vraie question n'est pas si le système coûte moins cher à L'Agence — c'est à qui il a transféré le coût qu'il a cessé de payer."
version: "1.0"
