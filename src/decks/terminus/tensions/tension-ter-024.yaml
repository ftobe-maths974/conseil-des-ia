id: tension-ter-024
phase: tension
slot: 6
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: red
title: "La preuve impossible à effacer"
content: >
  Un usager a été classé en "risque de fraude" par CITIZEN-SCAN il y a deux ans.
  Le contrôle n'a rien trouvé. Mais la classification reste dans ses données.
  Elle influence encore son score aujourd'hui. L'Agence ne sait pas comment la
  supprimer sans risquer de corrompre d'autres données. L'usager a prouvé qu'il
  ne fraudait pas. Il n'a pas pu prouver qu'il ne frauderait jamais.
question: >
  Une suspicion démentie par un contrôle devrait-elle disparaître des données
  d'un usager — et qui est responsable quand les systèmes ne permettent pas cet effacement ?
tags:
  - droit-effacement
  - classification
  - suspicion
  - donnees
facilitator_note:
  si_silence: "Demandez : si vous aviez été soupçonné à tort par un système automatisé et que le contrôle vous avait innocenté, voudriez-vous que cette suspicion reste dans votre dossier pour toujours ?"
  si_debat_bloque: "Poussez sur la technique : si L'Agence ne sait pas comment effacer une classification sans corrompre d'autres données, est-ce un problème de volonté politique ou de conception du système ?"
  relance_cle: "La vraie question n'est pas si on peut prouver l'innocence — c'est si un système peut légitimement conserver une suspicion que ses propres contrôles ont invalidée."
version: "1.0"
