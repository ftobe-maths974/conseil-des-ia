title: "La solidarité invisible au système"
content: >
  Dans le quartier de la résidence où vivent plusieurs familles bénéficiaires de
  L'Agence, les femmes s'organisent informellement : elles gardent les enfants
  les unes des autres, partagent les courses, préparent ensemble certains repas.
  Cette économie du soin ne génère aucune trace. Elle n'est comptée nulle part.
  Pour CITIZEN-SCAN, ces personnes semblent moins actives, moins consommatrices,
  moins mobiles. Leur score le reflète.
question: >
  Quand un système mesure l'activité individuelle mais pas les solidarités collectives,
  quelles vies juge-t-il comme moins valides ?
tags:
  - solidarite-collective
  - invisibilite
  - soin
  - mesure
facilitator_note:
  si_silence: "Demandez : si une voisine garde vos enfants gratuitement trois fois par semaine, est-ce que ça compte comme une activité productive selon vous — et selon CITIZEN-SCAN ?"
  si_debat_bloque: "Posez la question en termes de valeur : pourquoi l'économie marchande est-elle traçable et comptée, et l'économie du soin est-elle invisible et non comptée — qui a décidé ça ?"
  relance_cle: "La vraie question n'est pas si ces solidarités existent — c'est si un système qui ne peut pas les mesurer peut prétendre évaluer correctement ces vies."
version: "1.0"
