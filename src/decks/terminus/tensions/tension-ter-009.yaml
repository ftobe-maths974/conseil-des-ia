title: "L'état qui sous-traite son jugement moral"
content: >
  CITIZEN-SCAN classe les usagers selon leur "conformité sociale présumée". Ce
  classement repose sur des critères définis par une société privée dans un contrat
  non public. Ces critères opérationnalisent des jugements de valeur : ce qui est
  "actif", ce qui est "régulier", ce qui est "méritant". Ce sont des choix politiques
  déguisés en paramètres techniques. L'État les applique sans les avoir délibérés
  publiquement.
question: >
  Quand une institution publique délègue à un opérateur privé la définition de
  ce qu'est un comportement "conforme", qui est réellement responsable des valeurs
  que le système incarne ?
tags:
  - valeurs
  - jugement-moral
  - sous-traitance
  - etat
facilitator_note:
  si_silence: "Demandez : qui, dans la chaîne — ingénieur, chef de produit, direction de L'Agence, ministère — a décidé de ce que signifie être 'actif' ou 'méritant' dans CITIZEN-SCAN ?"
  si_debat_bloque: "Passez à l'angle politique : si un parti au pouvoir changeait les critères de 'conformité sociale' encodés dans le contrat privé, le saurait-on — et qui pourrait s'y opposer ?"
  relance_cle: "La vraie question : externaliser la définition des valeurs à un contrat privé non public, c'est se donner les moyens de ne pas en être responsable."
version: "1.0"
