id: tension-ter-005
phase: tension
slot: 5
slot_theme: organisation
chamber: delegation-vs-souverainete
reversibility: yellow
title: "L'expertise perdue"
content: >
  Avant CITIZEN-SCAN, les agents de L'Agence avaient développé une connaissance
  fine des situations atypiques. Ils savaient reconnaître une fraude et distinguer
  une situation précaire d'une situation frauduleuse. Depuis deux ans, ils ne
  traitent plus que des alertes. Cette expertise disparaît progressivement. Si
  demain CITIZEN-SCAN est arrêté ou défaillant, l'organisation n'aura plus les
  compétences pour reprendre un traitement manuel des dossiers.
question: >
  Peut-on déléguer durablement un savoir-faire à un système automatisé quand
  cette délégation détruit progressivement la capacité humaine de reprendre la main ?
tags:
  - expertise
  - competence
  - dependance
  - resilience
facilitator_note:
  si_silence: "Demandez : un agent de L'Agence qui n'a plus traité de dossier manuellement depuis deux ans — est-il encore qualifié pour reprendre la main si le système tombe ?"
  si_debat_bloque: "Retournez la question vers le secteur privé : une banque qui automatise son analyse de crédit perd-elle quelque chose qu'un hôpital ne peut pas se permettre de perdre ?"
  relance_cle: "La vraie question : déléguer un savoir-faire à une machine, est-ce le conserver ou le détruire progressivement ?"
version: "1.0"
