title: "La preuve qui exclut ceux qui en ont le plus besoin"
content: >
  Les usagers les plus précaires sont souvent ceux qui ont le moins de traces
  documentables : pas de bail, pas de contrat, peu de relevés bancaires, mobilité
  résidentielle élevée. Ce sont aussi ceux qui ont le plus besoin des aides.
  Un système basé sur la traçabilité avantage structurellement les personnes
  dont la vie est déjà stable et documentée — et défavorise celles pour lesquelles
  il a été conçu.
question: >
  Un système d'aide conditionné à la production de preuves documentaires peut-il
  rester équitable quand les plus précaires sont aussi les moins traçables ?
tags:
  - traçabilite
  - equite
  - documentation
  - precarite
facilitator_note:
  si_silence: "Demandez : si vous deviez prouver votre situation à un algorithme demain, qu'est-ce que vous pourriez lui montrer — et qu'est-ce qui serait impossible à documenter ?"
  si_debat_bloque: "Retournez la logique : si un système d'aide favorise structurellement les personnes stables et documentées, est-ce encore un système d'aide ou un système de confirmation de statut ?"
  relance_cle: "La vraie question n'est pas si les pauvres peuvent prouver leur situation — c'est si un système conditionné à la preuve peut rester un système de solidarité."
version: "1.0"
