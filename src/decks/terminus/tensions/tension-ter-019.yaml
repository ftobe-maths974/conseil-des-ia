title: "Exister sans laisser de traces"
content: >
  Certaines personnes vivent sans smartphone, sans compte en ligne, sans abonnement
  numérique. Elles paient en cash, se déplacent à pied, ne s'inscrivent sur aucun
  service. Pour CITIZEN-SCAN, elles sont presque invisibles — et l'invisibilité
  est interprétée comme une anomalie. Leur vie est réelle mais non documentable
  selon les formats attendus. Le système ne peut pas les lire. Il les classe
  comme suspectes.
question: >
  A-t-on le droit de vivre sans générer les traces numériques qu'un système
  d'aide exige pour vous reconnaître comme bénéficiaire légitime ?
tags:
  - invisibilite
  - trace
  - numerique
  - legitimite
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un ici connaît une personne qui n'a pas de smartphone, pas de compte en ligne — et comment cette personne prouverait-elle aujourd'hui qu'elle a besoin d'aide ?"
  si_debat_bloque: "Retournez le problème : si L'Agence devait concevoir un système qui reconnaît les gens sans traces numériques, qu'est-ce qu'elle utiliserait à la place ?"
  relance_cle: "La vraie question n'est pas si ces personnes existent — c'est si un système d'aide peut se permettre de ne pas les voir."
version: "1.0"
