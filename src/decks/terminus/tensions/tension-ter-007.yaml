id: tension-ter-007
phase: tension
slot: 7
slot_theme: systeme
chamber: delegation-vs-souverainete
reversibility: green
title: "La réforme qui se referme"
content: >
  CITIZEN-SCAN a permis de réduire le budget de fonctionnement de L'Agence de 22%
  en trois ans. Ces économies ont été redéployées vers d'autres services. Revenir
  à un traitement plus manuel nécessiterait de recréer des postes supprimés, de
  reformer des agents, et de rallonger les délais pendant la transition. Ce coût
  de réversibilité n'a jamais été calculé explicitement lors du déploiement. Il est
  maintenant politique autant que financier.
question: >
  À quel moment le coût de revenir en arrière devient-il suffisamment élevé
  pour rendre une décision technologique irréversible en pratique ?
tags:
  - reversibilite
  - cout-sortie
  - budget
  - irreversibilite
facilitator_note:
  si_silence: "Demandez : les 22% d'économies budgétaires — qui en a bénéficié, et est-ce que ça change qui supporte le coût d'un éventuel retour arrière ?"
  si_debat_bloque: "Inversez la temporalité : si L'Agence avait dû calculer le coût de réversibilité avant de déployer CITIZEN-SCAN, aurait-elle fait le même choix ?"
  relance_cle: "La vraie question : une décision qui devient irréversible par accumulation de faits accomplis a-t-elle jamais été vraiment choisie ?"
version: "1.0"
