title: "Mesurer l'humain pour mieux le remplacer"
content: >
  Pour calibrer CITIZEN-SCAN, l'opérateur a analysé trois ans de décisions humaines
  de L'Agence. Il a extrait des patterns. Il a entraîné le modèle à reproduire
  ces patterns à grande vitesse. Le modèle est maintenant plus rapide que les agents.
  Il applique leurs jugements sans leur intuition ni leur capacité de douter.
  Ce qu'on a capturé pour le reproduire, c'est aussi ce qu'on a perdu en reproduisant.
question: >
  Quand on automatise le jugement humain en le réduisant à ses patterns statistiques,
  qu'est-ce qui disparaît dans la réduction — et est-ce que ça compte ?
tags:
  - jugement
  - intuition
  - automatisation
  - reduction
facilitator_note:
  si_silence: "Demandez : si vous deviez expliquer à quelqu'un comment vous décidez d'accorder ou refuser quelque chose de difficile, est-ce que vous pourriez le mettre en règles claires — ou est-ce qu'une partie resterait indicible ?"
  si_debat_bloque: "Poussez sur ce qui a disparu : si le modèle reproduit les patterns de décision mais pas le doute, qu'est-ce que le doute faisait que les patterns ne font pas ?"
  relance_cle: "La vraie question n'est pas si le modèle décide comme un humain — c'est si ce qu'on a perdu en extrayant les patterns était précisément ce qui rendait la décision humaine légitime."
version: "1.0"
