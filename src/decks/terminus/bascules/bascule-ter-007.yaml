id: bascule-ter-007
phase: bascule
slot: 1
slot_theme: individu
chamber: preuve-vs-simulation
reversibility: green
scope: individuel
title: "Prouver qu'on dormait"
situation: >
  Sonia, aidante à domicile non déclarée de sa voisine âgée, n'a pas bougé de
  son quartier pendant dix jours. CITIZEN-SCAN a interprété son immobilité
  géographique comme un signal d'anomalie. L'Agence lui demande de justifier
  ses activités sur la période. Elle n'a aucun document. Elle s'occupait de
  quelqu'un. Il n'y a pas de contrat, pas de reçu, pas de relevé numérique.
question: >
  Que devient une personne dont les activités les plus importantes de la semaine
  ne laissent aucune trace vérifiable par un système automatisé ?
tags:
  - preuve
  - inactivite
  - aidant
  - trace
facilitator_note:
  si_silence: "Demandez : qu'est-ce que Sonia pourrait faire pour prouver qu'elle s'occupait de sa voisine — y a-t-il quoi que ce soit ?"
  si_debat_bloque: "Élargissez : combien d'activités essentielles dans nos vies ne laissent aucune trace numérique — s'occuper d'un enfant, consoler quelqu'un, faire la cuisine ?"
  relance_cle: "La vraie question : un système qui ne reconnaît que ce qu'il peut mesurer va-t-il systématiquement pénaliser ceux qui vivent le plus hors des traces numériques ?"
version: "1.0"
