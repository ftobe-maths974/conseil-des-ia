id: bascule-ter-008
phase: bascule
slot: 2
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Le signal qui devient preuve"
situation: >
  L'Agence a intégré dans CITIZEN-SCAN les données de fréquentation du réseau de
  transport comme indicateur de "présence active sur le territoire". Les usagers
  qui ne prennent pas les transports en commun — parce qu'ils n'en ont pas besoin,
  parce qu'ils ont un véhicule, parce qu'ils sont malades — accumulent des points
  d'anomalie. Aucune de ces raisons n'est demandée ni prise en compte.
question: >
  À quel moment un signal de comportement devient-il une preuve de conformité
  sans que la personne ait eu la possibilité de contextualiser ce signal ?
tags:
  - signal
  - preuve
  - mobilite
  - interpretation
facilitator_note:
  si_silence: "Posez la question : qui avait la responsabilité de s'assurer que ces données de transport correspondent vraiment à ce qu'on veut mesurer ?"
  si_debat_bloque: "Demandez : si vous êtes malade et ne prenez pas les transports pendant un mois, voulez-vous qu'un système en déduise quelque chose sur vous ?"
  relance_cle: "La vraie question : à partir de quel moment un indicateur proxy cesse d'être un signal et devient une accusation ?"
version: "1.0"
