chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Le contrôle qui coûte plus que l'aide"
situation: >
  L'Agence dépense 11 millions d'euros par an pour détecter des fraudes aux aides
  sociales dans la région. Les fraudes prouvées et récupérées représentent 800 000
  euros. Le coût d'infrastructure informatique, de maintenance et de personnel
  de supervision est sept fois supérieur à la valeur des détournements évités.
  La direction justifie l'écart par "l'effet dissuasif non quantifiable".
question: >
  À quel point de déséquilibre un système de contrôle consomme-t-il plus de
  ressources publiques qu'il n'en protège — et qui est légitime pour décider de s'arrêter ?
tags:
  - cout-controle
  - proportionnalite
  - fraude
  - ressource-publique
facilitator_note:
  si_silence: "Demandez : est-ce que 'l'effet dissuasif non quantifiable' est un argument ou une façon de ne pas avoir à répondre de ses choix ?"
  si_debat_bloque: "Tournez la question vers les usagers : avec ces 11 millions, combien d'accompagnements réels aurait-on pu financer pour les personnes en fragilité ?"
  relance_cle: "La vraie question : quand contrôler coûte plus que ce qu'on contrôle, est-ce qu'on protège encore les finances publiques ou est-ce qu'on justifie un appareil de surveillance ?"
version: "1.0"
