id: bascule-ter-004
phase: bascule
slot: 1
slot_theme: individu
chamber: invisibilite-vs-arbitrage
reversibility: green
scope: individuel
title: "Pass en veille"
situation: >
  Le pass de transport de Karim passe au rouge au tourniquet un vendredi matin.
  Il n'a pas fraudé. CITIZEN-SCAN a détecté trois jours sans activité enregistrée
  et a déclenché une vérification de conformité. Le dossier sera réévalué sous
  72 heures. Entre-temps, le pass est suspendu. Le guichet de L'Agence n'ouvre
  que le mardi.
question: >
  Un système d'aide peut-il légitimement suspendre un droit en attendant de
  vérifier qu'il est encore mérité ?
tags:
  - suspension
  - pass
  - conformite
  - droits
facilitator_note:
  si_silence: "Demandez : qu'est-ce que Karim est censé faire pendant ces 72 heures s'il n'a plus de transport ?"
  si_debat_bloque: "Inversez l'angle : si le système se trompait dans 5 % des cas, est-ce que ce taux justifie de suspendre d'abord et vérifier ensuite ?"
  relance_cle: "La vraie question : suspendre avant de vérifier, c'est traiter le bénéficiaire comme suspect — est-ce le principe d'un système d'aide ?"
version: "1.0"
