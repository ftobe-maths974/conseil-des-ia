id: bascule-ter-012
phase: bascule
slot: 3
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: red
scope: systemique
title: "La norme qui efface"
situation: >
  CITIZEN-SCAN a été entraîné sur dix millions de dossiers traités entre 2015 et
  2023. Les situations de vie qui n'apparaissaient pas dans ces données — aidants
  informels, logements partagés non déclarés, rythmes de vie atypiques — ne sont
  pas reconnues comme valides. Le système ne peut pas apprendre à partir de cas
  individuels. Les exceptions motivées prennent en moyenne 47 jours à traiter.
question: >
  Un modèle statistique entraîné sur le passé peut-il être équitable pour
  des personnes dont les situations de vie n'étaient pas représentées dans les données ?
tags:
  - modele
  - donnees-historiques
  - representation
  - exception
facilitator_note:
  si_silence: "Posez la question : si votre situation de vie n'existait pas dans les données de 2015 à 2023, est-ce que vous pouvez avoir confiance dans ce système ?"
  si_debat_bloque: "Montez d'un niveau : peut-on corriger un modèle entraîné sur le passé sans retraiter des millions de décisions passées — et qui le financerait ?"
  relance_cle: "La vraie question : utiliser des données historiques pour évaluer l'avenir, c'est perpétuer les inégalités passées ou les corriger ?"
version: "1.0"
