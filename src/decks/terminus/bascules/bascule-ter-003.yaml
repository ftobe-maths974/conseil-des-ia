id: bascule-ter-003
phase: bascule
slot: 3
slot_theme: systeme
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Le contrat sans sortie"
situation: >
  L'Agence a signé avec l'opérateur de CITIZEN-SCAN un contrat de sept ans incluant
  une clause de propriété exclusive des données traitées. Trois ans plus tard, une
  étude indépendante révèle des biais systématiques dans les attributions. La direction
  veut changer d'opérateur. Elle découvre que la migration des données coûterait
  plus que le budget annuel du service et prendrait 18 mois minimum.
question: >
  À quel moment une institution perd-elle la maîtrise réelle de ses décisions
  en signant un contrat technologique à long terme ?
tags:
  - lock-in
  - contrat
  - sortie
  - souverainete
facilitator_note:
  si_silence: "Posez la question : à quel moment dans ce contrat de 7 ans quelqu'un aurait pu tirer la sonnette d'alarme ?"
  si_debat_bloque: "Retournez vers les personnes affectées : pendant les 18 mois de migration, que se passe-t-il pour les usagers dont les droits sont biaisés ?"
  relance_cle: "La vraie question : est-ce que signer ce contrat revenait déjà à céder une part de souveraineté, même avant de découvrir les biais ?"
version: "1.0"
