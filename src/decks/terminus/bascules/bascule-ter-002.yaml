id: bascule-ter-002
phase: bascule
slot: 2
slot_theme: organisation
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "L'agent qui n'a plus accès"
situation: >
  L'Agence a migré vers CITIZEN-SCAN il y a huit mois. Depuis, les agents de guichet
  ne peuvent plus modifier un dossier directement : toute intervention passe par
  une demande adressée à l'opérateur du système, avec un délai de traitement de
  cinq à dix jours. Quand une usagère arrive en urgence avec un enfant malade et
  un loyer en défaut, l'agent voit le problème mais ne peut rien faire lui-même.
question: >
  Quand un agent humain n'a plus les moyens techniques d'agir, qui est encore
  responsable de la décision prise par le système à sa place ?
tags:
  - delegation
  - agent
  - impuissance
  - responsabilite
facilitator_note:
  si_silence: "Demandez : si vous étiez l'agent devant cette femme avec l'enfant malade, que ressentiriez-vous ?"
  si_debat_bloque: "Déplacez vers l'institution : est-ce que L'Agence aurait pu prévoir ce cas quand elle a signé le contrat ?"
  relance_cle: "La vraie question : quand l'agent ne peut plus rien faire, est-il encore un agent ou juste un visage ?"
version: "1.0"
