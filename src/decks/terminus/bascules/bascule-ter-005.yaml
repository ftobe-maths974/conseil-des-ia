title: "La liste invisible"
situation: >
  Depuis six mois, certains dossiers attendent deux fois plus longtemps que d'autres
  sans explication. Les agents de guichet ont remarqué le phénomène mais ne peuvent
  pas consulter les paramètres de priorisation de CITIZEN-SCAN. La direction a
  répondu que les critères sont "protégés par le secret commercial". Un avocat a
  demandé la liste des critères actifs : il a reçu un document de 4 pages noircies.
question: >
  Une institution publique peut-elle déléguer une décision à un système dont
  elle-même ne connaît pas les critères effectifs ?
