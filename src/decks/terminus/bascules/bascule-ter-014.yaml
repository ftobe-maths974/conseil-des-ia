id: bascule-ter-014
phase: bascule
slot: 2
slot_theme: organisation
chamber: metabolisme-vs-progres
reversibility: yellow
scope: organisationnel
title: "L'agent devenu superviseur"
situation: >
  Avant CITIZEN-SCAN, les agents de L'Agence traitaient les dossiers eux-mêmes.
  Maintenant, leur travail consiste à surveiller les alertes générées par le système
  et à valider les décisions automatiques. Sur 200 alertes par jour, ils n'ont le
  temps d'en examiner réellement que 12 à 15. Les autres sont validées par défaut.
  Trois agents ont demandé une mutation. Un quatrième est en arrêt maladie.
question: >
  Quand un agent humain n'a plus le temps de vérifier les décisions qu'il est censé
  superviser, sa présence dans le processus garantit-elle encore quoi que ce soit ?
tags:
  - agent
  - supervision
  - epuisement
  - validation-par-defaut
facilitator_note:
  si_silence: "Demandez : si vous étiez l'un de ces agents et que vous validez 185 alertes par jour sans les examiner, comment vous vous sentez au bout d'un an ?"
  si_debat_bloque: "Allez vers la fiction juridique : si une erreur du système cause un préjudice, qui est responsable — l'agent qui a validé par défaut ou l'opérateur du système ?"
  relance_cle: "La vraie question : quand un humain signe une décision qu'il n'a pas le temps de vérifier, sa signature protège qui — l'usager ou l'institution ?"
version: "1.0"
