id: bascule-ter-011
phase: bascule
slot: 2
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
scope: organisationnel
title: "La catégorie qui n'existe pas"
situation: >
  Une travailleuse sociale signale à L'Agence le cas d'une famille de cinq personnes
  dont la mère seule subvient aux besoins. La grand-mère vit avec eux mais n'est
  pas déclarée dans le dossier : sa présence ferait basculer le foyer dans une
  catégorie différente avec moins d'aides. CITIZEN-SCAN ne reconnaît pas la
  catégorie "famille élargie non cohabitante officielle". La travailleuse sociale
  ne sait pas quel formulaire remplir.
question: >
  Quand les catégories administratives ne correspondent plus aux structures
  de vie réelles, qui est responsable des personnes qui tombent entre les cases ?
tags:
  - famille-elargie
  - categorie
  - travailleur-social
  - non-conformite
facilitator_note:
  si_silence: "Demandez : qu'est-ce que la travailleuse sociale peut faire concrètement — elle voit le problème, elle ne peut pas le résoudre, elle fait quoi ?"
  si_debat_bloque: "Allez vers la grand-mère : si elle se déclare dans le dossier et que les aides baissent, qui souffre de cette vérité administrative ?"
  relance_cle: "La vraie question : quand les catégories d'un système ne correspondent plus aux vies réelles, est-ce que c'est la vie qui est en tort ou le système ?"
version: "1.0"
