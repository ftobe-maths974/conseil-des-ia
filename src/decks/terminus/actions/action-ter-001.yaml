title: "Interdire toute décision automatisée sans responsable humain identifié"
body: >
  Il est interdit à L'Agence de prendre toute décision affectant les droits d'un
  usager — suspension, dépriorisation, blocage de dossier — sans qu'un agent humain
  nommément responsable soit désigné et joignable dans un délai de 48 heures. Aucun
  contrat avec un opérateur IA ne peut supprimer cette obligation de responsabilité.
mandat_principe: "Interdire toute décision engageant les droits d'une personne sans responsable humain identifié, nommément désigné et joignable."
tags:
