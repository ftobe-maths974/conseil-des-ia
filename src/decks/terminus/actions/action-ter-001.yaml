id: action-ter-001
phase: action
slot: 1
lever_type: interdire
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Interdire toute décision automatisée sans responsable humain identifié"
body: >
  Il est interdit à L'Agence de prendre toute décision affectant les droits d'un
  usager — suspension, dépriorisation, blocage de dossier — sans qu'un agent humain
  nommément responsable soit désigné et joignable dans un délai de 48 heures. Aucun
  contrat avec un opérateur IA ne peut supprimer cette obligation de responsabilité.
mandat_principe: "Interdire toute décision engageant les droits d'une personne sans responsable humain identifié, nommément désigné et joignable."
tags:
  - delegation
  - responsabilite
  - automatisation
  - droits
facilitator_note:
  si_silence: "Demandez : si un usager de L'Agence reçoit une décision de suspension de droits et cherche à contacter le responsable humain désigné — est-ce que ce responsable connaît le dossier, a du temps disponible, et peut réellement modifier la décision ?"
  si_debat_bloque: "Poussez sur le volume : L'Agence traite des dizaines de milliers de dossiers. Désigner un responsable joignable en 48h pour chacun — combien d'agents ça implique, et si les effectifs ne suivent pas, est-ce que ce mandat est une garantie ou une obligation sans moyens ?"
  relance_cle: "Ce mandat pose la question de la responsabilité nominale versus réelle : désigner un nom dans un dossier change-t-il quelque chose si cette personne n'a ni le temps ni le pouvoir de revenir sur une décision algorithmique ?"
version: "1.0"
