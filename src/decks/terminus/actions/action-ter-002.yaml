id: action-ter-002
phase: action
slot: 2
lever_type: conditionner
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Conditionner tout contrat IA à une clause de reprise humaine opérationnelle"
body: >
  L'Agence ne peut signer aucun contrat avec un opérateur de système automatisé
  sans qu'une procédure de reprise manuelle des décisions soit documentée, testée
  et activable en moins de 72 heures. Cette procédure doit être maintenue opérationnelle
  tout au long du contrat, sans surcoût pour l'usager ni délai supplémentaire.
mandat_principe: "Conditionner tout contrat IA à l'existence d'une procédure de reprise humaine documentée, testée et activable rapidement."
tags:
  - contrat
  - reprise-humaine
  - delegation
  - gouvernance
facilitator_note:
  si_silence: "Demandez : si la procédure de reprise manuelle doit être activable en moins de 72h, ça suppose que des agents formés à traiter manuellement les dossiers existent. Si L'Agence n'a plus le personnel ni la formation pour ça, est-ce que ce mandat est réaliste ?"
  si_debat_bloque: "Poussez sur la maintenance : documenter et tester une procédure de reprise au moment du contrat, c'est faisable. La maintenir opérationnelle tout au long du contrat, sans surcoût — qui paie pour ça, et si le coût n'est pas financé, comment cette obligation tient-elle dans la durée ?"
  relance_cle: "Ce mandat pose la question de l'obligation contractuelle sans financement : conditionner le contrat à une procédure de reprise humaine est rigoureux — mais si aucun budget n'est alloué à sa maintenance, est-ce une condition réelle ou une clause de style ?"
version: "1.0"
