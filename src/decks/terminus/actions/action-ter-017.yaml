id: action-ter-017
phase: action
slot: 1
lever_type: limiter
chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Plafonner le budget de surveillance à la valeur des droits détournés qu'il protège"
body: >
  Le coût annuel de tout dispositif de contrôle comportemental déployé par L'Agence
  ne peut excéder 120% du montant annuel des fraudes qu'il est statistiquement
  démontré à même de prévenir, attesté par un audit indépendant publié. Tout dispositif
  dépassant ce seuil est suspendu dans les 90 jours suivant la publication de l'audit.
mandat_principe: "Plafonner le coût de tout dispositif de contrôle à un montant proportionnel au risque réel qu'il est censé couvrir, attesté par audit public."
tags:
  - proportionnalite
  - surveillance
  - cout
  - audit
facilitator_note:
  si_silence: "Demandez : 'les fraudes statistiquement démontré à même de prévenir' — comment L'Agence calcule-t-elle les fraudes prévenues par un système qui n'a pas encore été déployé, ou qui n'aurait pas détecté certaines fraudes sans lui ?"
  si_debat_bloque: "Poussez sur la suspension en 90 jours : si l'audit révèle que le dispositif coûte plus que les fraudes prévenues, et que le suspendre crée un vide de contrôle, est-ce que la suspension est vraiment exécutée — ou est-ce que L'Agence conteste l'audit pour gagner du temps ?"
  relance_cle: "Ce mandat pose la question de la proportionnalité comme principe budgétaire : lier le coût de surveillance au montant des fraudes, c'est cohérent — mais si les bénéfices du contrôle incluent des effets dissuasifs non mesurables, est-ce que le calcul peut capturer ce que le dispositif vaut vraiment ?"
version: "1.0"
