id: action-ter-019
phase: action
slot: 3
lever_type: conditionner
chamber: metabolisme-vs-progres
reversibility: yellow
scope: organisationnel
title: "Conditionner le maintien d'un dispositif de contrôle à l'évaluation de son impact sur les agents"
body: >
  L'Agence ne peut reconduire un dispositif de contrôle automatisé sans présenter,
  avec le rapport de performance, une évaluation de son impact sur les conditions
  de travail des agents : taux de démission, consultations psychologiques, signalements
  de perte de sens. Si l'un de ces indicateurs dépasse un seuil fixé, la reconduction
  est soumise à validation d'une commission paritaire.
mandat_principe: "Conditionner le renouvellement de tout dispositif de contrôle à l'évaluation de son impact humain sur les agents qui l'opèrent."
tags:
  - agents
  - conditions-travail
  - renouvellement
  - epuisement
facilitator_note:
  si_silence: "Demandez : 'signalements de perte de sens' — comment un agent signale-t-il officiellement qu'il perd le sens de son travail, dans une institution dont la culture valorise l'efficacité et la neutralité ? Et qui reçoit ce signalement et le prend au sérieux ?"
  si_debat_bloque: "Poussez sur la commission paritaire : si le taux de démission dépasse le seuil et que la reconduction est soumise à validation, mais que L'Agence n'a pas de personnel formé pour remplacer le dispositif — est-ce que la commission peut vraiment bloquer la reconduction sans créer une crise opérationnelle ?"
  relance_cle: "Ce mandat pose la question du travail émotionnel du contrôle social : les agents qui exécutent des décisions automatisées sur des usagers fragiles subissent un coût psychologique réel — mais si l'évaluation de leur bien-être devient une condition de renouvellement du dispositif, est-ce que L'Agence n'est pas incitée à minimiser les signalements plutôt qu'à améliorer les conditions ?"
version: "1.0"
