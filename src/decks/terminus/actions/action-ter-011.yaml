id: action-ter-011
phase: action
slot: 3
lever_type: conditionner
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Conditionner la détection d'anomalie à un taux de faux positifs inférieur à 2%"
body: >
  L'Agence conditionne le maintien de tout module de détection de fraude à la
  démonstration d'un taux de faux positifs inférieur à 2% sur une période de
  six mois, attesté par un audit indépendant. Tout module dépassant ce seuil
  est suspendu automatiquement jusqu'à révision. Ce seuil est rendu public
  et consultable par toute personne ayant fait l'objet d'un contrôle.
mandat_principe: "Conditionner l'usage de tout module de détection à la démonstration d'un taux de faux positifs inférieur à un seuil fixé et publié."
tags:
  - faux-positif
  - detection
  - fraude
  - seuil
facilitator_note:
  si_silence: "Demandez : si un module de détection de fraude est suspendu automatiquement parce qu'il dépasse 2 % de faux positifs, qu'est-ce qui détecte les fraudes pendant la révision — et combien de temps dure cette fenêtre de vulnérabilité ?"
  si_debat_bloque: "Poussez sur le choix du seuil : 2 % de faux positifs sur 100 000 usagers, c'est 2 000 personnes injustement suspectées. Est-ce que ce seuil est acceptable — et qui l'a fixé, avec quel raisonnement, et les usagers concernés ont-ils été consultés ?"
  relance_cle: "Ce mandat pose la question du seuil de tolérance socialement acceptable : fixer un taux maximal de faux positifs est une décision politique autant que technique. Qui décide combien d'erreurs injustes sont acceptables pour combien de fraudes détectées ?"
