id: action-ter-012
phase: action
slot: 4
lever_type: recours
chamber: preuve-vs-simulation
reversibility: green
scope: individuel
title: "Garantir le droit à une instruction humaine sur toute décision basée sur une trace comportementale"
body: >
  Toute personne ayant subi une décision de contrôle, de suspension ou de rétrogradation
  fondée sur des traces comportementales — activité numérique, mobilité, présence —
  a droit, sans démarche supplémentaire, à une instruction de son dossier par un
  agent humain dans un délai de cinq jours ouvrés et à la communication écrite des
  éléments ayant déclenché la procédure.
mandat_principe: "Garantir à toute personne le droit à une instruction humaine rapide lorsque sa décision est fondée sur des traces comportementales interprétées automatiquement."
tags:
  - recours
  - trace-comportementale
  - instruction
  - transparence
facilitator_note:
  si_silence: "Demandez : si L'Agence doit communiquer par écrit 'les éléments ayant déclenché la procédure' et que ces éléments sont des corrélations comportementales que l'algorithme n'explique pas — qu'est-ce que l'agent écrit dans sa communication ?"
  si_debat_bloque: "Poussez sur le délai de 5 jours : pour un usager dont les droits sont suspendus et qui dépend de ces droits pour se nourrir ou se loger, 5 jours ouvrés c'est une semaine. Est-ce que ce délai est protecteur ou expose les plus fragiles à une semaine de préjudice ?"
  relance_cle: "Ce mandat pose la question de la transparence sur les traces comportementales : informer quelqu'un que sa 'mobilité atypique' a déclenché un contrôle — est-ce une explication ou une description d'un signal que ni l'agent ni l'usager ne comprend vraiment ?"
version: "1.0"
