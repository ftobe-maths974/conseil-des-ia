id: action-ter-008
phase: action
slot: 4
lever_type: conditionner
chamber: invisibilite-vs-arbitrage
reversibility: green
scope: organisationnel
title: "Conditionner l'usage du scoring à la publication des critères actifs"
body: >
  L'Agence ne peut recourir à CITIZEN-SCAN pour classer les dossiers qu'à condition
  que la liste des critères actifs, leur pondération relative et les seuils de
  déclenchement soient publiés dans un format compréhensible par un non-spécialiste
  et mis à jour dans les 30 jours suivant toute modification du modèle.
mandat_principe: "Conditionner l'usage de tout système de scoring à la publication lisible des critères actifs et de leurs pondérations."
tags:
  - scoring
  - transparence
  - criteres
  - publication
facilitator_note:
  si_silence: "Demandez : si les critères et pondérations de CITIZEN-SCAN sont publiés 'dans un format compréhensible par un non-spécialiste' — est-ce que les usagers les plus vulnérables, ceux dont les droits sont en jeu, peuvent réellement lire ce document et comprendre pourquoi leur score a changé ?"
  si_debat_bloque: "Poussez sur le risque de gaming : si les critères actifs sont publics, est-ce que certains usagers peuvent adapter leur comportement déclaré pour optimiser leur score sans que ça corresponde à leur situation réelle — et comment L'Agence gère cette asymétrie ?"
  relance_cle: "Ce mandat pose la tension classique entre transparence et robustesse : publier les critères améliore l'équité pour les usagers de bonne foi — mais peut réduire la fiabilité du système si les critères publiés deviennent un guide de contournement."
version: "1.0"
