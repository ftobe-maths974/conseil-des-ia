id: action-ter-010
phase: action
slot: 2
lever_type: limiter
chamber: preuve-vs-simulation
reversibility: yellow
scope: individuel
title: "Limiter les demandes de justificatifs à ceux que l'usager peut raisonnablement produire"
body: >
  L'Agence ne peut exiger d'un usager que des justificatifs correspondant à des
  situations documentables dans sa vie réelle. Est interdite toute demande de preuve
  qui supposerait que l'usager dispose d'un accès numérique permanent, d'un contrat
  de bail nominatif, ou d'une traçabilité de ses activités quotidiennes. La liste
  des justificatifs acceptés est publique et comprend des alternatives non numériques.
mandat_principe: "Limiter les exigences de preuve à ce qu'une personne en situation ordinaire peut raisonnablement produire, en incluant des alternatives non numériques."
tags:
  - justificatif
  - preuve
  - accessibilite
  - standard
facilitator_note:
  si_silence: "Demandez : qui décide quels justificatifs correspondent à des 'situations documentables dans une vie réelle' — et est-ce que cette définition est revue régulièrement pour tenir compte des situations de précarité qui n'ont pas de trace documentaire ?"
  si_debat_bloque: "Poussez sur la liste publique d'alternatives non numériques : est-ce que les agents de L'Agence connaissent cette liste et l'appliquent uniformément — ou est-ce que la procédure de substitution est laissée à l'appréciation individuelle de l'agent qui traite le dossier ?"
  relance_cle: "Ce mandat pose la question du standard implicite : limiter les exigences à ce qu'une 'personne en situation ordinaire peut raisonnablement produire' suppose de savoir ce qu'est une situation ordinaire. Si ce standard est défini par la majorité, est-ce qu'il protège ceux dont la situation est précisément hors-norme ?"
version: "1.0"
