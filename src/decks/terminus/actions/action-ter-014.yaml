id: action-ter-014
phase: action
slot: 2
lever_type: conditionner
chamber: singularite-vs-standard
reversibility: yellow
scope: organisationnel
title: "Conditionner le déploiement du modèle à l'audit des populations mal couvertes"
body: >
  L'Agence ne peut mettre en production toute nouvelle version de CITIZEN-SCAN sans
  présenter un rapport d'impact sur les populations dont les configurations de vie
  s'écartent de la moyenne statistique : aidants informels, cohabitants, bénéficiaires
  de transferts familiaux, personnes sans domicile fixe numérique. Ce rapport est
  rendu public avant le déploiement.
mandat_principe: "Imposer l'audit des populations dont les situations de vie s'écartent du modèle statistique avant tout déploiement ou mise à jour d'un système de scoring."
tags:
  - audit
  - populations-atypiques
  - deploiement
  - modele
facilitator_note:
  si_silence: "Demandez : un rapport d'impact sur les aidants informels, les cohabitants ou les personnes sans domicile fixe numérique — comment L'Agence identifie-t-elle ces populations pour les auditer si ce sont précisément les populations les moins visibles dans ses données ?"
  si_debat_bloque: "Poussez sur la condition de déploiement : si le rapport d'impact révèle des lacunes importantes mais que la pression calendaire ou politique pousse quand même au déploiement, qu'est-ce qui empêche concrètement L'Agence de passer outre — et qui contrôle ?"
  relance_cle: "Ce mandat pose la question de l'audit des invisibles : on ne peut auditer que ce qu'on voit. Si les populations atypiques ne sont pas dans les données de L'Agence, est-ce que le rapport d'impact peut réellement les couvrir — ou documente-t-il seulement les atypies déjà connues ?"
version: "1.0"
