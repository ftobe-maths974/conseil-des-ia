slot_theme: systeme
chamber: invisibilite-vs-arbitrage
reversibility: red
scope: systemique
title: "CareFlow oriente différemment selon le code postal — les équipes ne le savent pas"
situation: >
  Un médecin du GHR remarque que deux patients avec des scores cliniques identiques
  reçoivent des recommandations d'orientation différentes. Il interroge le référent
  CareFlow, qui découvre que le modèle intègre le code postal de résidence parmi ses
  variables. Cette variable n'est mentionnée dans aucune communication interne. Elle
  n'a jamais été validée par le comité médical.
question: >
  Quand un critère non validé par l'institution influence des décisions cliniques
  sans que les soignants le sachent, qui est responsable des effets de ce critère ?
tags:
  - biais
  - critere-cache
  - equite
  - validation
facilitator_note:
  si_silence: "Demandez : si vous étiez le patient orienté différemment à cause de votre code postal, et que vous le découvriez, comment vous appelleriez ça ?"
  si_debat_bloque: "Retournez vers la gouvernance : qui dans cet hôpital aurait dû valider les variables du modèle avant déploiement — et pourquoi ça n'a pas eu lieu ?"
  relance_cle: "La vraie question n'est pas si le code postal est un biais — c'est : qui est responsable quand un critère non validé par l'institution produit des effets cliniques différents selon le quartier ?"
version: "1.0"
