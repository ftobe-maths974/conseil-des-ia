title: "Le dossier patient cite CareFlow — sans documenter l'examen clinique"
situation: >
  À la suite d'un audit de dossiers, un médecin DIM (département d'information
  médicale) constate que 23 % des dossiers du service de médecine interne comportent
  la mention "recommandation CareFlow suivie" comme justification principale d'une
  décision d'orientation ou de sortie. L'examen clinique correspondant est absent
  ou succinct. La pratique s'est installée progressivement, sans directive.
question: >
  Quand une recommandation automatique remplace l'observation clinique dans un
  dossier médical, quelle est encore la valeur juridique et médicale de ce dossier ?
