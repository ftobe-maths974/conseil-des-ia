id: bascule-ct-008
phase: bascule
slot: 2
slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Le dossier patient cite CareFlow — sans documenter l'examen clinique"
situation: >
  À la suite d'un audit de dossiers, un médecin DIM (département d'information
  médicale) constate que 23 % des dossiers du service de médecine interne comportent
  la mention "recommandation CareFlow suivie" comme justification principale d'une
  décision d'orientation ou de sortie. L'examen clinique correspondant est absent
  ou succinct. La pratique s'est installée progressivement, sans directive.
question: >
  Quand une recommandation automatique remplace l'observation clinique dans un
  dossier médical, quelle est encore la valeur juridique et médicale de ce dossier ?
tags:
  - dossier
  - examen-clinique
  - preuve
  - documentation
facilitator_note:
  si_silence: "Posez la question : si un avocat ouvre ce dossier et lit 'recommandation CareFlow suivie' sans trouver d'examen clinique, qu'est-ce qu'il peut en faire ?"
  si_debat_bloque: "Poussez l'angle collectif : cette pratique s'est installée sans directive — est-ce que ça veut dire que tout le monde l'a acceptée, ou que personne n'a osé la nommer ?"
  relance_cle: "La vraie question n'est pas la qualité de la documentation — c'est : quand un dossier médical cite une machine à la place d'un examen, est-ce encore un acte médical traçable ?"
version: "1.0"
