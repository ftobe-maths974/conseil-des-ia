id: bascule-ct-001
phase: bascule
slot: 1
slot_theme: individu
chamber: delegation-vs-souverainete
reversibility: green
scope: individuel
title: "L'infirmière valide sans lire — CareFlow dit pareil que d'habitude"
situation: >
  Une infirmière de triage expérimentée travaille depuis huit mois avec CareFlow.
  Elle remarque qu'elle valide les recommandations du système quasi systématiquement,
  parfois avant d'avoir terminé l'interrogatoire du patient. Elle justifie : "Le
  système voit tout, moi j'aurais donné le même score." Ce matin, un patient avec
  des symptômes atypiques passe en niveau 3. Elle valide.
question: >
  À quel moment la validation humaine d'une recommandation automatique cesse-t-elle
  d'être une vérification réelle pour devenir une formalité ?
tags:
  - validation
  - attention
  - triage
  - autonomie-clinique
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un ici a déjà signé ou validé quelque chose sans vraiment le relire parce qu'il faisait confiance à l'outil ?"
  si_debat_bloque: "Poussez l'angle inverse : si l'infirmière donnait systématiquement des scores différents de CareFlow, est-ce que ce serait un problème — et pour qui ?"
  relance_cle: "La vraie question n'est pas la confiance dans le système — c'est : à quel moment la validation humaine ne protège plus le patient de rien ?"
version: "1.0"
