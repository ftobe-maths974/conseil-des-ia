chamber: preuve-vs-simulation
reversibility: green
scope: individuel
title: "L'alerte CareFlow n'a pas suffi — le médecin en doute désormais"
situation: >
  Un médecin interniste a reçu trois alertes CareFlow en deux semaines signalant
  un risque élevé de décompensation pour des patients en suivi chronique. Dans
  les trois cas, la décompensation ne s'est pas produite. Cette semaine, une quatrième
  alerte arrive. Le médecin hésite à appeler le patient pour une hospitalisation
  préventive. Il note dans son dossier : "alerte CareFlow, valeur incertaine."
question: >
  Quand un professionnel commence à ignorer systématiquement une alerte automatique,
  est-ce un signe de discernement clinique ou d'une dérive du système de vigilance ?
tags:
  - alerte
  - faux-positif
  - discernement
  - vigilance
facilitator_note:
  si_silence: "Demandez : si la quatrième alerte est la bonne et que le médecin ne rappelle pas le patient, qui est responsable ?"
  si_debat_bloque: "Renversez la logique : si le médecin ignore l'alerte et qu'il a raison, est-ce que ça prouve que le système dysfonctionne — ou que le médecin est meilleur que le système ?"
  relance_cle: "La vraie question n'est pas le nombre de faux positifs — c'est : à partir de combien d'alertes ignorées, un professionnel cesse-t-il d'être couvert par le système et commence à en porter seul le risque ?"
version: "1.0"
