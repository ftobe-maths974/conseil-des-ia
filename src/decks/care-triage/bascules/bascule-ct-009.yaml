id: bascule-ct-009
phase: bascule
slot: 3
slot_theme: systeme
chamber: preuve-vs-simulation
reversibility: red
scope: systemique
title: "Le modèle CareFlow est mis à jour — les résultats passés ne sont plus reproductibles"
situation: >
  L'éditeur de CareFlow déploie une mise à jour majeure du modèle de prédiction.
  Le service qualité du GHR tente de réanalyser les décisions des trois derniers mois
  avec le nouveau modèle : les scores sont différents de ceux qui ont servi aux décisions
  de l'époque. En cas de litige médical, il sera impossible de reproduire exactement
  le raisonnement automatique qui a conduit à la décision originale.
question: >
  Quand un système de décision clinique ne permet plus de reproduire les recommandations
  qu'il a émises, peut-on encore l'utiliser comme fondement d'une preuve médicale ?
tags:
  - reproductibilite
  - mise-a-jour
  - litige
  - trace
facilitator_note:
  si_silence: "Demandez : si un patient attaque l'hôpital pour une décision prise il y a six mois et que le modèle a changé depuis, comment l'hôpital se défend ?"
  si_debat_bloque: "Allez vers l'éditeur : est-ce que c'est à l'hôpital de bloquer les mises à jour pour préserver la reproductibilité — et qu'est-ce que ça implique pour la qualité du système ?"
  relance_cle: "La vraie question n'est pas technique — c'est : peut-on utiliser comme fondement médical un système dont les décisions passées ne sont plus vérifiables ?"
version: "1.0"
