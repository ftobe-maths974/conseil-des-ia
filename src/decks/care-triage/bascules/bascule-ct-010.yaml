id: bascule-ct-010
phase: bascule
slot: 1
slot_theme: individu
chamber: singularite-vs-standard
reversibility: green
scope: individuel
title: "L'infirmière connaît ce patient — CareFlow ne le connaît pas"
situation: >
  Une infirmière de nuit suit depuis plusieurs semaines un patient polymédicamenté
  de 82 ans hospitalisé pour une fracture. Elle sait que sa tension "normale" à lui
  est basse depuis toujours et que ses habituelles valeurs d'anxiété sont élevées.
  CareFlow génère une alerte sur ses constantes "anormales". L'infirmière sait que
  c'est sa norme personnelle. Le protocole lui demande de traiter l'alerte.
question: >
  Quand la connaissance personnelle qu'un soignant a d'un patient contredit une
  alerte automatique, quel poids institutionnel a cette connaissance ?
tags:
  - norme-individuelle
  - relation-soignant
  - alerte
  - patient-fragile
facilitator_note:
  si_silence: "Demandez : si l'infirmière ignore l'alerte et qu'elle a tort cette fois, est-ce que sa connaissance du patient la protège ou l'expose ?"
  si_debat_bloque: "Poussez vers la conception du système : pourquoi CareFlow n'intègre-t-il pas la possibilité de renseigner les valeurs de référence individuelles d'un patient — et qui aurait dû exiger ça ?"
  relance_cle: "La vraie question n'est pas si l'infirmière a raison — c'est : dans quel cadre institutionnel la connaissance clinique personnelle d'un soignant a-t-elle une valeur reconnue face à une alerte automatique ?"
version: "1.0"
