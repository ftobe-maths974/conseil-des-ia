id: bascule-ct-011
phase: bascule
slot: 2
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
scope: organisationnel
title: "Les filières spécialisées contournent CareFlow — officiellement, elles ne le font pas"
situation: >
  Plusieurs services spécialisés du GHR (oncologie, rhumatologie, maladies rares)
  ont développé des pratiques informelles pour contourner les recommandations CareFlow
  qu'ils jugent inadaptées à leurs patients. Ils documentent les décisions différemment
  pour ne pas générer de non-conformités dans les tableaux de bord. La direction n'est
  pas informée de l'étendue de ces pratiques.
question: >
  Quand les soignants experts contournent systématiquement un système pour protéger
  leurs patients, le problème est-il leur comportement ou les limites du système ?
tags:
  - contournement
  - specialite
  - conformite
  - adaptation
facilitator_note:
  si_silence: "Demandez : si la direction découvrait ces pratiques demain, est-ce que les soignants seraient sanctionnés — et est-ce que ce serait juste ?"
  si_debat_bloque: "Retournez vers la direction : elle n'est pas informée — est-ce qu'elle ne veut pas savoir, ou est-ce qu'elle préfère que ça reste invisible pour maintenir les indicateurs de conformité ?"
  relance_cle: "La vraie question n'est pas si le contournement est légitime — c'est : quand les experts protègent leurs patients en contournant le système, qui est responsable de ce que le système officiel dit de leurs décisions ?"
version: "1.0"
