id: bascule-ct-014
phase: bascule
slot: 2
slot_theme: organisation
chamber: metabolisme-vs-progres
reversibility: yellow
scope: organisationnel
title: "La mise à jour CareFlow mobilise deux semaines — le service tourne à moitié"
situation: >
  La migration vers la nouvelle version de CareFlow nécessite deux semaines de
  paramétrisation, de tests et de formation. Pendant cette période, plusieurs
  fonctionnalités sont indisponibles. Le service des urgences réduit son activité
  programmée. Deux soignants référents consacrent 60 % de leur temps à la migration.
  La direction considère que c'est "un coût d'investissement normal". Le personnel
  parle de charge supplémentaire non anticipée.
question: >
  À partir de quel niveau de dépendance opérationnelle la maintenance d'un outil
  numérique représente-t-elle un risque pour la continuité des soins ?
tags:
  - maintenance
  - charge-operationnelle
  - migration
  - continuite
facilitator_note:
  si_silence: "Posez la question : pendant ces deux semaines, si un incident clinique se produit dans les fonctionnalités dégradées, qui est responsable — le service, la direction, ou l'éditeur ?"
  si_debat_bloque: "Retournez l'argument de la direction : si c'est un coût d'investissement normal, est-ce que ça veut dire qu'il y aura une migration tous les ans — et comment ça s'intègre au plan de soins ?"
  relance_cle: "La vraie question n'est pas si la charge est acceptable — c'est : à partir de quel niveau de dépendance technique, la maintenance d'un outil numérique devient-elle une décision médicale que la direction n'a pas le droit de prendre seule ?"
version: "1.0"
