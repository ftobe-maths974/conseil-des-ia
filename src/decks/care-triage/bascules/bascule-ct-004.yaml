id: bascule-ct-004
phase: bascule
slot: 1
slot_theme: individu
chamber: invisibilite-vs-arbitrage
reversibility: green
scope: individuel
title: "Le patient ne sait pas que CareFlow a calculé son attente"
situation: >
  Aux urgences du GHR, le temps d'attente affiché sur l'écran de la salle est
  calculé par CareFlow à partir du score de triage et de la charge du service.
  Les patients voient un chiffre. Aucun panneau n'indique que ce délai est généré
  par un système automatisé. Ce matin, plusieurs patients se plaignent de l'attente ;
  l'infirmière d'accueil leur dit "c'est le système" sans pouvoir expliquer davantage.
question: >
  Un patient peut-il contester ou comprendre une décision qui le concerne si personne
  ne lui a dit qu'une décision a été prise par un système automatisé ?
tags:
  - information-patient
  - triage
  - transparence
  - attente
facilitator_note:
  si_silence: "Demandez : si vous étiez ce patient et qu'on vous dise 'c'est le système' sans rien expliquer, qu'est-ce que vous feriez ?"
  si_debat_bloque: "Poussez la question du droit : en France, un patient a le droit d'être informé des décisions automatisées qui le concernent — est-ce que ce qui se passe aux urgences du GHR respecte ce droit ?"
  relance_cle: "La vraie question n'est pas si le patient comprend l'algorithme — c'est : peut-il contester une décision dont il ignore qu'elle a été prise par une machine ?"
version: "1.0"
