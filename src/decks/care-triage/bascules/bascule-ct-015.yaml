title: "Le GHR veut sortir de CareFlow — l'éditeur annonce deux ans de transition"
situation: >
  Après trois ans de déploiement, la direction du GHR envisage de changer de
  prestataire. L'éditeur de CareFlow indique que la migration des données, la
  formation des équipes et la reprise des protocoles vers un nouveau système
  nécessiteront 18 à 24 mois. Pendant cette période, le GHR resterait dépendant
  des serveurs de l'éditeur. La décision de déploiement initiale ne comportait
  aucune clause de réversibilité documentée.
question: >
  Si sortir d'un système prend deux fois plus de temps qu'y entrer, peut-on encore
  parler de choix réversible au moment où la décision de déploiement a été prise ?
tags:
  - lock-in
  - reversibilite
  - contrat
  - dependance
facilitator_note:
  si_silence: "Demandez : si la décision de déploiement avait inclus une clause de réversibilité, est-ce que ça aurait changé quelque chose — ou est-ce que personne ne l'aurait lue de toute façon ?"
  si_debat_bloque: "Allez vers le moment de la décision initiale : qui au GHR a signé le contrat sans clause de réversibilité — et est-ce qu'ils savaient ce qu'ils signaient ?"
  relance_cle: "La vraie question n'est pas si 18 mois c'est trop long — c'est : peut-on encore parler de choix souverain quand le coût de sortie a été délibérément rendu invisible au moment de l'entrée ?"
version: "1.0"
