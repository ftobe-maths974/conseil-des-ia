chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Le GHR supprime le poste de coordonnateur de triage — CareFlow suffit"
situation: >
  Lors de la révision budgétaire annuelle, la direction du GHR décide de ne pas
  renouveler le poste de coordonnateur de triage, occupé depuis dix ans par un
  cadre infirmier expérimenté. L'argument : CareFlow couvre désormais cette fonction.
  La décision est présentée comme une rationalisation. Elle n'est pas réversible
  à court terme — le profil est retiré des plans de recrutement.
question: >
  À partir de quel moment la suppression d'un poste humain au profit d'un système
  automatisé crée-t-elle une irréversibilité institutionnelle que l'organisation
  ne peut plus défaire ?
tags:
  - poste
  - rationalisation
  - dependance
  - irréversibilite
facilitator_note:
  si_silence: "Posez la question : si CareFlow tombe en panne demain matin, qui dans ce service est encore capable de coordonner le triage sans lui ?"
  si_debat_bloque: "Retournez l'argument de la direction : si c'est vraiment une rationalisation, pourquoi est-ce que la décision est 'non réversible à court terme' dès l'annonce ?"
  relance_cle: "La vraie question n'est pas si le poste était utile — c'est : à quel moment une décision budgétaire devient-elle une décision clinique que personne n'a validée ?"
version: "1.0"
