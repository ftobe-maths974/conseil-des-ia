chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Le protocole dit CareFlow — le médecin signe, sans savoir pourquoi"
situation: >
  Le service de médecine interne du GHR a intégré CareFlow dans son protocole de
  sortie : les recommandations de sortie anticipée sont générées automatiquement.
  Le médecin senior signe les ordres de sortie sur la base du tableau de bord CareFlow.
  Lors d'un audit interne, il ne peut pas expliquer sur quels critères CareFlow a
  déclenché la recommandation de sortie pour trois patients de la semaine passée.
question: >
  Quand un médecin ne peut plus expliquer les décisions qu'il signe, qui assume
  réellement la responsabilité clinique — lui ou le système ?
tags:
  - responsabilite
  - signature
  - sortie
  - protocole
