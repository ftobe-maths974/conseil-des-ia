id: bascule-ct-012
phase: bascule
slot: 3
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: red
scope: systemique
title: "CareFlow est conçu pour les cas courants — les cas rares deviennent invisibles"
situation: >
  Le GHR traite en moyenne 120 patients par pathologie rare chaque année. Lors du
  déploiement de CareFlow, l'éditeur a informé la direction que le modèle n'avait
  pas été entraîné sur ce type de population. Cet avertissement figure en annexe
  du contrat technique. Il n'a pas été communiqué aux équipes cliniques. Ces patients
  continuent à passer par le triage automatisé sans signal particulier.
question: >
  Si un système sait qu'il ne peut pas bien gérer certains patients mais ne le
  signale pas à ceux qui les prennent en charge, à qui appartient la responsabilité
  des erreurs qui en résultent ?
tags:
  - maladie-rare
  - responsabilite
  - information
  - population-exclue
facilitator_note:
  si_silence: "Posez la question : l'avertissement de l'éditeur est en annexe du contrat technique — qui dans cet hôpital aurait dû le lire et le transmettre aux équipes ?"
  si_debat_bloque: "Allez vers les patients : ces patients passent par un triage automatisé qui sait qu'il n'est pas fait pour eux — est-ce qu'ils ont le droit de le savoir ?"
  relance_cle: "La vraie question n'est pas qui a lu le contrat — c'est : quand un système signale ses propres limites en annexe mais continue à s'appliquer à tous, est-ce une information ou une protection juridique pour l'éditeur ?"
version: "1.0"
