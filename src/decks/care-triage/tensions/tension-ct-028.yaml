id: tension-ct-028
phase: tension
slot: 1
slot_theme: individu
chamber: singularite-vs-standard
reversibility: green
title: "Le patient atypique perturbe le flux — ou révèle les limites du standard"
content: >
  Un patient avec un profil clinique hors-standard ralentit le processus de triage
  automatisé : son cas ne s'inscrit pas dans les catégories de CareFlow, nécessite
  une consultation supplémentaire, génère des alertes mal calibrées. Du point de vue
  opérationnel, ce patient est coûteux. Du point de vue clinique, il est exactement
  le type de patient pour lequel un triage expert est indispensable. Sa présence révèle
  que l'efficience du standard repose sur l'exclusion des cas qui en sortent.
question: >
  Le temps supplémentaire consacré par CareFlow aux patients atypiques est-il un
  dysfonctionnement du système ou la preuve que le système ne couvre pas ces patients ?
tags:
  - atypie
  - standard
  - efficience
  - cas-complexe
facilitator_note:
  si_silence: "Demandez : si un système de triage génère des alertes mal calibrées pour certains patients et nécessite des consultations supplémentaires pour eux, est-ce que ces patients sont servis par le système — ou est-ce qu'ils le contournent ?"
  si_debat_bloque: "Poussez sur la définition du coût : si le patient atypique coûte plus cher au système en temps et en ressources, ce coût est-il un problème d'efficience ou le signe que le standard a été conçu sans lui ?"
  relance_cle: "La vraie question n'est pas si les patients atypiques sont difficiles à gérer — c'est si un standard qui exclut les cas qui en sortent peut encore être présenté comme un standard de qualité."
version: "1.0"
