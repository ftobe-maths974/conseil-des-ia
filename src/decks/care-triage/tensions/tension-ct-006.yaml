id: tension-ct-006
phase: tension
slot: 6
slot_theme: organisation
chamber: delegation-vs-souverainete
reversibility: red
title: "L'audit interne de CareFlow révèle les dérogations — et décourage les prochaines"
content: >
  Lorsque le GHR conduit un audit des décisions s'écartant de CareFlow, il remplit
  une fonction de transparence légitime. Mais la publication interne de ces chiffres
  peut avoir un effet disciplinaire non voulu : les services avec un fort taux de
  dérogations sont questionnés, même si ces dérogations étaient cliniquement fondées.
  La mesure de la conformité devient une pression à l'alignement, indépendamment de
  la qualité des décisions prises.
question: >
  Un audit de conformité à CareFlow mesure-t-il la qualité des soins ou la docilité
  des soignants à l'égard du système ?
tags:
  - audit
  - conformite
  - derogation
  - pression-institutionnelle
facilitator_note:
  si_silence: "Demandez : si un service affiche 30 % de dérogations et de meilleurs résultats cliniques qu'un service à 5 %, que dit l'audit — et qui est convoqué ?"
  si_debat_bloque: "Prenez la perspective des soignants silencieux : ceux qui ont arrêté de déroger sans l'avouer — que mesurent-ils vraiment dans cet audit ?"
  relance_cle: "La vraie question est de savoir si l'audit mesure ce que le GHR dit vouloir — la qualité des soins — ou ce qu'il veut vraiment, la docilité au système."
version: "1.0"
