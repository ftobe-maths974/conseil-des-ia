id: tension-ct-032
phase: tension
slot: 5
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
title: "Les filières spécialisées veulent leur propre paramétrage — CareFlow devient fragmenté"
content: >
  Si chaque spécialité du GHR obtient un paramétrage CareFlow adapté à ses patients
  atypiques, la cohérence du système se fragmente. Les coûts de maintenance augmentent,
  les comparaisons inter-services deviennent difficiles, et la maîtrise globale du
  système se complique. L'adaptation à la singularité clinique de chaque service entre
  en tension directe avec la standardisation qui permet à CareFlow d'être gérable et
  comparable à l'échelle du GHR.
question: >
  Adapter CareFlow aux populations atypiques de chaque service est-il la condition
  d'un usage éthique ou la fragmentation qui rendra le système ingouvernable ?
tags:
  - paramétrage
  - fragmentation
  - specilite
  - standardisation
facilitator_note:
  si_silence: "Demandez : si la cardiologie, la pédiatrie et la gériatrie ont chacune un paramétrage CareFlow différent, est-ce que le GHR utilise encore un système commun — ou trois systèmes distincts qui partagent une interface ?"
  si_debat_bloque: "Poussez sur le coût de la fragmentation : si chaque adaptation locale rend les comparaisons impossibles et augmente la charge de maintenance, à quel moment le coût de l'adaptation dépasse-t-il le bénéfice clinique — et comment le mesure-t-on ?"
  relance_cle: "La vraie question n'est pas si l'adaptation est souhaitable — c'est si un outil qui doit être fragmenté pour être éthique peut encore remplir sa promesse de standardisation et d'équité entre services."
version: "1.0"
