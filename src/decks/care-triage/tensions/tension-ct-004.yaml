title: "Standardiser le triage accélère le flux — et rend les écarts difficiles à justifier"
content: >
  CareFlow a réduit les temps d'attente aux urgences du GHR de 23 % depuis son
  déploiement. Cette performance repose sur la standardisation des critères de triage.
  Mais cette standardisation rend les exceptions plus visibles et plus coûteuses à
  défendre : un médecin qui s'écarte du score doit documenter, motiver, accepter d'être
  audité. Le gain collectif de fluidité crée une pression individuelle sur l'exercice
  du jugement clinique en dehors du standard.
question: >
  Le gain d'efficience collectif produit par la standardisation de CareFlow justifie-t-il
  la pression exercée sur les soignants qui s'en écartent pour raison clinique ?
tags:
  - standardisation
  - efficience
  - exception
  - pression
facilitator_note:
  si_silence: "Demandez : si un médecin s'écarte du score pour une raison clinique valide et que le patient s'en sort bien, est-ce que cet écart apparaît dans l'audit comme une réussite ou comme une non-conformité ?"
  si_debat_bloque: "Pensez au patient : a-t-il consenti à être trié par un standard qui optimise le flux global plutôt que sa situation individuelle ?"
  relance_cle: "La vraie question est de savoir si une réduction de 23 % des temps d'attente est un bénéfice pour tous ou un bénéfice moyen qui masque des perdants."
version: "1.0"
