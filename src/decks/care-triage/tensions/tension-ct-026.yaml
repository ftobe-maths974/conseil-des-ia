title: "Le seuil de fiabilité de CareFlow est une donnée technique — pas une réponse clinique"
content: >
  Publier le seuil de fiabilité de CareFlow — par exemple "71 % de précision sur la
  cohorte de validation" — répond à une exigence de transparence. Mais cette statistique
  n'indique pas à quel patient elle s'applique réellement. Un seuil global de 71 %
  peut masquer une précision de 90 % sur une population et de 45 % sur une autre.
  Le soignant qui lit "71 %" ne sait pas s'il est dans la zone de fiabilité ou dans
  la zone d'erreur pour le patient en face de lui.
question: >
  Un indicateur de fiabilité global de CareFlow informe-t-il réellement le soignant
  sur la valeur de la recommandation pour le patient qu'il traite, ou crée-t-il une
  illusion de certitude quantifiée ?
tags:
  - fiabilite
  - statistique
  - incertitude
  - decision-clinique
facilitator_note:
  si_silence: "Demandez : si un médecin vous dit 'ce test est fiable à 71 %', est-ce que vous sauriez si cette statistique s'applique à vous personnellement — ou est-ce qu'elle s'applique à une population dont vous faites peut-être partie à 45 % de fiabilité ?"
  si_debat_bloque: "Poussez sur la granularité : si le seuil global masque des variations importantes selon les sous-populations, comment le soignant devrait-il interpréter ce chiffre pour le patient qu'il a devant lui — et que se passe-t-il s'il ne le sait pas ?"
  relance_cle: "La vraie question n'est pas si publier un taux de fiabilité est utile — c'est si un chiffre global qui masque des hétérogénéités importantes informe réellement ou crée une fausse certitude."
