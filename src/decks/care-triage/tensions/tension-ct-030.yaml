id: tension-ct-030
phase: tension
slot: 3
slot_theme: individu
chamber: singularite-vs-standard
reversibility: red
title: "Le patient qui connaît son atypie doit encore la prouver à chaque passage"
content: >
  Un patient porteur d'une pathologie rare ou d'un profil physiologique atypique
  dispose souvent d'une connaissance fine de sa propre singularité médicale. Mais
  cette connaissance n'est pas intégrée dans CareFlow : à chaque passage, le patient
  doit réexpliquer son cas à un nouveau soignant, qui doit convaincre le système ou
  déclencher une dérogation. La charge de la preuve de son atypie repose sur le patient
  lui-même, à répétition.
question: >
  Imposer à un patient de démontrer son atypie à chaque contact avec le système
  CareFlow, est-ce une limite acceptable du standard ou un échec du droit à la
  continuité des soins personnalisés ?
tags:
  - pathologie-rare
  - continuite
  - charge-patient
  - atypie
facilitator_note:
  si_silence: "Demandez : si vous avez un profil médical atypique et que vous devez réexpliquer votre cas à chaque passage aux urgences parce que le système ne l'a pas mémorisé, qu'est-ce que ça vous dit sur votre place dans ce système de soins ?"
  si_debat_bloque: "Poussez sur la continuité : si le droit à des soins personnalisés existe en théorie mais que sa mise en œuvre repose entièrement sur la capacité du patient à argumenter son cas à répétition, qui bénéficie réellement de ce droit ?"
  relance_cle: "La vraie question n'est pas si CareFlow peut être amélioré — c'est si un système qui transfère sur le patient la charge de prouver son atypie à chaque contact respecte le principe de continuité des soins."
version: "1.0"
