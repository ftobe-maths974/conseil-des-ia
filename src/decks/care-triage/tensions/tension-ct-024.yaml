title: "L'éditeur met à jour CareFlow — le GHR perd la maîtrise de ce qu'il utilise"
content: >
  Chaque mise à jour de CareFlow modifie potentiellement les critères internes du
  modèle. Le GHR n'a pas de droit de veto sur ces mises à jour — elles sont
  contractuellement imposées pour des raisons de sécurité et de performance. Après
  une mise à jour, les soignants utilisent un système dont les critères ont changé,
  sans qu'une nouvelle formation ou validation clinique ait eu lieu. La preuve que
  le nouveau modèle est aussi adapté à la population du GHR n'est pas établie.
question: >
  Si l'éditeur peut modifier unilatéralement les critères de CareFlow, le GHR
  peut-il encore garantir que le système qu'il utilise est le même que celui
  qu'il a validé ?
tags:
  - mise-a-jour
  - souverainete
  - critères
  - preuve
facilitator_note:
  si_silence: "Demandez : si CareFlow a été validé cliniquement sur la population du GHR, et qu'une mise à jour change ses critères sans nouvelle validation, est-ce que le GHR utilise encore le système qu'il a approuvé ?"
  si_debat_bloque: "Poussez sur la clause contractuelle : si les mises à jour sont imposées pour des raisons de sécurité, mais sans preuve d'adéquation à la population locale, qui porte la responsabilité d'une décision basée sur un modèle modifié unilatéralement ?"
  relance_cle: "La vraie question n'est pas si les mises à jour sont nécessaires — c'est si un établissement peut déléguer des décisions médicales à un système dont il n'a plus la maîtrise des critères."
version: "1.0"
