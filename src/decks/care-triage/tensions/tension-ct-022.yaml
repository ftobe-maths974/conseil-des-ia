chamber: preuve-vs-simulation
reversibility: green
title: "Valider CareFlow sur une cohorte locale coûte cher — et retarde le bénéfice attendu"
content: >
  L'éditeur de CareFlow propose une validation sur cohorte nationale. Une validation
  locale sur les patients du GHR serait plus représentative mais coûterait six mois
  et un budget non alloué. La direction arbitre entre un bénéfice rapide avec un risque
  de biais non local, et une fiabilité mieux établie avec un délai pendant lequel
  les patients du GHR ne bénéficient pas du système. Les deux positions sont défendables.
question: >
  Déployer CareFlow sur une validation nationale avant qu'une validation locale soit
  possible est-il une prise de risque acceptable ou une négligence de la spécificité
  de la population du GHR ?
tags:
  - validation
  - cohorte
  - coût
  - deploiement
facilitator_note:
  si_silence: "Demandez : si la population du GHR est significativement différente de la cohorte nationale — plus âgée, plus précaire, profil de comorbidités distinct — sur quelle base clinique la direction justifie-t-elle le déploiement immédiat ?"
  si_debat_bloque: "Retournez vers les patients qui attendent : six mois de délai pour une validation locale, c'est aussi six mois pendant lesquels des patients comparables bénéficient d'un outil mieux calibré ailleurs."
  relance_cle: "La vraie question est de savoir si accepter une validation nationale quand la population locale est spécifique est une prise de risque raisonnée ou une économie sur la sécurité."
version: "1.0"
