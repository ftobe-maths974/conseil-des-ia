id: tension-ct-033
phase: tension
slot: 6
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: red
title: "Documenter les dérogations CareFlow améliore le système — ou dissuade de les faire"
content: >
  Chaque dérogation documentée dans CareFlow est une donnée précieuse pour améliorer
  le modèle : elle signale un cas que le standard ne couvre pas bien. L'éditeur peut
  en théorie intégrer ces données dans une future version. Mais la documentation
  systématique des dérogations crée aussi un registre des non-conformités que la
  direction peut utiliser comme indicateur de performance des services. Cela dissuade
  certains soignants de déroger, même quand c'est cliniquement justifié.
question: >
  Documenter les dérogations à CareFlow pour améliorer le système crée-t-il une
  incitation positive à signaler les limites ou une pression à la conformité qui
  réduit ces signalements ?
tags:
  - derogation
  - documentation
  - amelioration
  - incitation
facilitator_note:
  si_silence: "Demandez : si vous saviez que chaque fois que vous prenez une décision qui s'écarte du standard, cette décision est enregistrée dans un registre consultable par votre direction, est-ce que vous la preniez quand même ?"
  si_debat_bloque: "Poussez sur la double fonction du registre : si les données de dérogation sont à la fois utiles pour améliorer CareFlow et potentiellement utilisées pour évaluer la conformité des soignants, ces deux usages sont-ils compatibles — ou l'un détruit-il l'autre ?"
  relance_cle: "La vraie question n'est pas si documenter les dérogations est utile — c'est si un registre qui peut servir d'outil d'amélioration ET d'outil de surveillance peut réellement remplir les deux fonctions sans que l'une nuise à l'autre."
version: "1.0"
