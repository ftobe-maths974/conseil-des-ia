title: "Publier les biais de CareFlow renforce la confiance — ou ouvre des recours contentieux"
content: >
  L'audit des biais de distribution des scores CareFlow par population est une
  démarche éthiquement légitime et juridiquement attendue. Mais publier les résultats
  — même pour en corriger les écarts — expose le GHR à des recours juridiques de
  patients ayant été affectés par des décisions biaisées. La transparence sur les
  imperfections du système peut être freinée par la crainte du contentieux, même
  quand elle est nécessaire à l'amélioration.
question: >
  Rendre publics les biais identifiés dans CareFlow est-il un acte de responsabilité
  institutionnelle ou un risque juridique que le GHR ne peut pas assumer seul ?
tags:
  - biais
  - publication
  - contentieux
  - responsabilite
facilitator_note:
  si_silence: "Demandez : si l'audit interne du GHR révèle que CareFlow a systématiquement sous-scoré une population précise de patients, à quel moment le GHR a-t-il l'obligation légale de le rendre public ?"
  si_debat_bloque: "Renversez la perspective : si le GHR ne publie pas et que les biais sont découverts par un journaliste ou un avocat, quel est le coût de cette non-transparence ?"
  relance_cle: "La vraie question est de savoir si la peur du contentieux est une raison éthiquement défendable pour ne pas informer les patients qui ont été lésés."
version: "1.0"
