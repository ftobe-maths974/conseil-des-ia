title: "CareFlow peut repérer des signaux faibles que le clinicien manque — et l'inverse"
content: >
  CareFlow traite en temps réel des combinaisons de variables que le soignant ne
  peut pas intégrer simultanément en consultation. Il peut repérer des patterns
  associés à une décompensation que l'examen clinique ne détecte pas encore. Mais
  le soignant perçoit des éléments non capturés par le système : l'état émotionnel,
  la qualité du discours, le comportement non verbal. Les deux types de signal sont
  complémentaires — et aucun n'est plus "vrai" que l'autre par principe.
question: >
  Peut-on établir une hiérarchie valide entre la preuve produite par CareFlow et
  celle que construit le soignant par l'examen direct, ou les deux sont-elles
  irréductibles l'une à l'autre ?
tags:
  - signal-faible
  - complement
  - examen-clinique
  - preuve
facilitator_note:
  si_silence: "Demandez : si CareFlow détecte un signal de décompensation que le soignant n'a pas vu, est-ce que le soignant devrait suivre la recommandation — même s'il ne perçoit aucun signe clinique inquiétant devant lui ?"
  si_debat_bloque: "Poussez sur la complémentarité : si les deux types de preuve sont irréductibles l'un à l'autre, qu'est-ce qui doit décider quand ils divergent — et qui porte la responsabilité de ce choix ?"
  relance_cle: "La vraie question n'est pas lequel de CareFlow ou du soignant a raison — c'est si on peut construire une procédure légitime pour décider quand les deux preuves ne disent pas la même chose."
version: "1.0"
