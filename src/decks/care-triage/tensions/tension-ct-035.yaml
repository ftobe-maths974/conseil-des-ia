title: "Élargir la base d'entraînement de CareFlow aux cas rares améliore la couverture — et dilue la précision"
content: >
  Intégrer les patients atypiques dans la base d'entraînement de CareFlow permettrait
  de mieux les couvrir. Mais ces populations sont rares par définition — elles sont
  statistiquement minoritaires. Leur intégration peut dégrader la précision du modèle
  sur les cas courants, qui représentent 95 % des passages. L'éditeur doit arbitrer
  entre une couverture élargie et une précision maintenue. Les deux répondent à des
  exigences légitimes mais incompatibles à paramètres constants.
question: >
  Si améliorer la couverture de CareFlow pour les patients atypiques dégrade sa
  précision pour les patients courants, comment décider quel groupe mérite priorité ?
tags:
  - entraînement
  - couverture
  - precision
  - arbitrage
facilitator_note:
  si_silence: "Demandez : si améliorer CareFlow pour les patients rares dégrade légèrement sa précision pour tous les autres, qui devrait prendre cette décision — l'éditeur, le GHR, ou une instance de régulation externe ?"
  si_debat_bloque: "Poussez sur la nature de l'arbitrage : si l'arbitrage entre couverture et précision est un choix technique habillé en décision neutre, qui porte réellement la responsabilité des conséquences sur les groupes défavorisés par ce choix ?"
  relance_cle: "La vraie question n'est pas comment optimiser le modèle — c'est si un arbitrage entre la précision pour la majorité et la couverture des minorités peut être décidé sans que les personnes affectées aient leur mot à dire."
version: "1.0"
