title: "Le soignant qui maîtrise CareFlow est plus employable — celui qui ne le maîtrise pas, moins"
content: >
  La maîtrise de CareFlow devient progressivement une compétence attendue dans les
  recrutements hospitaliers de la région. Les soignants qui ont travaillé dans des
  établissements non équipés sont perçus comme moins opérationnels. Cette évolution
  du marché du travail hospitalier crée une pression à l'adoption du système non
  seulement institutionnelle mais individuelle. Le refus ou l'ignorance de CareFlow
  a désormais un coût personnel.
question: >
  Si maîtriser CareFlow devient une condition implicite d'employabilité pour les
  soignants, la décision de déployer le système appartient encore à l'institution
  ou est-elle déjà contrainte par le marché du travail qu'elle a contribué à créer ?
tags:
  - employabilite
  - compétence-requise
  - pression-marche
  - soignants
facilitator_note:
  si_silence: "Demandez : si maîtriser CareFlow devient une condition implicite pour être recruté dans un hôpital de la région, est-ce que le soignant qui n'a pas travaillé avec ce système est libre de ne pas l'adopter ?"
  si_debat_bloque: "Poussez sur la circularité : si l'adoption de CareFlow par les GHR crée une pression sur le marché du travail qui rend l'adoption par d'autres établissements quasi-obligatoire, qui a réellement décidé de déployer CareFlow à l'échelle régionale ?"
  relance_cle: "La vraie question n'est pas si CareFlow améliore l'employabilité — c'est si une standardisation portée par le marché du travail est encore une décision institutionnelle ou une contrainte de fait que plus personne n'a formellement choisie."
