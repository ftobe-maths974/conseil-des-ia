title: "L'auditabilité de CareFlow suppose un auditeur indépendant — qui ne peut pas exister"
content: >
  Pour qu'un audit des scores CareFlow soit crédible, il doit être conduit par un
  acteur indépendant du GHR et de l'éditeur. Mais un auditeur externe n'aura pas accès
  au code source propriétaire, et un auditeur interne n'est pas indépendant. Les
  agences publiques pourraient jouer ce rôle, mais elles n'ont pas la capacité technique
  de traiter un système aussi spécifique. L'exigence d'auditabilité reste formellement
  satisfaite sans être réellement remplie.
question: >
  Exiger que CareFlow soit auditable sans que les conditions d'un audit indépendant
  et compétent soient réunies, est-ce une garantie effective ou une obligation de
  façade ?
tags:
  - auditabilite
  - independance
  - audit
  - prestataire
facilitator_note:
  si_silence: "Demandez : quel organisme en France a aujourd'hui la capacité technique et l'accès contractuel pour auditer réellement les critères internes d'un système comme CareFlow — nommez-en un ?"
  si_debat_bloque: "Retournez vers la certification : si aucun auditeur crédible ne peut accéder au modèle, que certifie exactement le label CE médical apposé sur le système ?"
  relance_cle: "La vraie question est de savoir si l'exigence d'auditabilité sans les conditions de sa réalisation est une garantie ou une fiction rassurante."
version: "1.0"
