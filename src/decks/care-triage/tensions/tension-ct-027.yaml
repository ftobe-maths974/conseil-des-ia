title: "Documenter que CareFlow a orienté une décision change la nature de la responsabilité médicale"
content: >
  Si un médecin documente qu'une décision clinique a été prise "en cohérence avec
  la recommandation CareFlow", il crée une trace qui protège sa décision individuellement.
  Mais cette trace transforme aussi CareFlow en co-décideur documenté. En cas de
  complication, la question de la responsabilité de l'éditeur devient inévitable.
  L'éditeur, lui, a prévu contractuellement que CareFlow est un outil d'aide et non
  un décideur — laissant l'entière responsabilité au médecin.
question: >
  Peut-on documenter une décision comme "appuyée sur CareFlow" tout en maintenant
  que la responsabilité reste intégralement médicale — ou cette documentation
  crée-t-elle une contradiction juridique irrésoluble ?
tags:
  - responsabilite
  - documentation
  - co-décideur
  - editeur
facilitator_note:
  si_silence: "Demandez : si un médecin écrit dans le dossier 'décision prise en cohérence avec CareFlow', est-ce qu'il protège sa décision — ou est-ce qu'il engage aussi la responsabilité du système qu'il cite ?"
  si_debat_bloque: "Poussez sur la contradiction contractuelle : si l'éditeur stipule que CareFlow est un outil d'aide sans responsabilité propre, et que le médecin documente une décision 'appuyée sur CareFlow', qui a raison en cas de complication — et qui paie ?"
  relance_cle: "La vraie question n'est pas si le médecin peut s'appuyer sur CareFlow — c'est si on peut documenter une décision comme coconstruite avec un algorithme tout en maintenant que la responsabilité reste entièrement humaine."
