title: "Sortir de CareFlow est plus cher que d'y rester — même quand rester est problématique"
content: >
  À mesure que le déploiement de CareFlow s'approfondit — données intégrées,
  formations dispensées, procédures réorganisées autour du système — le coût de sortie
  augmente. À un certain point, rester devient moins cher que partir, même si la
  direction est consciente des problèmes du système. La décision de continuer n'est
  plus librement prise : elle est contrainte par l'irréversibilité accumulée. Le GHR
  peut ne plus avoir de choix réel, même formellement.
question: >
  Quand sortir de CareFlow coûte davantage que d'y rester malgré ses défauts,
  la décision de continuer est-elle encore un choix institutionnel libre ou la
  conséquence d'une irréversibilité construite progressivement ?
tags:
  - lock-in
  - coût-de-sortie
  - choix
  - irréversibilite
facilitator_note:
  si_silence: "Demandez : si la direction du GHR sait que CareFlow a des problèmes sérieux mais que sortir coûterait plus cher que rester, est-ce qu'elle peut encore dire que son choix de continuer est libre — et est-ce que ça change sa responsabilité ?"
  si_debat_bloque: "Poussez sur le moment du choix : si le vrai choix sur CareFlow se faisait au moment du déploiement initial et non lors de chaque renouvellement, quand le GHR a-t-il réellement décidé — et quelqu'un a-t-il mesuré l'irréversibilité à ce moment-là ?"
  relance_cle: "La vraie question n'est pas si le coût de sortie est trop élevé — c'est si une décision contrainte par une irréversibilité accumulée peut encore s'appeler un choix institutionnel, et qui porte la responsabilité de cette situation."
