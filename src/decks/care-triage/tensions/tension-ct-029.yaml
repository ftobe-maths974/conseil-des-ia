slot_theme: individu
chamber: singularite-vs-standard
reversibility: yellow
title: "La dérogation motivée protège le soignant — ou l'isole face au système"
content: >
  La dérogation motivée pour un patient hors-standard est une protection clinique
  et éthique importante. Mais dans la pratique, elle met le soignant dans une position
  délicate : il s'écarte du standard documenté, assume seul la responsabilité de
  cette décision, et expose son raisonnement à l'audit. Certains soignants renoncent
  à la dérogation non par conviction clinique, mais pour éviter d'être singularisés
  dans un contexte d'évaluation par conformité.
question: >
  Si exercer le droit à la dérogation motivée expose professionnellement le soignant,
  ce droit est-il encore une garantie pour le patient ou une charge supplémentaire
  pour le professionnel ?
tags:
  - derogation
  - responsabilite-individuelle
  - protection
  - pression
facilitator_note:
  si_silence: "Demandez : si un soignant sait qu'une dérogation motivée sera auditée et que sa conformité au standard sera évaluée, est-ce qu'il prend sa décision clinique librement — ou est-ce qu'il intègre la peur d'être singularisé ?"
  si_debat_bloque: "Poussez sur la valeur réelle de la dérogation : si certains soignants y renoncent par peur des conséquences professionnelles plutôt que par conviction clinique, combien de patients atypiques sont mal pris en charge sans que personne ne le sache ?"
  relance_cle: "La vraie question n'est pas si le droit à la dérogation existe — c'est si une garantie formelle qui n'est pas exercée en pratique par peur protège encore réellement le patient."
version: "1.0"
