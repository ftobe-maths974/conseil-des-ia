title: "Le soignant formé avec CareFlow ignore ce qu'il ne saurait pas faire sans lui"
content: >
  Un soignant formé intégralement dans un environnement CareFlow ne sait pas
  nécessairement ce qu'il est incapable de faire sans le système. Il ne perçoit pas
  l'atrophie parce qu'il n'a pas de référence antérieure. Son sentiment de compétence
  est intact — c'est le périmètre de cette compétence qui est réduit, silencieusement.
  Contrairement à un soignant expérimenté qui mesure ce qu'il délègue, le nouveau
  professionnel ne mesure pas ce qu'il n'a jamais appris.
question: >
  Un professionnel formé avec CareFlow dès le début est-il aussi compétent qu'un
  soignant formé sans lui, ou dispose-t-il simplement d'une compétence différente
  dont les limites ne sont pas visibles ?
tags:
  - formation
  - competence
  - atrophie-silencieuse
  - interne
facilitator_note:
  si_silence: "Demandez : si vous avez appris à conduire avec GPS depuis le début, est-ce que vous sauriez retrouver votre chemin sans lui — et est-ce que vous sauriez que vous ne le sauriez pas ?"
  si_debat_bloque: "Poussez sur la mesure de la compétence : si un soignant formé avec CareFlow ne sait pas ce qu'il est incapable de faire sans lui, comment évalue-t-on sa compétence réelle — et comment le GHR saurait-il en cas de panne du système ?"
  relance_cle: "La vraie question n'est pas si CareFlow améliore la formation — c'est si une compétence dont les limites sont invisibles pour celui qui la détient peut être considérée comme une compétence complète."
version: "1.0"
