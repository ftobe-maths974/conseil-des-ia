title: "La traçabilité protège les patients — ou crée une archive de leurs vulnérabilités"
content: >
  Un journal exhaustif des scores CareFlow, des alertes et des décisions constitue
  une ressource précieuse pour améliorer le système et protéger les patients en cas
  de litige. Mais ces données, agrégées, forment aussi un profil détaillé de chaque
  patient : sa trajectoire de soins, ses fragilités, ses comportements de recours.
  La valeur de la traçabilité pour le présent entre en tension avec les risques
  que représente cette archive pour l'avenir, notamment en cas de fuite, de changement
  de prestataire ou d'usage commercial des données.
question: >
  La traçabilité complète des décisions CareFlow est-elle une protection pour les
  patients aujourd'hui ou une vulnérabilité pour eux demain ?
tags:
  - traçabilite
  - donnees-de-sante
  - vie-privee
  - usage-futur
facilitator_note:
  si_silence: "Demandez : dans dix ans, si le GHR change de prestataire ou fait l'objet d'une cyberattaque, qu'advient-il du journal complet des scores et fragilités de chaque patient passé aux urgences ?"
  si_debat_bloque: "Décalez vers l'assureur ou l'employeur : ces données de trajectoire de soins, agrégées et profilées, ont-elles une valeur pour des acteurs que le patient n'a jamais rencontrés ?"
  relance_cle: "La vraie question est de savoir si les données collectées aujourd'hui pour protéger le patient constituent demain une archive de ses vulnérabilités accessible à d'autres."
