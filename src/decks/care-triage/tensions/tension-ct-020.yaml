title: "La répétition des fausses alertes CareFlow crée une désensibilisation clinique"
content: >
  Un taux de faux positifs trop élevé dans les alertes CareFlow entraîne un phénomène
  documenté : la désensibilisation aux alertes. Les soignants, après avoir constaté
  que la majorité des alertes ne se concrétisent pas, commencent à les traiter avec
  moins d'attention. Ce comportement est rationnel et prévisible. Mais il crée une
  nouvelle vulnérabilité : la prochaine alerte vraie sera traitée avec le même
  scepticisme que les fausses.
data_point: >
  Une étude publiée dans Critical Care Medicine (2022) montre que dans les services
  utilisant des systèmes d'alerte automatique, le taux de réponse clinique aux alertes
  chute de 78 % à 43 % en moins de 12 mois d'utilisation, en raison du bruit d'alerte.
question: >
  Quand les fausses alertes CareFlow conduisent les soignants à ignorer les vraies,
  la fiabilité du système nuit-elle à la sécurité plus qu'elle ne la renforce ?
tags:
  - faux-positif
  - desensibilisation
  - securite
  - alerte
facilitator_note:
  si_silence: "Demandez : dans votre service, quelle proportion des alertes CareFlow du mois dernier ont conduit à une action clinique réelle — et combien ont été fermées en moins de trente secondes ?"
  si_debat_bloque: "Retournez vers l'éditeur : si les soignants ignorent les alertes parce qu'elles sont trop fréquentes, est-ce la réponse des soignants qui est problématique ou le calibrage du système ?"
  relance_cle: "La vraie question est de savoir si un système d'alerte qui a perdu la confiance des soignants améliore encore la sécurité ou crée une couverture de responsabilité sans effet réel."
version: "1.0"
