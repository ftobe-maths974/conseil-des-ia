title: "CareFlow réduit la charge cognitive des soignants — et réduit aussi leur marge de manœuvre"
content: >
  L'argument principal en faveur de CareFlow est la réduction de la charge cognitive
  des soignants : moins de décisions répétitives, moins de vigilance constante, moins
  de fatigue décisionnelle. Cet avantage est réel. Mais la charge cognitive n'est pas
  seulement un coût : elle est aussi la condition de l'exercice du jugement. En
  réduisant la sollicitation cognitive, CareFlow réduit aussi les occasions d'exercer
  et de maintenir ce jugement.
question: >
  Si CareFlow réduit la charge cognitive des soignants en prenant en charge une partie
  de leur raisonnement clinique, est-ce une amélioration des conditions de travail
  ou une réduction progressive de leur capacité à décider sans aide ?
tags:
  - charge-cognitive
  - jugement-clinique
  - avantage
  - contrepartie
facilitator_note:
  si_silence: "Demandez : si un soignant prend moins de décisions difficiles parce que CareFlow les prend à sa place, est-ce qu'il est moins fatigué — ou est-ce qu'il perd progressivement la capacité de les prendre seul quand il le faudra ?"
  si_debat_bloque: "Poussez sur la distinction entre charge et jugement : si réduire la charge cognitive est un bénéfice réel, et que maintenir le jugement clinique exige de l'exercer régulièrement, comment préserve-t-on les deux simultanément — ou faut-il choisir ?"
  relance_cle: "La vraie question n'est pas si alléger la charge cognitive des soignants est souhaitable — c'est si on peut déléguer une partie du raisonnement clinique à un algorithme sans que la capacité à raisonner sans lui se dégrade progressivement."
