id: tension-ct-034
phase: tension
slot: 7
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: green
title: "Le standard CareFlow produit l'équité pour la majorité — et l'invisibilité pour les marges"
content: >
  Un standard bien conçu garantit un traitement comparable à tous les patients qui
  entrent dans ses catégories. C'est une forme d'équité réelle et précieuse. Mais
  ce même standard, en traitant comme similaires des situations qui ne le sont pas,
  rend invisibles les patients qui s'en écartent. L'équité produite par la norme pour
  la majorité est réelle ; l'inégalité produite par la même norme pour les marges
  est aussi réelle, et moins visible.
data_point: >
  Une étude du BMJ (2022) sur l'usage de protocoles standardisés dans les urgences
  britanniques montre que les patients atteints de maladies rares ont un temps moyen
  de prise en charge supérieur de 40 % à celui des patients aux profils standards,
  sans corrélation avec la gravité clinique.
question: >
  Si l'équité par le standard est réelle pour la majorité mais structurellement
  défaillante pour les minorités cliniques, peut-on la qualifier d'équité sans
  qualifier l'inégalité qu'elle produit simultanément ?
tags:
  - equite
  - standard
  - majorite
  - exclusion
facilitator_note:
  si_silence: "Demandez : si un standard garantit un traitement identique pour 90 % des patients mais génère systématiquement des délais supplémentaires pour les 10 % restants, est-ce un système équitable — ou équitable pour la majorité ?"
  si_debat_bloque: "Poussez sur la visibilité de l'inégalité : si l'inégalité produite par le standard est moins visible que l'équité qu'il garantit, est-ce que cette invisibilité est accidentelle — ou est-elle une condition du maintien du standard ?"
  relance_cle: "La vraie question n'est pas si le standard produit de l'équité — c'est si une équité qui exclut structurellement certains patients peut encore être appelée équité sans nommer l'inégalité qu'elle produit en même temps."
version: "1.0"
