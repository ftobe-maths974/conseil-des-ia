title: "Le soignant qui résiste à CareFlow : indépendance ou non-conformité ?"
content: >
  Un médecin qui conteste régulièrement les recommandations de CareFlow et documente
  ses raisons exerce son autonomie clinique — c'est ce que la déontologie médicale
  lui impose. Mais dans une institution où CareFlow est le standard, sa résistance
  peut être lue comme un refus de coopérer, une source de non-conformités dans les
  tableaux de bord, voire un obstacle à l'efficience du service. La tension entre
  souveraineté clinique individuelle et cohérence institutionnelle est réelle.
question: >
  À partir de quel seuil de contestation des recommandations CareFlow un médecin
  cesse-t-il d'exercer son jugement clinique pour devenir un problème organisationnel ?
tags:
  - autonomie-clinique
  - conformite
  - resistance
  - deontologie
facilitator_note:
  si_silence: "Demandez : si ce médecin documente chaque dérogation et a toujours raison, à partir de combien de contestations par semaine la direction l'appelle-t-elle dans son bureau ?"
  si_debat_bloque: "Changez de perspective : ce n'est plus le médecin qui résiste, c'est le tableau de bord de conformité — qui décide ce qu'il mesure et dans quel but ?"
  relance_cle: "La vraie question est de savoir si l'institution utilise la conformité à CareFlow comme indicateur de qualité ou comme outil de management."
version: "1.0"
