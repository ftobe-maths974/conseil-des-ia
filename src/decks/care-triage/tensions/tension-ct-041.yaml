title: "L'audit de charge CareFlow révèle un surcoût — mais aussi un bénéfice réel"
content: >
  Un audit honnête de la charge organisationnelle induite par CareFlow produira
  probablement un résultat ambigu : certains services auront gagné du temps, d'autres
  l'auront perdu. Les gains de fluidité seront réels dans les services à fort volume ;
  les coûts de maintenance seront visibles dans les services spécialisés à faible
  volume. Décider de l'avenir du déploiement à partir de cet audit suppose d'accepter
  une réalité nuancée que les deux camps — pro et contra CareFlow — préféreront ne
  pas voir.
question: >
  Si un audit de charge de CareFlow montre des gains pour certains services et des
  coûts pour d'autres, comment l'institution décide-t-elle sans invisibiliser
  systématiquement ceux qui perdent ?
tags:
  - audit
  - charge
  - inegalite-service
  - decision
facilitator_note:
  si_silence: "Demandez : si l'audit montre que les urgences ont gagné 30 % de fluidité mais que la néonatologie a perdu 20 % de temps soignant, est-ce que la direction du GHR peut présenter CareFlow comme un succès global — et vis-à-vis de qui ?"
  si_debat_bloque: "Poussez sur la pondération : si certains services gagnent et d'autres perdent, qui décide comment pondérer ces résultats — et est-ce que les services qui perdent ont eu leur mot à dire dans cette pondération ?"
  relance_cle: "La vraie question n'est pas si l'audit est nécessaire — c'est si une décision prise à partir d'une moyenne qui cache des perdants visibles est une décision informée ou une décision politiquement commode."
version: "1.0"
