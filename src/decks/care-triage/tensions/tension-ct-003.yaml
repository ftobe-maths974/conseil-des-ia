title: "La signature du médecin sur une décision CareFlow : couverture ou responsabilité ?"
content: >
  Lorsqu'un médecin valide une recommandation CareFlow, il appose sa signature sur
  une décision dont il n'a pas nécessairement évalué tous les critères. Juridiquement,
  la signature transfère la responsabilité vers lui. Mais si la décision s'avère
  erronée et que les critères de CareFlow n'étaient pas visibles ou compréhensibles
  au moment de la validation, peut-on véritablement parler d'un acte médical libre
  et éclairé ? La signature protège l'éditeur autant qu'elle engage le médecin.
data_point: >
  Dans une étude sur la responsabilité médicale et les outils d'aide à la décision
  clinique (Delphi Medical Law Review, 2022), 67 % des juristes interrogés estiment
  que la validation d'une recommandation IA sans traçabilité des critères constitue
  une signature en blanc.
question: >
  Signer une recommandation CareFlow sans accès aux critères de calcul, est-ce
  exercer sa responsabilité médicale ou la déléguer à l'éditeur ?
tags:
  - responsabilite
  - signature
  - juridique
  - autonomie-clinique
facilitator_note:
  si_silence: "Demandez : quand vous validez une recommandation CareFlow, combien de temps regardez-vous réellement les critères avant de signer — cinq secondes, trente secondes, jamais ?"
  si_debat_bloque: "Retournez vers l'éditeur : si CareFlow n'est qu'un outil d'aide, pourquoi son contrat prévoit-il explicitement que la signature du médecin l'exonère de toute responsabilité ?"
  relance_cle: "La vraie question est de savoir si une signature apposée sur une recommandation opaque peut constituer un acte médical libre et éclairé."
version: "1.0"
