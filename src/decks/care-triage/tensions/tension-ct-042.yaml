id: tension-ct-042
phase: tension
slot: 6
slot_theme: organisation
chamber: metabolisme-vs-progres
reversibility: red
title: "Le bilan de réversibilité de CareFlow fait apparaître ce que le GHR ne voulait pas savoir"
content: >
  Produire un bilan de réversibilité honnête — coût de sortie, compétences perdues,
  procédures abandonnées — revient pour la direction à documenter les conséquences
  de ses propres décisions passées. Ce bilan peut révéler que le GHR a pris des
  engagements irréversibles sans les avoir anticipés. C'est une information nécessaire
  à une décision de renouvellement éclairée ; c'est aussi une information que la
  direction peut être tentée d'atténuer ou de ne pas produire du tout.
question: >
  Imposer un bilan de réversibilité avant tout renouvellement de CareFlow a-t-il
  une valeur réelle si c'est l'institution elle-même — et non un tiers indépendant —
  qui le produit ?
tags:
  - reversibilite
  - bilan
  - renouvellement
  - independance
facilitator_note:
  si_silence: "Demandez : si la direction du GHR doit produire un bilan qui documente les engagements irréversibles pris sans les avoir anticipés, pensez-vous qu'elle le produira de manière exhaustive — et qu'est-ce qui vous le fait dire ?"
  si_debat_bloque: "Poussez sur la valeur du bilan interne : si l'institution est à la fois productrice et destinataire du bilan de réversibilité, quelle valeur ce bilan a-t-il en pratique — et quelle instance pourrait le produire de façon indépendante ?"
  relance_cle: "La vraie question n'est pas si un bilan de réversibilité est utile — c'est si une institution peut évaluer objectivement ses propres engagements passés quand cette évaluation peut remettre en cause ses décisions futures."
version: "1.0"
