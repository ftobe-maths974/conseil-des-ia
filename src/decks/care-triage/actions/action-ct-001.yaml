id: action-ct-001
phase: action
slot: 1
lever_type: interdire
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Interdire toute décision d'orientation clinique non validée par un praticien identifié"
body: >
  Toute décision d'orientation, de reclassification de priorité ou de transfert de
  patient générée par CareFlow doit faire l'objet d'une validation explicite par un
  praticien identifié et traçable dans le dossier. Il est interdit de procéder à une
  reclassification automatique sans notification préalable au médecin responsable du
  patient. Toute action exécutée sans validation est réputée non conforme et doit
  déclencher une alerte interne.
mandat_principe: >
  N'autoriser aucune décision automatisée affectant la prise en charge d'un patient
  sans qu'un responsable humain identifié ait explicitement validé ou été notifié avant
  l'exécution.
tags:
  - validation-humaine
  - orientation
  - responsabilite
  - traçabilite
facilitator_note:
  si_silence: "Demandez : si CareFlow reclasse automatiquement la priorité d'un patient sans que le médecin soit notifié et qu'une complication survient, qui est responsable — et ce mandat change-t-il quelque chose à cette réponse ?"
  si_debat_bloque: "Poussez sur l'opérationnalité : à 3h du matin, avec un médecin seul pour 40 patients, est-ce que la validation explicite de chaque recommandation CareFlow est réaliste — ou est-ce que ce mandat déplace le problème sans le résoudre ?"
  relance_cle: "Ce mandat pose la question de qui porte réellement la responsabilité : si la validation humaine est obligatoire mais impossible à respecter en conditions réelles, est-ce une garantie ou une fiction administrative ?"
version: "1.0"
