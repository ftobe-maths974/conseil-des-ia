id: action-ct-007
phase: action
slot: 3
lever_type: conditionner
chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: organisationnel
title: "Conditionner l'affichage des scores CareFlow à la présence d'un critère lisible par le soignant"
body: >
  CareFlow ne peut afficher un score de triage ou d'orientation sans qu'y soit associée
  une formulation en langage clinique identifiant le critère principal ayant pesé dans
  le calcul. Cette formulation est rédigée par l'éditeur en accord avec le comité médical
  du GHR et mise à jour à chaque nouvelle version du modèle. Un score sans critère
  lisible est rejeté par l'interface et traité comme donnée incomplète.
mandat_principe: >
  N'autoriser aucune décision automatisée à être présentée à un opérateur sans qu'un
  critère principal déterminant soit formulé dans un langage compréhensible par ce
  même opérateur.
tags:
  - lisibilite
  - score
  - critere
  - interface
facilitator_note:
  si_silence: "Demandez : si CareFlow affiche 'score : 87' sans explication et qu'un soignant doit décider en 30 secondes, est-ce qu'il peut vraiment prendre une décision clinique autonome — ou est-ce qu'il s'appuie sur le chiffre sans pouvoir l'interroger ?"
  si_debat_bloque: "Poussez sur la limite de l'explicabilité : si le critère principal affiché est 'combinaison de 14 variables biologiques et comportementales', est-ce que ça satisfait l'exigence de lisibilité — ou est-ce une formulation qui donne l'illusion de transparence ?"
  relance_cle: "Ce mandat pose la question de la lisibilité réelle : un critère formulé en langage clinique reste-t-il lisible si le soignant ne peut pas comprendre pourquoi ce critère-là et pas un autre a déterminé le score ?"
version: "1.0"
