id: action-ct-002
phase: action
slot: 2
lever_type: conditionner
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Conditionner l'activation de CareFlow à la définition d'un responsable médical par module"
body: >
  Chaque module fonctionnel de CareFlow (triage, allocation de lits, suivi à distance,
  priorisation des sorties) doit être associé à un médecin ou cadre responsable nommément
  désigné, dont la mission inclut la supervision des recommandations automatiques et la
  capacité de suspendre le module en cas de dysfonctionnement avéré. L'activation d'un
  module sans responsable désigné est suspendue jusqu'à nomination formelle.
mandat_principe: >
  N'autoriser l'activation d'aucun outil de décision automatisée sans qu'un responsable
  humain nommément désigné soit compétent pour l'interrompre et en rendre compte.
tags:
  - responsabilite
  - gouvernance
  - module
  - designation
facilitator_note:
  si_silence: "Demandez : si chaque module CareFlow doit avoir un médecin nommément responsable et capable de le suspendre, combien de médecins au GHR savent aujourd'hui faire ça techniquement — et qui les a formés ?"
  si_debat_bloque: "Poussez sur le côté nominal : désigner un responsable sur le papier sans lui donner la formation, le temps et l'autorité réelle pour suspendre un module, est-ce de la gouvernance ou de la responsabilité diffuse organisée ?"
  relance_cle: "Ce mandat pose la question de la nomination comme acte réel : désigner un responsable change-t-il quelque chose si cette personne n'a ni le temps ni les moyens d'exercer cette responsabilité au quotidien ?"
version: "1.0"
