id: action-ct-004
phase: action
slot: 4
lever_type: limiter
chamber: delegation-vs-souverainete
reversibility: green
scope: individuel
title: "Plafonner le taux de recommandations CareFlow exécutées sans révision humaine"
body: >
  Le GHR fixe un seuil maximal de recommandations CareFlow exécutées sans révision
  explicite par un soignant : ce taux ne peut excéder 60 % sur une période mensuelle,
  par service. Les services dépassant ce seuil font l'objet d'un entretien avec la
  direction médicale pour évaluer si le niveau de délégation est approprié au contexte
  clinique et à la charge de travail réelle.
mandat_principe: >
  Plafonner la proportion de décisions exécutées sans révision humaine à ce qui peut
  être justifié, mesuré et réversible dans le contexte institutionnel concerné.
tags:
  - seuil
  - revision-humaine
  - delegation
  - service
facilitator_note:
  si_silence: "Demandez : si un service dépasse 60 % de recommandations exécutées sans révision, est-ce nécessairement un dysfonctionnement — ou est-ce que certains services, pour certaines décisions, peuvent légitimement déléguer davantage ?"
  si_debat_bloque: "Poussez sur le mécanisme de sanction : un entretien avec la direction médicale change-t-il quelque chose si la cause réelle du dépassement est le manque de personnel — et si ce mandat crée une pression supplémentaire sur des équipes déjà sous-dotées ?"
  relance_cle: "Ce mandat pose la question du seuil arbitraire : pourquoi 60 % et pas 40 ou 80 — et si le bon seuil dépend du contexte clinique et de la charge réelle, est-ce que fixer un chiffre unique est une réponse ou une simplification ?"
version: "1.0"
