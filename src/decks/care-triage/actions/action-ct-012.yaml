id: action-ct-012
phase: action
slot: 4
lever_type: limiter
chamber: preuve-vs-simulation
reversibility: green
scope: individuel
title: "Plafonner le recours aux modules prédictifs CareFlow aux pathologies validées en cohorte locale"
body: >
  Les modules de prédiction de CareFlow ne peuvent être utilisés en décision clinique
  que pour les pathologies et populations représentées dans la cohorte de validation
  locale du GHR. Pour toute pathologie ou profil non couvert, le module est désactivé
  par défaut et son usage requiert une demande motivée auprès du comité médical. La
  liste des pathologies couvertes est publiée et mise à jour à chaque nouvelle version.
mandat_principe: >
  Limiter l'usage de tout outil automatisé aux seuls périmètres pour lesquels sa
  fiabilité a été vérifiée sur une population représentative de celle qu'il affecte.
tags:
  - perimetre
  - cohorte
  - pathologie
  - validation-locale
facilitator_note:
  si_silence: "Demandez : si un soignant face à un patient avec une pathologie non couverte doit déposer une demande motivée auprès du comité médical pour utiliser CareFlow, quelle est la probabilité qu'il le fasse en situation d'urgence — et que se passe-t-il s'il utilise quand même le module ?"
  si_debat_bloque: "Poussez sur la responsabilité du vide : si le module est désactivé par défaut pour les pathologies non couvertes, qu'est-ce que le soignant utilise à la place — et si la réponse est 'son jugement seul', est-ce que ce mandat protège le patient ou le laisse avec moins d'outils ?"
  relance_cle: "Ce mandat pose la question du vide créé par la restriction : limiter l'usage de CareFlow aux périmètres validés est rigoureux — mais si ces périmètres excluent des patients réels, est-ce que la restriction les protège ou les prive d'un outil imparfait qui valait mieux que rien ?"
version: "1.0"
