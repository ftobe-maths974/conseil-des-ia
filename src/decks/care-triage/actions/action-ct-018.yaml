id: action-ct-018
phase: action
slot: 2
lever_type: auditer
chamber: metabolisme-vs-progres
reversibility: yellow
scope: organisationnel
title: "Auditer annuellement la charge réelle induite par CareFlow sur les équipes soignantes"
body: >
  Le GHR conduit chaque année un audit de charge organisationnelle lié à CareFlow :
  temps de saisie, gestion des alertes, résolution des désaccords avec les
  recommandations, formation continue nécessaire. L'audit est conduit avec les
  représentants des soignants et ses résultats conditionnent toute extension du
  périmètre fonctionnel. Une charge nette négative pour les équipes est un motif
  de suspension d'extension.
mandat_principe: >
  Exiger la mesure documentée et partagée des charges réelles induites par un système
  automatisé sur les opérateurs qui le font fonctionner, avant toute décision d'extension.
tags:
  - charge-cognitive
  - audit
  - conditions-travail
  - extension
facilitator_note:
  si_silence: "Demandez : si l'audit révèle que CareFlow génère une charge nette négative pour les équipes soignantes — plus de temps perdu qu'économisé — mais que la direction médicale veut quand même étendre son périmètre pour des raisons stratégiques, qu'est-ce que 'motif de suspension d'extension' signifie concrètement ?"
  si_debat_bloque: "Poussez sur la représentation : l'audit est 'conduit avec les représentants des soignants'. Si les soignants les plus touchés par la charge ne sont pas bien représentés, ou si leurs retours sont minimisés dans le rapport final, qui contrôle que l'audit reflète la réalité ?"
  relance_cle: "Ce mandat pose la question du pouvoir du résultat : un audit qui dit 'charge nette négative' sans mécanisme contraignant qui empêche l'extension — est-ce un outil de gouvernance ou un outil de communication qui légitime des décisions déjà prises ?"
version: "1.0"
