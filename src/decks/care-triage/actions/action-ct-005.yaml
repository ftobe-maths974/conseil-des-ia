id: action-ct-005
phase: action
slot: 1
lever_type: recours
chamber: invisibilite-vs-arbitrage
reversibility: green
scope: individuel
title: "Garantir à tout patient un droit d'explication et de contestation du score CareFlow"
body: >
  Tout patient ou son représentant légal peut demander, à tout moment, une explication
  en langage non technique des critères ayant conduit au score CareFlow qui l'affecte.
  Cette explication est fournie par écrit dans les 24 heures par un référent identifié.
  Le patient peut en outre demander une révision du score par un praticien humain, dont
  la décision motivée est intégrée au dossier et prime sur la recommandation automatique.
mandat_principe: >
  Garantir à toute personne affectée par une décision automatisée le droit d'en obtenir
  une explication accessible et de demander une révision par un humain compétent dont
  la décision est traçable.
tags:
  - droits-patient
  - explication
  - contestation
  - score
facilitator_note:
  si_silence: "Demandez : si un patient aux urgences dans un état grave peut théoriquement demander une explication de son score CareFlow — est-ce que ce droit est exercé par les patients qui en auraient le plus besoin, ou seulement par ceux qui savent qu'il existe ?"
  si_debat_bloque: "Poussez sur le délai : une explication écrite en 24h est utile pour un suivi ambulatoire, mais aux urgences une décision de triage a déjà produit ses effets en une heure. Est-ce que ce mandat protège les patients au moment où ça compte ?"
  relance_cle: "Ce mandat pose la question de l'effectivité du droit : un droit d'explication et de contestation qui existe formellement mais que les patients ne connaissent pas ou ne peuvent pas exercer en temps utile — est-ce encore un droit ?"
version: "1.0"
