chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: organisationnel
title: "Auditer semestriellement les biais de distribution des scores CareFlow par population"
body: >
  Le GHR mandate un audit semestriel des distributions de scores CareFlow, stratifiées
  par âge, sexe, origine géographique et pathologie chronique. L'audit identifie les
  populations sur- ou sous-scorées par rapport aux décisions cliniques effectives.
  Les résultats sont transmis au comité d'éthique et à la commission médicale
  d'établissement, avec un plan de correction si des écarts significatifs sont constatés.
mandat_principe: >
  Exiger la vérification régulière et documentée que les décisions automatisées ne
  produisent pas d'effets différenciés injustifiés selon les caractéristiques des
  personnes concernées.
tags:
  - biais
  - audit
  - population
  - equite
facilitator_note:
  si_silence: "Demandez : si l'audit révèle que les patients de plus de 80 ans sont systématiquement sous-scorés par rapport aux décisions cliniques effectives, qu'est-ce que le plan de correction implique concrètement — et qui le finance ?"
  si_debat_bloque: "Poussez sur la limite de l'audit : identifier des biais ne suffit pas à les corriger si les biais viennent des données d'entraînement que l'éditeur contrôle. Que peut faire le GHR seul — et que doit-il exiger contractuellement de l'éditeur ?"
  relance_cle: "Ce mandat pose la question de la correction possible : si les biais détectés dépassent ce que le GHR peut corriger unilatéralement, est-ce que l'audit crée une obligation sans donner les moyens de la remplir ?"
