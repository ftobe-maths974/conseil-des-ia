id: action-ct-016
phase: action
slot: 4
lever_type: interdire
chamber: singularite-vs-standard
reversibility: red
scope: systemique
title: "Interdire l'application d'un score CareFlow à un patient sans vérification de représentativité"
body: >
  Il est interdit d'appliquer une recommandation CareFlow à un patient dont le profil
  clinique principal est répertorié comme hors-champ de la base d'entraînement du
  modèle, sans qu'un soignant ait explicitement confirmé que la recommandation reste
  pertinente en dépit de cette limite. Cette confirmation est documentée au dossier.
  L'interface CareFlow doit afficher une alerte de représentativité dès qu'un profil
  hors-champ est détecté.
mandat_principe: >
  Interdire l'application automatique d'une décision standardisée à une personne dont
  le profil est reconnu comme hors-champ du système, sans vérification humaine
  explicitement documentée.
tags:
  - representativite
  - hors-champ
  - alerte
  - profil
facilitator_note:
  si_silence: "Demandez : si l'interface CareFlow affiche une alerte 'profil hors-champ' et que le soignant valide quand même la recommandation, parce qu'il n'a pas le temps ou pas de meilleure option — est-ce que la confirmation documentée protège le patient ou dégage CareFlow de responsabilité ?"
  si_debat_bloque: "Poussez sur la définition de 'hors-champ' : qui maintient la liste des profils hors-champ, à quelle fréquence, et si elle date de plus d'un an avec un modèle qui a été mis à jour depuis, est-ce que cette interdiction s'appuie sur une information fiable ?"
  relance_cle: "Ce mandat pose la question de l'alerte sans alternative : interdire l'application automatique d'un score à un profil hors-champ est rigoureux — mais si le soignant n'a pas d'outil de substitution, est-ce que l'alerte l'aide à décider ou lui rappelle seulement qu'il est seul ?"
version: "1.0"
