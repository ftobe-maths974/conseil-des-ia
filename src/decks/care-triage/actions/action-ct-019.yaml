chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Plafonner la dépendance opérationnelle à CareFlow en maintenant une compétence autonome certifiée"
body: >
  Le GHR garantit que, pour chaque fonction couverte par CareFlow, au moins 30 %
  des soignants du service concerné maintiennent une compétence certifiée à l'exercice
  de cette fonction sans assistance du système. Cette compétence est évaluée annuellement.
  Tout service ne respectant pas ce seuil est soumis à un programme de formation
  prioritaire avant toute extension du périmètre CareFlow dans le service.
mandat_principe: >
  Préserver la capacité d'un nombre minimal d'opérateurs à exercer toute fonction
  déléguée à un système automatisé, comme condition de non-dépendance irréversible.
tags:
  - dependance
  - competence-autonome
  - formation
  - seuil
facilitator_note:
  si_silence: "Demandez : pour évaluer annuellement que 30 % des soignants maintiennent une compétence certifiée sans CareFlow, comment la certification est-elle organisée — et si un soignant échoue, est-ce qu'il y a une conséquence sur son exercice ou seulement sur l'extension de CareFlow dans son service ?"
  si_debat_bloque: "Poussez sur le paradoxe du seuil : si 30 % des soignants gardent la compétence mais que les 70 % restants l'ont perdue, est-ce que le service peut vraiment fonctionner sans CareFlow en cas de panne — ou est-ce que 30 % est insuffisant pour une crise réelle ?"
  relance_cle: "Ce mandat pose la question du seuil suffisant : 30 % est un chiffre précis qui crée une obligation mesurable — mais est-ce que 30 % de soignants compétents sans CareFlow suffit à absorber une panne totale du système dans un service à fort volume, et qui a décidé que ce chiffre était le bon ?"
version: "1.0"
