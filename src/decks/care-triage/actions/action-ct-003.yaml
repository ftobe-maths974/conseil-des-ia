id: action-ct-003
phase: action
slot: 3
lever_type: auditer
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Auditer annuellement les périmètres de décision effectivement délégués à CareFlow"
body: >
  Le GHR conduit chaque année un audit interne recensant l'ensemble des décisions
  cliniques et organisationnelles pour lesquelles CareFlow produit des recommandations
  suivies d'exécution. L'audit compare les périmètres contractuels initiaux avec l'usage
  réel, identifie les glissements non formalisés et produit un rapport transmis au comité
  médical d'établissement et aux représentants du personnel.
mandat_principe: >
  Exiger la traçabilité et l'auditabilité publique de tout élargissement du périmètre
  de décision délégué à un système automatisé au sein d'une institution.
tags:
  - audit
  - perimetre
  - glissement
  - gouvernance
facilitator_note:
  si_silence: "Demandez : si CareFlow a progressivement étendu son périmètre au-delà du contrat initial et que personne ne l'a formalisé, est-ce que l'audit annuel va révéler des usages que la direction médicale ne savait pas qu'elle avait autorisés ?"
  si_debat_bloque: "Poussez sur l'utilité du rapport : l'audit produit un rapport transmis au comité médical. Qu'est-ce qui se passe si ce rapport révèle des glissements significatifs — quelles sont les conséquences réelles, et qui peut agir ?"
  relance_cle: "Ce mandat pose la question du glissement non gouverné : si les élargissements de périmètre arrivent par accumulation de petites décisions opérationnelles, est-ce que l'audit annuel peut vraiment les rattraper — ou mesure-t-il ce qui est déjà irréversible ?"
version: "1.0"
