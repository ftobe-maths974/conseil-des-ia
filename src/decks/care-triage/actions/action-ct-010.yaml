id: action-ct-010
phase: action
slot: 2
lever_type: interdire
chamber: preuve-vs-simulation
reversibility: red
scope: systemique
title: "Interdire l'usage d'une alerte CareFlow comme seule justification d'une décision d'admission"
body: >
  Aucune décision d'admission, d'hospitalisation préventive ou de transfert ne peut
  reposer exclusivement sur une alerte ou une prédiction CareFlow. Toute décision de
  ce type doit être motivée par un examen clinique documenté, indépendant du score
  automatique. L'alerte CareFlow peut déclencher un examen complémentaire ; elle ne
  peut pas s'y substituer. La mention "conformément à l'alerte CareFlow" sans
  observation clinique associée est réputée insuffisante dans le dossier.
mandat_principe: >
  N'autoriser aucune décision engageant la prise en charge d'une personne à reposer
  sur une sortie automatisée sans qu'une évaluation humaine indépendante en constitue
  la base documentée.
tags:
  - preuve
  - alerte
  - admission
  - evaluation-clinique
facilitator_note:
  si_silence: "Demandez : si CareFlow génère une alerte prédictive de décompensation et que le médecin fait un examen clinique qui ne confirme rien — mais qu'il décide d'hospitaliser quand même 'par précaution' — est-ce que la décision repose sur l'examen ou sur l'alerte ?"
  si_debat_bloque: "Poussez sur la distinction réelle/formelle : si documenter 'examen clinique réalisé, pas d'anomalie détectée, hospitalisation préventive maintenue' suffit à respecter ce mandat, est-ce que l'examen clinique est réellement indépendant du score — ou est-ce une formalité qui valide la décision algorithmique ?"
  relance_cle: "Ce mandat pose la question de l'indépendance cognitive : peut-on demander à un soignant qui a vu l'alerte CareFlow de faire un examen 'indépendant' du score, ou l'alerte a-t-elle déjà orienté son attention avant même qu'il touche le patient ?"
version: "1.0"
