id: action-ct-011
phase: action
slot: 3
lever_type: auditer
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Auditer la concordance entre prédictions CareFlow et évolutions cliniques réelles"
body: >
  Le GHR conduit trimestriellement un audit de concordance entre les alertes et
  prédictions CareFlow et les évolutions cliniques effectivement observées dans les
  30 jours suivants. L'audit calcule les taux de vrais positifs, faux positifs et
  faux négatifs par type d'alerte et par population. Les résultats alimentent un
  tableau de bord accessible aux équipes médicales et servent de base à toute décision
  de mise à jour ou de retrait du modèle.
mandat_principe: >
  Exiger la confrontation régulière et documentée entre les prédictions d'un système
  automatisé et les résultats observés, comme condition de maintien de son usage.
tags:
  - concordance
  - audit
  - prediction
  - tableau-de-bord
facilitator_note:
  si_silence: "Demandez : si l'audit révèle que CareFlow a un taux de faux positifs de 30 % pour un type d'alerte spécifique sur la population du GHR — qu'est-ce que les équipes médicales font de cette information au quotidien, et est-ce que ça change leur pratique ?"
  si_debat_bloque: "Poussez sur le paradoxe de l'audit de prévention : si une alerte CareFlow déclenche une hospitalisation préventive et que le patient ne décompense pas, est-ce un vrai positif ou un faux positif — et comment l'audit tranche-t-il cette question ?"
  relance_cle: "Ce mandat pose la question de la mesure possible : dans un contexte de médecine préventive où l'action modifie l'événement prédit, est-ce que l'audit de concordance mesure la fiabilité de CareFlow ou seulement sa capacité à déclencher des interventions ?"
version: "1.0"
