id: action-ct-009
phase: action
slot: 1
lever_type: conditionner
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Conditionner toute recommandation CareFlow à la publication de son seuil de fiabilité"
body: >
  Chaque recommandation clinique produite par CareFlow doit être accompagnée d'un
  indicateur de fiabilité documenté — précision, sensibilité, taux de faux positifs —
  calculé sur une cohorte de validation représentative de la population du GHR.
  Cet indicateur est affiché dans l'interface soignant. Toute recommandation produite
  par un modèle dont la cohorte de validation remonte à plus de 18 mois ou ne couvre
  pas la population concernée est signalée comme "fiabilité non certifiée".
mandat_principe: >
  N'autoriser aucune recommandation automatisée à être transmise ou exécutée sans
  qu'un indicateur de fiabilité documenté et daté soit joint et compréhensible par
  le destinataire.
tags:
  - fiabilite
  - seuil
  - validation
  - cohorte
facilitator_note:
  si_silence: "Demandez : si l'indicateur de fiabilité affiché est calculé sur une cohorte de validation nationale et que le GHR accueille une population atypique, est-ce que cet indicateur informe vraiment le soignant sur la fiabilité de la recommandation pour le patient devant lui ?"
  si_debat_bloque: "Poussez sur le label 'fiabilité non certifiée' : si le modèle dépasse 18 mois sans revalidation, le soignant voit ce label — est-ce qu'il arrête d'utiliser CareFlow, ou est-ce qu'il continue en ignorant l'avertissement parce qu'il n'a pas d'alternative ?"
  relance_cle: "Ce mandat pose la question de l'information actionnable : afficher un indicateur de fiabilité que le soignant ne peut pas ignorer mais ne peut pas non plus remplacer par autre chose — est-ce de la transparence ou une anxiety machine ?"
version: "1.0"
