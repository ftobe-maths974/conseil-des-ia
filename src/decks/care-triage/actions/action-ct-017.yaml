id: action-ct-017
phase: action
slot: 1
lever_type: conditionner
chamber: metabolisme-vs-progres
reversibility: yellow
scope: organisationnel
title: "Conditionner tout déploiement CareFlow à la maintenance d'une procédure de fonctionnement dégradé"
body: >
  Aucun module CareFlow ne peut être activé en exploitation si le GHR ne dispose pas
  d'une procédure documentée de fonctionnement dégradé couvrant le même périmètre
  fonctionnel, accessible à tous les soignants concernés et testée dans les six mois
  précédant le déploiement. La procédure dégradée est révisée à chaque mise à jour
  majeure de CareFlow et incluse dans la formation continue obligatoire des équipes.
mandat_principe: >
  Conditionner tout déploiement d'un outil automatisé à la préservation d'une
  capacité de fonctionnement autonome documentée, testée et maintenue à jour.
tags:
  - mode-degrade
  - reversibilite
  - procedure
  - formation
facilitator_note:
  si_silence: "Demandez : si tester la procédure dégradée est obligatoire tous les six mois avant déploiement, qui dans le GHR organise ce test, combien de temps ça prend — et si personne ne le fait, est-ce que le module est suspendu automatiquement ?"
  si_debat_bloque: "Poussez sur le coût réel de la maintenance : former toutes les équipes à fonctionner sans CareFlow ET avec CareFlow représente une charge de formation considérable. Dans un contexte de sous-effectif chronique, est-ce que ce mandat est opérationnel ou idéal ?"
  relance_cle: "Ce mandat pose la question du prix de la résilience : maintenir une capacité dégradée a un coût réel qui repose sur des équipes déjà sous tension. Si personne ne peut financer ce coût, est-ce que ce mandat protège contre la dépendance — ou l'institutionnalise en créant une obligation impossible à tenir ?"
version: "1.0"
