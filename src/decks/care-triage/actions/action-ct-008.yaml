id: action-ct-008
phase: action
slot: 4
lever_type: interdire
chamber: invisibilite-vs-arbitrage
reversibility: red
scope: systemique
title: "Interdire l'usage de scores CareFlow non journalisés dans les décisions de sortie"
body: >
  Toute décision de sortie, de transfert ou de refus d'admission appuyée sur un score
  CareFlow doit s'accompagner d'un enregistrement horodaté dans le dossier patient,
  mentionnant le score, les critères principaux et le nom du praticien ayant pris la
  décision finale. Il est interdit d'utiliser une recommandation CareFlow sans traçabilité
  dans les actes engageant la continuité des soins. Les données de journalisation sont
  conservées cinq ans et accessibles sur demande du patient ou de son représentant.
mandat_principe: >
  Exiger que toute décision engageant la continuité des soins d'une personne soit
  traçable, horodatée et attribuable à un responsable identifié, quelle que soit la
  part d'automatisation dans son élaboration.
tags:
  - journalisation
  - sortie
  - traçabilite
  - responsabilite
facilitator_note:
  si_silence: "Demandez : si la journalisation révèle qu'un praticien a utilisé des scores CareFlow sans observation clinique associée sur 80 % de ses décisions de sortie, qu'est-ce qui se passe — et est-ce que ce mandat crée une surveillance que les soignants n'ont pas demandée ?"
  si_debat_bloque: "Poussez sur le double effet : la journalisation protège le patient ET trace le praticien. Si les soignants perçoivent la traçabilité comme un outil de surveillance de leur travail plutôt que de protection du patient, comment ça change leur façon de documenter ?"
  relance_cle: "Ce mandat pose la question de la traçabilité comme outil ambivalent : exiger que chaque décision soit attribuable à un responsable identifié protège-t-il le patient — ou crée-t-il une pression qui pousse les soignants à documenter la conformité plutôt que la réalité ?"
version: "1.0"
