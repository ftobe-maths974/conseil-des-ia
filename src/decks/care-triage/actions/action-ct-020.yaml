id: action-ct-020
phase: action
slot: 4
lever_type: interdire
chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Interdire le renouvellement du contrat CareFlow sans bilan de réversibilité documenté"
body: >
  Le renouvellement ou l'extension du contrat CareFlow est subordonné à la production
  d'un bilan de réversibilité établissant : le coût estimé d'une sortie du système,
  les compétences perdues depuis le déploiement, les procédures autonomes dégradées
  ou abandonnées, et le délai estimé de retour à une capacité autonome complète.
  Ce bilan est soumis au conseil de surveillance du GHR et aux instances représentatives
  du personnel avant toute décision contractuelle.
mandat_principe: >
  N'autoriser aucune reconduction d'un engagement institutionnel envers un système
  automatisé sans bilan documenté des irréversibilités accumulées et du coût de sortie.
tags:
  - reversibilite
  - contrat
  - bilan
  - sortie
facilitator_note:
  si_silence: "Demandez : si le bilan de réversibilité montre que le coût de sortie de CareFlow est 10 fois plus élevé que ce qui était anticipé au déploiement, et que les compétences perdues prendraient 3 ans à reconstituer — est-ce que le conseil de surveillance peut encore décider de ne pas renouveler ?"
  si_debat_bloque: "Poussez sur le producteur du bilan : ce mandat exige un bilan documenté mais ne dit pas qui le produit. Si c'est la direction du GHR elle-même, avec un intérêt à minimiser les irréversibilités pour faciliter le renouvellement — quelle est la valeur de ce bilan ?"
  relance_cle: "Ce mandat pose la question du constat irréversible : un bilan de réversibilité produit après des années de déploiement peut révéler ce qu'on a perdu — mais peut-il encore changer la décision, ou mesure-t-il seulement l'ampleur d'une dépendance devenue inévitable ?"
version: "1.0"
