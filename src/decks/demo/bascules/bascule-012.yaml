id: bascule-012
phase: bascule
slot: 2
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: red
scope: systemique
title: "L'IA médicale entraînée sur des données majoritaires rate les cas minoritaires"
situation: >
  Les modèles de diagnostic IA sont entraînés sur des données hospitalières historiques,
  où certaines populations sont sous-représentées. Les erreurs de diagnostic se
  concentrent sur les mêmes groupes que les inégalités existantes — et sont désormais
  automatisées à grande échelle.
question: >
  Peut-on déployer un outil médical dont on sait qu'il est moins fiable pour certaines populations ?
tags:
  - sante
  - biais
  - minorites
  - diagnostic
facilitator_note:
  si_silence: "Demandez : si on vous disait que l'IA de diagnostic utilisée dans cet hôpital est moins précise pour votre groupe démographique, est-ce que ça changerait votre confiance envers elle ?"
  si_debat_bloque: "Fait choc : des outils de détection du mélanome entraînés majoritairement sur des peaux claires affichent un taux d'erreur significativement plus élevé sur les peaux foncées. Ces outils sont déployés sans correctif dans des pays à forte diversité."
  si_trop_technique: "Ramenez à la décision concrète : vous êtes directeur d'hôpital. L'outil est performant en moyenne mais moins fiable pour 20% de vos patients. Vous signez ou pas ? Qui décide ?"
  relance_cle: "Un outil médical avec des erreurs systématiques sur des groupes spécifiques — c'est un bug technique ou c'est de la discrimination automatisée ?"
version: "1.0"
