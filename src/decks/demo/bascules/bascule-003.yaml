id: bascule-003
phase: bascule
slot: 1
slot_theme: systeme
chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Envoyer 50 messages ChatGPT = boire une bouteille d'eau."
situation: >
  Les datacenters IA consomment de l'eau pour refroidir leurs serveurs.
  GPT-4 consomme environ 500ml d'eau pour 50 questions. En 2027,
  les datacenters américains pourraient dépasser la consommation en eau
  de certains États.
question: >
  À quel moment la décision d'utiliser une IA pour rédiger un email
  devient-elle une décision environnementale ?
tags: [environnement, eau, energie, datacenter, sobriete]
facilitator_note:
  si_silence: "Demandez au groupe d'estimer son usage IA quotidien en nombre de messages. Puis : 50 échanges = 500ml d'eau. Qu'est-ce que ça représente sur une semaine pour toute la classe ?"
  si_debat_bloque: "Fait choc : en 2027, les datacenters américains pourraient dépasser la consommation en eau de certains États — ce n'est pas une hypothèse, c'est la trajectoire des contrats signés aujourd'hui."
  si_trop_technique: "Arrêtez les comparaisons de chiffres. La vraie question : qui a donné son accord pour que l'usage d'un chatbot soit aussi une décision de gestion de l'eau d'une autre région du monde ?"
  relance_cle: "À quel moment une décision individuelle d'utiliser un outil devient-elle une décision collective sur des ressources partagées ?"
illustration: /images/cards/bascule-003.svg
version: "1.0"
