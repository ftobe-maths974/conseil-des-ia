id: tension-004
phase: tension
slot: 4
slot_theme: individu
chamber: delegation-vs-souverainete
reversibility: green
title: "Le consentement à la délégation est-il éclairé ?"
content: >
  Les utilisateurs acceptent les recommandations IA sans comprendre les critères qui les génèrent. L'asymétrie d'information entre le système et l'utilisateur remet en question la validité du consentement.
question: >
  Peut-on consentir à une délégation dont on ne comprend pas les règles de fonctionnement ?
tags: 
  - consentement
  - asymetrie
  - information
  - autonomie
suggestions_bascule:
  - "Le point de bascule est le moment où l'utilisateur accepte une recommandation IA sans même chercher à la comprendre — quand la délégation est devenue un réflexe automatique, plus un choix."
  - "Le point de bascule est quand la complexité du système rend structurellement impossible un consentement réel — où 'j'accepte' ne signifie plus rien."
version: "1.0"
