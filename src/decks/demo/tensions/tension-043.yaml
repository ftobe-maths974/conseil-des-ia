title: "Ma langue maternelle n'existe pas pour l'IA"
content: >
  Les 7 000 langues vivantes sont représentées très inégalement dans les corpus d'entraînement. Pour un locuteur de breton, de créole guadeloupéen ou de bambara, les outils IA sont fonctionnellement inaccessibles ou fournissent des réponses de qualité très inférieure. La singularité linguistique devient un critère d'exclusion numérique.
data_point: >
  Les 10 langues les plus représentées dans les corpus d'entraînement des LLM couvrent 96 % du total des tokens. Les 6 990 autres langues se partagent 4 %. Pour 2 milliards de locuteurs de langues à faible ressources, la qualité IA est 3 à 8 fois inférieure à celle disponible en anglais (Meta AI Research, 2023).
question: >
  Quand une langue n'est pas dans le standard IA, ses locuteurs sont-ils des citoyens numériques de seconde zone ?
tags:
  - langue
  - inegalites
  - diversite-culturelle
  - acces
suggestions_bascule:
  - "Le point de bascule est le moment où un service public propose une interface IA uniquement en langues majoritaires — quand le numérique reproduit les inégalités linguistiques d'accès aux droits."
  - "Le point de bascule est atteint quand une langue disparaît faute de locuteurs capables de produire des corpus d'entraînement suffisants — quand le standard IA accélère l'extinction culturelle."
version: "1.0"
