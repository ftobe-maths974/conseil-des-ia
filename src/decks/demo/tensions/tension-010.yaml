title: "Les enfants grandissent dans un monde où rien ne prouve rien"
content: >
  La génération qui grandit aujourd'hui est formée à douter de tout document visuel ou sonore. Ce scepticisme généralisé peut produire soit une meilleure pensée critique, soit un nihilisme informationnel.
data_point: >
  Dans une enquête menée auprès d'adolescents de 14-18 ans en Europe (2024), 72 % déclarent 'ne pas faire confiance par défaut' aux vidéos en ligne.
question: >
  Le doute systématique est-il une compétence ou un symptôme ?
tags: 
  - jeunesse
  - confiance
  - scepticisme
  - education
suggestions_bascule:
  - "Le point de bascule est le moment où le scepticisme systématique empêche l'action collective — quand 'on ne peut pas savoir' devient une réponse suffisante face à l'urgence."
  - "Le point de bascule est quand une génération entière renonce à l'idée qu'il peut exister des faits établis — quand le doute n'est plus une méthode mais une posture identitaire qui paralyse."
version: "1.0"
