id: tension-023
phase: tension
slot: 3
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: yellow
title: "La certification crée des oligopoles de confiance"
content: >
  Pour certifier une IA, il faut des ressources, une expertise et un accès aux organismes de certification. Seuls les grands acteurs peuvent se conformer aux exigences. Le standard protège les citoyens mais élimine les alternatives.
data_point: >
  L'AI Act européen impose des coûts de conformité estimés entre 500 000 et 2 millions d'euros pour les IA à 'haut risque'. Une barrière à l'entrée que seules les grandes entreprises peuvent franchir.
question: >
  Un standard rigoureux qui consolide le marché autour de quelques acteurs vaut-il mieux que des systèmes plus divers mais moins sûrs ?
tags: 
  - certification
  - oligopole
  - marche
  - regulation
suggestions_bascule:
  - "Le point de bascule est le moment où les exigences réglementaires de conformité rendent impossible l'entrée de nouveaux acteurs — quand le standard de protection devient un instrument de concentration du marché."
  - "Le point de bascule est quand la régulation, conçue pour protéger les citoyens, élimine la diversité des acteurs qui garantissait une forme de contrepouvoir — quand sécurité et pluralisme deviennent incompatibles."
version: "1.0"
