title: "Ma photo de famille est-elle encore une preuve ?"
content: >
  Les outils de génération d'images et de vidéos deepfake rendent indiscernables les documents authentiques des simulacres. Pour l'individu, les traces de sa propre vie — photos, messages vocaux, vidéos — perdent leur valeur testimoniale. La mémoire personnelle devient contestable.
data_point: >
  En 2024, les tribunaux de 12 pays européens ont refusé des preuves photographiques en l'absence de métadonnées cryptographiques certifiées, selon un rapport du Conseil de l'Europe sur l'authenticité numérique.
question: >
  Quand les souvenirs personnels deviennent falsifiables, comment l'individu peut-il encore témoigner de sa propre vie ?
tags:
  - memoire
  - deepfake
  - preuve
  - identite
suggestions_bascule:
  - "Le point de bascule est le moment où un individu ne peut plus prouver à ses proches qu'une photo est authentique — quand la mémoire familiale exige une certification technique."
  - "Le point de bascule est atteint quand un juge exige une preuve de non-falsification pour tout document numérique — quand l'authenticité par défaut disparaît."
