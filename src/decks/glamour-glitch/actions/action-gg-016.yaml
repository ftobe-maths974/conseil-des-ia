id: action-gg-016
phase: action
slot: 4
lever_type: interdire
chamber: singularite-vs-standard
reversibility: red
scope: systemique
title: "Interdire la standardisation rétroactive du catalogue sans accord des créateurs"
body: >
  OmniStream Studios ne peut appliquer rétroactivement les normes de format FAME-GEN
  à des contenus déjà publiés sans l'accord explicite de chaque créateur concerné.
  Toute modification de métadonnées, de thumbnail, de titre ou de structure d'un
  contenu existant à des fins d'optimisation algorithmique est soumise au consentement
  préalable du créateur, avec droit de refus sans pénalité.
mandat_principe: "Interdire toute modification rétroactive d'une œuvre publiée à des fins d'optimisation algorithmique sans consentement explicite de son auteur."
tags:
  - standardisation-retroactive
  - consentement
  - catalogue
  - droits-auteur
facilitator_note:
  si_silence: "Demandez : un créateur peut refuser la modification rétroactive de son catalogue — mais si les contenus non standardisés sont moins bien distribués par l'algorithme, le refus est-il vraiment sans pénalité, ou le créateur choisit-il entre son intégrité artistique et sa visibilité ?"
  si_debat_bloque: "Poussez sur ce qui compte comme modification : les métadonnées et le thumbnail sont couverts — mais si OmniStream change la façon dont le contenu est indexé ou catégorisé par FAME-GEN sans toucher au contenu lui-même, est-ce que ça entre dans le périmètre de ce mandat ?"
  relance_cle: "Ce mandat pose la question de l'intégrité du catalogue passé : interdire la modification rétroactive protège l'œuvre telle qu'elle a été publiée — mais si le catalogue d'un créateur reste en ligne sans être optimisé, est-ce une protection de son travail ou un abandon progressif aux marges de l'algorithme ?"
version: "1.0"
