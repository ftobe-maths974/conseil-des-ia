id: action-gg-009
phase: action
slot: 1
lever_type: interdire
chamber: preuve-vs-simulation
reversibility: red
scope: systemique
title: "Interdire tout usage d'identité de créateur par FAME-GEN sans consentement traçable"
body: >
  OmniStream Studios est tenu d'obtenir, avant tout entraînement ou usage de FAME-GEN
  sur la voix, le visage, les gestes ou le style d'un créateur identifié, un
  consentement documenté, daté, explicitement borné au périmètre d'usage, et révocable
  à tout moment avec effet sur les nouvelles productions. Aucune clause de cession
  d'actifs antérieure ne peut valoir consentement à l'usage génératif.
mandat_principe: "Interdire tout usage d'identité d'une personne physique dans un système génératif sans clé de consentement traçable, scopée et révocable."
tags:
  - consentement
  - identite
  - clone
  - reversibilite
facilitator_note:
  si_silence: "Demandez : 'révocable à tout moment avec effet sur les nouvelles productions' — si FAME-GEN a été entraîné sur la voix d'un créateur et que ce créateur révoque son consentement, est-ce que le modèle peut vraiment désapprendre ? Ou est-ce que la révocation ne s'applique qu'aux futures utilisations d'un modèle déjà formé ?"
  si_debat_bloque: "Poussez sur 'aucune clause de cession antérieure ne peut valoir consentement' : si des contrats signés il y a cinq ans incluaient des clauses générales de cession de droits numériques — est-ce que ce mandat invalide rétroactivement ces clauses, et qui gère le contentieux contractuel qui en résulte ?"
  relance_cle: "Ce mandat pose la question du consentement comme protection réelle face au clonage : borner le consentement au périmètre d'usage et le rendre révocable est essentiel — mais si un clone vocal ou visuel peut être généré avec un niveau de qualité indiscernable, est-ce que le consentement initial couvre toutes les usages possibles qu'OmniStream n'a pas encore imaginés ?"
version: "1.0"
