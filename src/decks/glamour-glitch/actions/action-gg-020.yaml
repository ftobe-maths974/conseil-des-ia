id: action-gg-020
phase: action
slot: 4
lever_type: auditer
chamber: metabolisme-vs-progres
reversibility: green
scope: organisationnel
title: "Auditer l'empreinte carbone et hydrique de chaque type de contenu produit par FAME-GEN"
body: >
  OmniStream Studios est tenu de produire et publier annuellement une décomposition
  de l'empreinte carbone et hydrique par catégorie de contenu généré par FAME-GEN :
  clips courts, avatars continus, re-génération de catalogue, thumbnails, voix off.
  Ce rapport permet aux créateurs et aux régulateurs d'identifier les usages les
  plus coûteux et d'orienter les politiques de sobriété numérique du studio.
mandat_principe: "Exiger la traçabilité publique de l'empreinte ressource par type d'usage d'un système génératif pour permettre des choix de gouvernance éclairés."
tags:
  - empreinte-carbone
  - audit
  - sobriete
  - reporting
facilitator_note:
  si_silence: "Demandez : pour produire cette décomposition par catégorie, FAME-GEN doit mesurer son propre coût ressource par opération. Si cette instrumentation n'est pas intégrée à l'architecture actuelle, OmniStream peut-il produire ce rapport annuel avec une précision réelle, ou s'agit-il d'estimations agrégées par répartition comptable ?"
  si_debat_bloque: "Poussez sur l'usage du rapport : il permet aux créateurs et aux régulateurs 'd'orienter les politiques de sobriété' — mais si aucune régulation ne fixe de plafond par catégorie, le rapport est une information sans contrainte. Qui peut agir sur la base de ce rapport, et comment ?"
  relance_cle: "Ce mandat pose la question de la granularité comme levier de sobriété : décomposer l'empreinte par type de contenu permet d'identifier les usages les plus coûteux et de prioriser les arbitrages — mais si la catégorie la plus coûteuse est aussi la plus rentable pour OmniStream (avatars continus, re-génération de catalogue), est-ce que la transparence suffit à orienter des décisions de sobriété qui vont à l'encontre des intérêts économiques du studio ?"
version: "1.0"
