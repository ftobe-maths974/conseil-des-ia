lever_type: recours
chamber: preuve-vs-simulation
reversibility: yellow
scope: individuel
title: "Garantir un droit de retrait opposable sur toute identité synthétique en circulation"
body: >
  Toute personne physique dont la voix, le visage ou le style a été intégré dans
  FAME-GEN dispose d'un droit de retrait opposable, exerçable à tout moment,
  entraînant l'arrêt de toute nouvelle production utilisant ces éléments dans
  un délai de 30 jours. OmniStream Studios est tenu de maintenir un registre
  public des identités sous consentement actif, consultable par les intéressés.
mandat_principe: "Garantir à toute personne physique un droit de retrait effectif et opposable sur l'usage de son identité dans tout système génératif."
tags:
  - retrait
  - droits-identite
  - registre
  - consentement
facilitator_note:
  si_silence: "Demandez : 'arrêt de toute nouvelle production dans un délai de 30 jours' — mais les productions générées avant le retrait et déjà diffusées continuent de circuler. Est-ce que le droit de retrait peut s'appliquer aux contenus déjà publiés, ou ne couvre-t-il que les nouvelles générations ?"
  si_debat_bloque: "Poussez sur le registre public des consentements actifs : si ce registre est public et accessible, est-ce qu'il devient aussi une liste publique de créateurs dont l'identité est intégrée dans FAME-GEN — et est-ce que cette publicité est voulue par les créateurs concernés ?"
  relance_cle: "Ce mandat pose la question de la réversibilité technique du retrait : un droit de retrait opposable suppose qu'OmniStream peut arrêter d'utiliser une identité — mais si cette identité a été fusionnée avec d'autres dans un modèle entraîné, isoler et neutraliser la contribution d'une personne spécifique est-il techniquement possible, ou le droit formel dépasse-t-il les capacités techniques actuelles ?"
version: "1.0"
