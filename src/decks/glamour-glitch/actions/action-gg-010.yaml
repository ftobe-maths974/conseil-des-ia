id: action-gg-010
phase: action
slot: 2
lever_type: conditionner
chamber: preuve-vs-simulation
reversibility: yellow
scope: organisationnel
title: "Conditionner toute publication de contenu synthétique à un label d'origine visible"
body: >
  Toute production générée ou substantiellement modifiée par FAME-GEN publiée sur
  OmniStream doit porter un label d'origine lisible, non supprimable par l'utilisateur,
  indiquant la nature synthétique du contenu et l'identité de l'entité responsable
  de sa publication. Ce label doit être interopérable avec les standards de traçabilité
  des contenus synthétiques reconnus par les régulateurs.
mandat_principe: "Conditionner toute diffusion de contenu synthétique à la présence d'un marqueur d'origine visible, non falsifiable et standardisé."
tags:
  - labellisation
  - authenticite
  - transparence
  - traçabilite
facilitator_note:
  si_silence: "Demandez : 'substantiellement modifié par FAME-GEN' — si un créateur écrit un texte, FAME-GEN en reformule 40%, et le créateur valide la version finale, est-ce que le contenu est 'substantiellement modifié' ? Qui décide du seuil de modification qui déclenche le label ?"
  si_debat_bloque: "Poussez sur l'interopérabilité avec les régulateurs : si les standards de traçabilité ne sont pas encore adoptés par tous les régulateurs, OmniStream peut se conformer aux standards d'un pays et pas d'un autre. Est-ce que le mandat crée une conformité internationale ou une conformité minimale ?"
  relance_cle: "Ce mandat pose la question de l'efficacité du label sur le comportement des audiences : rendre l'origine synthétique visible est une condition de transparence nécessaire — mais si les études montrent que les publics préfèrent consciemment les contenus synthétiques bien produits aux contenus humains moins polis, le label protège-t-il les créateurs ou accélère-t-il leur remplacement ?"
version: "1.0"
