id: action-gg-003
phase: action
slot: 3
lever_type: auditer
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Auditer annuellement la part de contenu humain dans la production OmniStream"
body: >
  OmniStream Studios est tenu de publier chaque année un rapport d'audit indépendant
  mesurant la proportion de contenu créé, validé ou modifié par un humain identifié,
  par catégorie de créateur. Ce rapport inclut le taux de publications purement
  automatiques, les catégories concernées et l'évolution sur trois ans.
  L'auditeur est désigné par un comité externe indépendant du studio.
mandat_principe: "Exiger la transparence publique et vérifiable sur la proportion de création humaine effective dans toute plateforme de production automatisée."
tags:
  - audit
  - transparence
  - creation-humaine
  - reporting
facilitator_note:
  si_silence: "Demandez : qu'est-ce qui compte comme 'contenu modifié par un humain' — si un créateur change un mot dans un texte généré par FAME-GEN, est-ce que ça passe dans la catégorie 'humain' ? Comment l'auditeur trace la frontière ?"
  si_debat_bloque: "Poussez sur les catégories de créateurs : l'audit mesure la proportion par catégorie. Si les créateurs les plus petits sont massivement automatisés et les plus grands relativement humains, est-ce que les chiffres globaux reflètent la réalité vécue par la majorité des créateurs de la plateforme ?"
  relance_cle: "Ce mandat pose la question de la transparence comme levier : publier la part de contenu humain dans un audit annuel, c'est rendre le glissement visible — mais si le rapport montre une automatisation croissante et que ni OmniStream ni les créateurs ne changent leurs pratiques, la transparence suffit-elle à inverser la tendance ?"
version: "1.0"
