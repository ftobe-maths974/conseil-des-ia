lever_type: interdire
chamber: metabolisme-vs-progres
reversibility: red
scope: systemique
title: "Interdire l'implantation de data centers FAME-GEN dans des zones en stress hydrique"
body: >
  OmniStream Studios est tenu de soumettre tout nouveau projet de data center
  alimentant FAME-GEN à une étude d'impact hydrique indépendante. Toute installation
  dans une zone identifiée en stress hydrique modéré à sévère selon les indices
  internationaux est interdite sans dérogation formelle motivée et approuvée par
  un comité d'experts environnementaux. Les installations existantes en zone critique
  sont soumises à un plan de sortie dans un délai de 36 mois.
mandat_principe: "Interdire l'implantation d'infrastructures de production numérique intensive dans des zones dont les ressources hydriques ou énergétiques ne peuvent absorber la charge."
tags:
  - eau
  - data-center
  - impact-environnemental
  - zone-critique
facilitator_note:
  si_silence: "Demandez : OmniStream ne possède pas forcément ses data centers — elle les loue à des hébergeurs tiers. Si c'est l'hébergeur qui implante le data center en zone de stress hydrique et qu'OmniStream est client, est-ce que ce mandat s'applique à OmniStream, ou seulement aux opérateurs d'infrastructure ?"
  si_debat_bloque: "Poussez sur le plan de sortie en 36 mois pour les installations existantes : déménager un data center est une opération coûteuse et techniquement complexe. Si le plan de sortie n'est pas exécuté dans les délais, qui applique la sanction et avec quelles conséquences pour la continuité de service de FAME-GEN ?"
  relance_cle: "Ce mandat pose la question de la localisation comme enjeu de gouvernance : interdire les data centers dans les zones en stress hydrique est une protection environnementale locale concrète — mais si cette interdiction pousse OmniStream à implanter ses infrastructures dans des zones moins réglementées, est-ce une solution ou un déplacement du problème ?"
version: "1.0"
