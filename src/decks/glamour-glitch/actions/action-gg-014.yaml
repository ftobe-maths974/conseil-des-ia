id: action-gg-014
phase: action
slot: 2
lever_type: conditionner
chamber: singularite-vs-standard
reversibility: green
scope: organisationnel
title: "Conditionner tout standard de format à une clause d'exception documentée"
body: >
  Toute norme de production imposée ou fortement incitée par FAME-GEN sur OmniStream
  doit être accompagnée d'une procédure d'exception formelle, permettant à un créateur
  de demander une exemption motivée avec maintien de la visibilité de base. OmniStream
  est tenu de traiter les demandes d'exception dans un délai de 14 jours et de publier
  le taux d'acceptation par catégorie de créateur.
mandat_principe: "Conditionner tout standard de production automatisée à l'existence d'une voie d'exception accessible, motivée et non sanctionnante."
tags:
  - standard
  - exception
  - format
  - visibilite
facilitator_note:
  si_silence: "Demandez : 'maintien de la visibilité de base' — si un créateur demande une exemption de format et qu'OmniStream la lui accorde, mais que FAME-GEN optimise la distribution pour les contenus conformes au standard, est-ce que la visibilité 'de base' est équivalente à celle d'un créateur conforme, ou structurellement inférieure ?"
  si_debat_bloque: "Poussez sur la publication du taux d'acceptation par catégorie : si le taux d'exemption est très bas pour certaines catégories de créateurs, ça révèle une inégalité — mais est-ce qu'OmniStream est tenu d'en expliquer les raisons ou seulement de publier le chiffre ?"
  relance_cle: "Ce mandat pose la question de l'exception comme soupape ou comme droit réel : créer une voie d'exception documentée est une protection contre l'uniformisation — mais si le taux d'acceptation est faible, si les délais sont longs et si la visibilité de base reste inférieure au standard, l'exception est-elle une voie réelle ou une procédure symbolique ?"
version: "1.0"
