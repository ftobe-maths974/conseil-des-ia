id: action-gg-001
phase: action
slot: 1
lever_type: interdire
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Interdire toute publication sous identité de créateur sans validation explicite"
body: >
  OmniStream Studios est tenu d'obtenir, pour chaque contenu généré par FAME-GEN
  publié sous le nom ou l'image d'un créateur identifié, une validation active et
  horodatée de ce créateur. Le silence, l'inaction ou l'absence de réponse dans
  un délai imparti ne peuvent valoir consentement. Toute publication en violation
  de cette règle engage la responsabilité civile d'OmniStream.
mandat_principe: "Interdire toute publication sous identité humaine sans acte de consentement explicite, traçable et révocable."
tags:
  - consentement
  - pipeline
  - delegation
  - publication
facilitator_note:
  si_silence: "Demandez : 'validation active et horodatée' — si un créateur valide un template de contenu hebdomadaire, est-ce que cette validation couvre toutes les publications de la semaine, ou chacune individuellement ? Où s'arrête l'acte de consentement ?"
  si_debat_bloque: "Poussez sur la responsabilité civile d'OmniStream : si OmniStream est responsable de chaque publication non validée et que les créateurs avec lesquels ils travaillent sont des milliers, est-ce que ce mandat pousse OmniStream à réduire le nombre de créateurs partenaires plutôt qu'à améliorer sa chaîne de validation ?"
  relance_cle: "Ce mandat pose la question du consentement dans une relation de dépendance économique : interdire que le silence vaille consentement est une protection essentielle — mais si un créateur dépend économiquement d'OmniStream, jusqu'où peut-il vraiment refuser de valider sans risquer sa place sur la plateforme ?"
version: "1.0"
