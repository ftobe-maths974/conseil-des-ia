id: action-gg-002
phase: action
slot: 2
lever_type: conditionner
chamber: delegation-vs-souverainete
reversibility: yellow
scope: organisationnel
title: "Conditionner tout contrat de pipeline IA à une clause de reprise de contrôle"
body: >
  Tout contrat entre OmniStream Studios et un créateur intégrant une clause de
  pipeline automatique FAME-GEN doit inclure une procédure de reprise de contrôle
  activable unilatéralement par le créateur dans un délai maximal de 48 heures,
  sans pénalité financière ni réduction de visibilité pendant une période probatoire
  de 30 jours. OmniStream est tenu de documenter l'effectivité de cette procédure.
mandat_principe: "Garantir à tout créateur sous contrat d'automatisation le droit de reprendre le contrôle de sa production sans sanction."
tags:
  - contrat
  - reprise-controle
  - pipeline
  - autonomie
facilitator_note:
  si_silence: "Demandez : 'sans réduction de visibilité pendant 30 jours' — OmniStream contrôle l'algorithme de recommandation. Si un créateur reprend le contrôle de son pipeline et que sa cadence de publication baisse, comment OmniStream peut-il s'engager à ne pas ajuster la visibilité, même automatiquement ?"
  si_debat_bloque: "Poussez sur 'documenter l'effectivité' : OmniStream doit documenter que la procédure de reprise fonctionne — mais c'est OmniStream lui-même qui documente. Qui vérifie que cette documentation est honnête, et que le créateur qui a repris le contrôle n'a pas subi de pénalités invisibles ?"
  relance_cle: "Ce mandat pose la question de l'autonomie contractuelle réelle : garantir le droit de reprendre le contrôle sans pénalité visible, c'est une protection — mais si la plateforme peut moduler la recommandation, la monétisation ou la distribution sans l'inscrire explicitement comme pénalité, le droit de reprise protège-t-il vraiment contre les représailles invisibles ?"
version: "1.0"
