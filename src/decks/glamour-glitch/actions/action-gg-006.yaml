id: action-gg-006
phase: action
slot: 2
lever_type: recours
chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: individuel
title: "Garantir un droit de recours opposable contre toute restriction de visibilité"
body: >
  Tout créateur dont la visibilité est restreinte, déclassée ou supprimée par
  FAME-GEN a le droit d'obtenir une réponse écrite motivée dans un délai de
  7 jours ouvrés, identifiant la règle déclenchée et les éléments factuels
  retenus. OmniStream Studios est tenu de maintenir une voie de recours humaine
  indépendante de l'équipe ayant appliqué la restriction.
mandat_principe: "Garantir un droit opposable à l'explication motivée et à la contestation pour toute décision algorithmique affectant la visibilité ou les revenus d'un créateur."
tags:
  - recours
  - visibilite
  - explication
  - droits
facilitator_note:
  si_silence: "Demandez : 'identifiant la règle déclenchée et les éléments factuels retenus' — si FAME-GEN a restreint la visibilité d'un contenu en raison d'une combinaison de signaux comportementaux sans règle explicite déclenchée, qu'est-ce qu'OmniStream écrit dans sa réponse motivée ?"
  si_debat_bloque: "Poussez sur l'indépendance de la voie de recours : la voie humaine doit être indépendante de l'équipe ayant appliqué la restriction — mais si l'équipe de recours travaille pour OmniStream, quelle est sa marge réelle de désaccord avec une décision de la plateforme ?"
  relance_cle: "Ce mandat pose la question de l'effectivité du recours dans une relation asymétrique : un droit de recours en 7 jours avec réponse motivée, c'est un progrès réel — mais si le créateur qui conteste risque d'être vu comme problématique par l'algorithme de recommandation, est-ce que le droit formel est compatible avec l'exercice réel ?"
version: "1.0"
