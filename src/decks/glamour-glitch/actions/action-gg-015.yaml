id: action-gg-015
phase: action
slot: 3
lever_type: limiter
chamber: singularite-vs-standard
reversibility: yellow
scope: systemique
title: "Plafonner la part de contenu généré par FAME-GEN dans les recommandations"
body: >
  Dans le flux de recommandations OmniStream, le contenu généré intégralement par
  FAME-GEN sans validation humaine identifiable ne peut dépasser 30% des contenus
  recommandés à un utilisateur donné sur une période de 7 jours glissants. Ce
  plafond est vérifié mensuellement par un audit automatisé dont les résultats
  sont publiés par catégorie de créateur et de contenu.
mandat_principe: "Plafonner la présence algorithmique de contenu synthétique dans les flux de découverte pour préserver l'espace de création humaine visible."
tags:
  - plafond
  - recommandation
  - diversite
  - flux
facilitator_note:
  si_silence: "Demandez : le plafond de 30% s'applique par utilisateur sur 7 jours glissants — mais si FAME-GEN génère du contenu attribué à des créateurs humains qui l'ont validé, est-ce que ce contenu entre dans les 30% ou dans les 70% 'humains' ?"
  si_debat_bloque: "Poussez sur l'audit automatisé mensuel : l'audit est automatisé et produit par OmniStream sur ses propres données. Qui vérifie que l'audit lui-même est correct, et que le calcul du 30% utilise la même définition de 'contenu généré' que le mandat ?"
  relance_cle: "Ce mandat pose la question du plafond comme protection de la diversité : limiter le contenu synthétique à 30% des recommandations préserve un espace pour la création humaine — mais si le contenu synthétique est structurellement plus engageant (plus poli, plus régulier, mieux ciblé), est-ce que le plafond protège les créateurs humains ou préserve artificiellemnt un espace qu'ils ont du mal à occuper ?"
version: "1.0"
