id: action-gg-005
phase: action
slot: 1
lever_type: auditer
chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: systemique
title: "Auditer les critères de démonétisation appliqués par FAME-GEN"
body: >
  OmniStream Studios est tenu de publier annuellement un rapport d'audit indépendant
  sur les critères effectifs de déclassement, démonétisation et suppression de contenu
  appliqués par FAME-GEN, incluant les taux d'erreur par catégorie de créateurs,
  les biais identifiés par sous-groupe et les voies de recours disponibles.
  L'audit est conduit par un tiers agréé désigné hors de la chaîne hiérarchique
  du studio.
mandat_principe: "Garantir la lisibilité et la contestabilité publique des critères de classement et de sanction algorithmique appliqués à toute identité de créateur."
tags:
  - audit
  - demonetisation
  - transparence
  - biais
facilitator_note:
  si_silence: "Demandez : 'taux d'erreur par catégorie de créateurs' — pour qu'un audit mesure un taux d'erreur, il faut une définition de ce qu'est une décision correcte. Qui définit qu'une démonétisation était une erreur, si ce n'est pas OmniStream lui-même qui fournit le standard de référence ?"
  si_debat_bloque: "Poussez sur les biais par sous-groupe : si l'audit identifie un biais systématique contre certains types de créateurs — contenus militants, minoritaires, alternatifs — est-ce qu'OmniStream est tenu de corriger l'algorithme, ou seulement de publier le constat ?"
  relance_cle: "Ce mandat pose la question de l'audit comme outil de contestabilité : rendre les critères de démonétisation visibles permet de les contester — mais si les critères effectifs de FAME-GEN sont emergents et non programmés explicitement, est-ce qu'un audit peut les rendre lisibles, ou décrit-il seulement les effets sans exposer les causes ?"
version: "1.0"
