id: action-gg-007
phase: action
slot: 3
lever_type: interdire
chamber: invisibilite-vs-arbitrage
reversibility: red
scope: systemique
title: "Interdire les restrictions de visibilité sans notification préalable au créateur"
body: >
  OmniStream Studios est tenu de notifier tout créateur dans les 24 heures précédant
  ou suivant toute modification substantielle de sa visibilité algorithmique appliquée
  par FAME-GEN. Toute restriction silencieuse non notifiée dans ce délai est réputée
  nulle et donne droit à une compensation automatique calculée sur la perte de revenus
  estimée. L'absence de notification ne peut être invoquée comme défense contractuelle.
mandat_principe: "Interdire toute sanction ou restriction algorithmique appliquée sans notification explicite et tracée à la personne affectée."
tags:
  - notification
  - shadowban
  - restriction
  - transparence
facilitator_note:
  si_silence: "Demandez : 'modification substantielle' — comment OmniStream définit-il le seuil à partir duquel une baisse de visibilité est substantielle ? Si la visibilité baisse de 5%, de 20%, de 50% — où est la frontière qui déclenche l'obligation de notification ?"
  si_debat_bloque: "Poussez sur la compensation automatique : la perte de revenus estimée — estimée par qui, sur quelle base ? Si FAME-GEN est aussi l'outil qui calcule les revenus potentiels, OmniStream est juge et partie dans le calcul de la compensation qu'il doit ?"
  relance_cle: "Ce mandat pose la question de la visibilité comme droit opposable : interdire le shadowban silencieux est une protection forte — mais si OmniStream peut réduire la visibilité à condition de notifier, est-ce que la notification transforme une pratique opaque en pratique acceptable, ou est-ce que la restriction reste injuste même quand elle est annoncée ?"
version: "1.0"
