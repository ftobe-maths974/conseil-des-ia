title: "La voix qu'on n'a plus le droit de reconnaître"
content: >
  Un fan écoute un podcast OmniStream et reconnaît la voix de son acteur préféré,
  décédé deux ans plus tôt. La biographie publiée dit "voix synthétique inspirée".
  Il ne sait pas si c'est une reconstitution fidèle, une approximation, ou une
  fabrication complète. Il ne sait pas non plus si l'acteur avait consenti à cet
  usage posthume. Pour lui, l'écoute est une expérience authentique. Pour les
  ayants droit, c'est une exploitation commerciale. Pour les producteurs, c'est
  de la créativité technologique. Trois lectures légitimes du même objet sonore.
question: >
  L'expérience subjective d'authenticité d'un auditeur est-elle suffisante
  pour légitimer une identité synthétique — ou le consentement du modèle
  prime-t-il sur le ressenti du public ?
tags:
  - authenticite-subjective
  - posthume
  - consentement
  - fan
facilitator_note:
  si_silence: "Demandez : si vous appreniez que la voix que vous venez d'écouter est synthétique et que l'acteur n'avait pas consenti, est-ce que cela transforme rétrospectivement votre expérience d'écoute ?"
  si_debat_bloque: "Déplacez vers les ayants droit : peuvent-ils donner ou refuser le consentement à la place d'une personne décédée — et sur quelle légitimité se fondent-ils pour le faire ?"
  relance_cle: "La vraie question : le plaisir subjectif d'un auditeur peut-il légitimer l'usage d'une identité dont le propriétaire ne peut plus se défendre ?"
version: "1.0"
