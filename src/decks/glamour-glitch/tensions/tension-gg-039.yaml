title: "Le GPU qui tourne pour des clips qui ne seront jamais vus"
content: >
  FAME-GEN produit en continu des contenus pour les créateurs actifs et des
  "tests de performance" à grande échelle. Une part significative des inférences
  FAME-GEN alimente des contenus A/B testés qui ne seront jamais publiés,
  des variations abandonnées, des thumbnails non sélectionnés. La consommation
  ressource n'est pas proportionnelle au contenu diffusé : elle est proportionnelle
  aux essais, aux tests, aux options non retenues. Le gaspillage est invisible
  dans les métriques de performance — et non mesuré dans les bilans de soutenabilité.
question: >
  Doit-on inclure dans le bilan ressource d'un système génératif le coût
  des contenus produits mais non publiés — tests, variantes, ébauches —
  ou seulement les contenus effectivement diffusés ?
tags:
  - gaspillage
  - inférence
  - bilan-ressource
  - production-invisible
facilitator_note:
  si_silence: "Demandez : si OmniStream produit des milliers de clips A/B testés qui ne seront jamais publiés pour optimiser les performances, est-ce que cette consommation ressource doit apparaître dans leur bilan environnemental — ou est-ce un coût de fonctionnement interne invisible ?"
  si_debat_bloque: "Poussez sur la définition du périmètre : si le bilan ressource n'inclut que les contenus diffusés, OmniStream peut améliorer ses métriques en augmentant les tests sans impact apparent. Qui décide quoi compter — et peut-on faire confiance à OmniStream pour définir son propre périmètre de comptabilité ?"
  relance_cle: "La vraie question n'est pas si les tests sont nécessaires — c'est si un bilan de soutenabilité qui exclut la production non publiée mesure vraiment l'impact réel du système ou seulement la partie que l'entreprise choisit de rendre visible."
version: "1.0"
