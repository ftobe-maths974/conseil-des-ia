title: "La chaîne de consentement qui s'est perdue dans le rachat"
content: >
  Lors d'un rachat, OmniStream a acquis les archives de sessions d'enregistrement
  de 18 petits studios. Les contrats de cession incluaient les "actifs de production".
  OmniStream interprète cela comme incluant les données vocales. Les artistes
  concernés n'ont jamais consenti à l'usage génératif — ils avaient consenti à
  la diffusion. La chaîne de consentement n'est pas falsifiée : elle n'a simplement
  jamais anticipé ce type d'usage. Le problème n'est pas la mauvaise foi d'OmniStream ;
  c'est que les instruments juridiques du consentement n'ont pas été conçus pour
  l'ère des modèles génératifs.
question: >
  Un consentement contractuel valide à l'époque de sa signature mais dont l'objet
  était techniquement impossible au moment de la signature peut-il couvrir des
  usages génératifs apparus ultérieurement ?
