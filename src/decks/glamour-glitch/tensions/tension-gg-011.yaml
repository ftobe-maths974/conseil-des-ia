title: "Le recours qui existe mais ne fonctionne pas"
content: >
  OmniStream Studios offre un portail de recours à ses créateurs. En théorie,
  tout créateur peut contester une décision de restriction. En pratique, le délai
  moyen de réponse est de 23 jours, la majorité des réponses sont génériques,
  et le taux de révision favorable est de 4,7% selon un audit indépendant.
  Le recours existe — ce qui permet à OmniStream de dire qu'il respecte les
  principes de procédure équitable. Mais un recours qui ne fonctionne pas
  est-il encore un recours, ou est-il une façade de légitimité ?
question: >
  Un mécanisme de recours formel mais inefficace en pratique suffit-il
  à légitimer les décisions algorithmiques qu'il est censé encadrer ?
tags:
  - recours
  - efficacite
  - legitimite
  - droits
facilitator_note:
  si_silence: "Demandez : avec un délai de 23 jours et 4,7% de révisions favorables, est-ce qu'un créateur rationnel va utiliser ce recours ou apprendre à s'en passer ?"
  si_debat_bloque: "Déplacez vers le régulateur : à quel seuil d'efficacité un mécanisme de recours cesse-t-il d'être un recours et devient-il une façade de conformité réglementaire ?"
  relance_cle: "La vraie question : un recours qui existe sur le papier mais que personne n'utilise parce qu'il ne fonctionne pas protège qui — le créateur ou la plateforme ?"
version: "1.0"
