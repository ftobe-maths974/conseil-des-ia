title: "Le pipeline qui aide les petits à exister"
content: >
  Pour un petit créateur sans moyens, FAME-GEN change la donne : produire des
  contenus de qualité professionnelle sans équipe, sans budget post-production,
  sans studio d'enregistrement. Des créateurs de pays à faible revenus accèdent
  pour la première fois à des standards de production que seuls les grands studios
  pouvaient s'offrir. La délégation à FAME-GEN n'est pas une perte pour eux —
  c'est une entrée dans un marché qui leur était fermé. La question est donc
  asymétrique : la délégation appauvrit certains, enrichit d'autres selon leur
  position de départ dans l'industrie.
question: >
  Peut-on s'opposer à la délégation créative à FAME-GEN sans ignorer qu'elle
  offre à certains créateurs un accès à un marché qui leur était structurellement
  interdit ?
tags:
  - acces
  - inegalites
  - petits-createurs
  - democratisation
facilitator_note:
  si_silence: "Demandez : ce créateur sans moyens qui accède grâce à FAME-GEN — dans cinq ans, sera-t-il plus libre ou plus dépendant d'OmniStream qu'aujourd'hui ?"
  si_debat_bloque: "Retournez vers les créateurs établis : ont-ils intérêt à ce que FAME-GEN reste inaccessible aux petits — et est-ce qu'ils l'admettent ?"
  relance_cle: "La vraie question : l'accès à un marché via un outil propriétaire d'un acteur dominant est-il une forme de démocratisation ou une nouvelle forme de dépendance ?"
version: "1.0"
