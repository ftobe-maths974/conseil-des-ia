title: "Le label 'synthétique' qui détruit la performance"
content: >
  OmniStream impose que tout contenu voix générée par FAME-GEN soit labellisé
  "Voix Synthétique" dans les métadonnées. Un doubleur affirme que ce label
  dévalue systématiquement les performances humaines — les utilisateurs supposant
  désormais que tout contenu vocal peut être synthétique. Une actrice répond
  que sans ce label, elle ne peut pas prouver que sa performance est humaine.
  Le label protège l'authenticité mais crée une catégorie de suspicion.
  L'absence de label protège l'expérience mais efface la distinction.
question: >
  Le marquage obligatoire des contenus synthétiques protège-t-il l'authenticité
  humaine ou crée-t-il une présomption de synthèse qui dévalorise toute performance ?
tags:
  - label
  - authenticite
  - devaluation
  - performance
facilitator_note:
  si_silence: "Demandez : si demain toute musique pouvait être synthétique, comment sauriez-vous encore qu'une performance humaine mérite votre attention différemment ?"
  si_debat_bloque: "Retournez vers le public : est-ce que les auditeurs ont le droit de savoir — ou est-ce que l'expérience vécue importe plus que la nature de ce qui la produit ?"
  relance_cle: "La vraie question : le label 'synthétique' protège-t-il les humains ou génère-t-il une suspicion généralisée qui finit par effacer toute distinction ?"
version: "1.0"
