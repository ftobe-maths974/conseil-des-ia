id: tension-gg-033
phase: tension
slot: 6
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: green
title: "L'interopérabilité qui permet l'accès mais brise l'identité"
content: >
  OmniStream impose des standards techniques d'interopérabilité à tous ses partenaires :
  formats de fichiers, métadonnées, structures de contenu compatibles avec FAME-GEN.
  Ces standards permettent aux petits créateurs de distribuer leur contenu sur
  de multiples plateformes simultanément — une forme réelle d'équité d'accès.
  Mais ils imposent aussi une structure de création qui efface les particularités
  techniques et stylistiques qui faisaient l'identité de certains formats artisanaux.
  L'interopérabilité libère la distribution mais contraint la création.
question: >
  Les standards d'interopérabilité d'OmniStream servent-ils l'équité d'accès
  ou imposent-ils une normalisation technique qui efface les singularités
  de création non-conformes ?
tags:
  - interoperabilite
  - standard-technique
  - identite-format
  - acces
facilitator_note:
  si_silence: "Demandez : si vous pouvez diffuser votre contenu sur 20 plateformes simultanément grâce à un format standard imposé, mais que ce format vous force à abandonner les particularités techniques qui définissaient votre style, avez-vous gagné quelque chose ou perdu quelque chose ?"
  si_debat_bloque: "Poussez sur la nature de la contrainte : si les standards d'interopérabilité permettent la distribution mais contraignent la création, est-ce que la liberté de distribution compense la perte de liberté créative — et pour qui cette équation est-elle acceptable ?"
  relance_cle: "La vraie question n'est pas si l'interopérabilité est utile — c'est si un accès conditionné à la conformité technique est encore un accès libre, ou une forme d'adhésion forcée à un moule que quelqu'un d'autre a défini."
version: "1.0"
