title: "La certification qui exclut ceux qui ne peuvent pas payer pour la preuve"
content: >
  OmniStream Studios met en place un système de certification "Identité Originale Vérifiée"
  pour les créateurs. Le processus implique un audit biométrique, une chaîne de
  signature documentaire et une accréditation technique. Le coût est de 800€ par
  créateur. Pour les grands studios, c'est négligeable. Pour les indépendants,
  c'est une barrière. Le système de preuve protège théoriquement tout le monde —
  mais en pratique, il protège ceux qui ont les moyens de payer pour leur propre
  certification.
question: >
  Un système de certification de l'authenticité qui impose un coût d'accès
  crée-t-il une protection à deux vitesses — les authentifiés et les non-certifiés
  présumés synthétiques ?
tags:
  - certification
  - couts
  - inegalite
  - acces
facilitator_note:
  si_silence: "Demandez : si protéger votre identité artistique en ligne coûte 800€ de certification, et que vous êtes un créateur indépendant avec un revenu précaire, est-ce que ce système vous protège — ou est-ce qu'il protège ceux qui ont les moyens de payer ?"
  si_debat_bloque: "Poussez sur la présomption : si les créateurs non-certifiés sont implicitement considérés comme potentiellement synthétiques par le système, est-ce une présomption d'authenticité inversée — et quelle en est la conséquence pour leur visibilité ?"
  relance_cle: "La vraie question n'est pas si la certification est techniquement solide — c'est si un système de preuve dont le coût d'accès exclut les plus précaires peut encore s'appeler un système de protection."
