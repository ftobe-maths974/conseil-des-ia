title: "La responsabilité sans auteur identifiable"
content: >
  Un contenu produit par FAME-GEN, publié sous le nom d'un créateur, déclenche
  une polémique. Le créateur dit qu'il ne l'a pas fait. OmniStream dit qu'il
  a consenti au pipeline. La plateforme dit que le contenu respecte les règles.
  Personne n'est clairement responsable. Ce n'est pas un bug du système —
  c'est une caractéristique structurelle : quand la délégation est totale,
  la chaîne de responsabilité se dissout. Le droit civil n'a pas encore de
  réponse claire à cette situation, et les contrats d'OmniStream ont été conçus
  pour la minimiser, pas pour la résoudre.
question: >
  Quand un contenu généré par FAME-GEN cause un préjudice, comment attribue-t-on
  la responsabilité quand le créateur, la plateforme et le modèle sont tous
  impliqués mais personne ne décide seul ?
tags:
  - responsabilite
  - auteur
  - droit
  - delegation-totale
facilitator_note:
  si_silence: "Demandez : si vous étiez le créateur dont le nom est en bas de ce contenu problématique, qu'est-ce que vous répondriez à un journaliste qui vous demande d'en assumer la responsabilité ?"
  si_debat_bloque: "Déplacez vers le législateur : le droit civil prévoit-il des réponses à cette dissolution de responsabilité — ou faut-il créer de nouveaux régimes de responsabilité pour les systèmes IA ?"
  relance_cle: "La vraie question : quand personne ne décide seul, peut-il encore y avoir quelqu'un de responsable — ou la délégation totale est-elle structurellement conçue pour éviter la sanction ?"
version: "1.0"
