title: "Le shadowban comme outil de politique éditoriale inavouable"
content: >
  FAME-GEN peut réduire discrètement la visibilité d'un contenu ou d'un créateur
  sans le désactiver, sans le supprimer, sans envoyer de notification.
  La restriction silencieuse permet à OmniStream d'exercer une politique
  éditoriale sans en assumer la responsabilité publique. Si elle est identifiée,
  OmniStream peut nier ou invoquer un bug algorithmique. L'outil est techniquement
  pratique et politiquement commode — ce qui en fait une tentation permanente
  pour toute organisation qui veut moduler sa politique sans la rendre contestable.
question: >
  La restriction silencieuse de visibilité est-elle une pratique de gestion
  opérationnelle acceptable ou un outil de censure déguisée — et la différence
  tient-elle à l'intention ou à l'effet ?
tags:
  - shadowban
  - censure
  - responsabilite
  - politique-editoriale
facilitator_note:
  si_silence: "Demandez : si OmniStream peut toujours invoquer un bug algorithmique quand un shadowban est identifié, comment un créateur peut-il jamais prouver que la restriction était intentionnelle ?"
  si_debat_bloque: "Changez d'angle vers l'effet : si le résultat d'une restriction silencieuse et d'une suppression de compte est identique pour le créateur affecté, est-ce que l'intention d'OmniStream change quelque chose à l'injustice subie ?"
  relance_cle: "La vraie question : un outil de politique éditoriale qui ne peut pas être contesté parce qu'il ne peut pas être prouvé est-il un outil de gestion ou un outil de pouvoir ?"
version: "1.0"
