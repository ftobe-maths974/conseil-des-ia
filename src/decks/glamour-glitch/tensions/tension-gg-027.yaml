title: "Le faux déclaré qui enrichit la culture"
content: >
  FAME-GEN permet de produire des parodies, des hommages, des œuvres fictionnelles
  clairement déclarées comme telles : une pièce de théâtre où un personnage historique
  répond à des questions contemporaines, une satire avec une voix synthétique
  explicitement identifiée. Ces usages sont légalement et éthiquement distincts
  de la tromperie. Mais OmniStream ne dispose pas de mécanisme robuste pour distinguer
  automatiquement le faux assumé du faux trompeur à grande échelle. Une règle
  absolue contre toute simulation identitaire interdirait des usages culturels
  précieux ; pas de règle du tout expose à la tromperie industrielle.
question: >
  Comment distinguer institutionnellement le faux assumé culturellement légitime
  du faux trompeur dans un système génératif à grande échelle — sans sacrifier
  l'un pour contrôler l'autre ?
tags:
  - fiction
  - satire
  - usage-legitime
  - distinction
facilitator_note:
  si_silence: "Demandez : si quelqu'un produit avec FAME-GEN une pièce de théâtre satirique où un politicien dit des choses absurdes avec une voix synthétique clairement identifiée, est-ce que c'est du même ordre qu'une deepfake destinée à tromper — et comment le système sait-il faire la différence ?"
  si_debat_bloque: "Poussez sur la limite technique : si OmniStream ne peut pas distinguer automatiquement le faux assumé du faux trompeur à grande échelle, la seule règle possible est soit 'tout interdire' soit 'tout autoriser'. Quelle est la moins mauvaise option — et pour qui ?"
  relance_cle: "La vraie question n'est pas si la satire est légitime — c'est si une plateforme à grande échelle peut construire une distinction institutionnelle solide entre usage culturel du faux et tromperie, sans que cette distinction soit contournée en masse."
