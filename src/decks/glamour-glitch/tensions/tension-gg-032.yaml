phase: tension
slot: 5
slot_theme: organisation
chamber: singularite-vs-standard
reversibility: red
title: "La diversité de façade dans un catalogue homogène"
content: >
  OmniStream affiche 200 catégories de contenus dans son catalogue. Mais une
  analyse de la distribution réelle de la visibilité montre que 80% des vues
  se concentrent sur des contenus FOF dans cinq catégories dominant.
  Les 195 autres catégories existent nominalement mais sont invisibles
  algorithmiquement. OmniStream communique sur sa "diversité de catalogue"
  — ce qui est vrai en termes de volume de titres, faux en termes de visibilité
  réelle. La diversité nominale masque la concentration réelle.
question: >
  Un catalogue diversifié en volume mais homogène en visibilité algorithmique
  peut-il être présenté comme un engagement sincère envers la diversité culturelle ?
tags:
  - diversite-nominale
  - visibilite
  - catalogue
  - concentration
facilitator_note:
  si_silence: "Demandez : si OmniStream a 200 catégories dans son catalogue mais que 80 % des vues se concentrent sur 5 catégories, est-ce que la communication sur 'la diversité du catalogue' est honnête — ou est-ce du greenwashing culturel ?"
  si_debat_bloque: "Poussez sur la distinction entre volume et visibilité : si la diversité n'est mesurée qu'en nombre de titres disponibles et non en parts d'écoute, quel indicateur OmniStream devrait-il publier pour qu'on puisse évaluer son engagement réel envers la diversité ?"
  relance_cle: "La vraie question n'est pas si OmniStream ment sur sa diversité — c'est si un acteur peut se dire engagé pour la diversité culturelle en mesurant cet engagement par des métriques qui lui permettent toujours de dire qu'il la respecte."
version: "1.0"
