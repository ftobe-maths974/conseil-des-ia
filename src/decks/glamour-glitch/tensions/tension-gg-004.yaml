title: "Le studio qui sous-traite sa vision"
content: >
  OmniStream Studios utilise FAME-GEN pour produire 80% de ses contenus mid-tier.
  L'équipe créative interne est réduite à 15 personnes qui définissent des "briefs
  stratégiques" que FAME-GEN exécute. La question qui émerge : est-ce qu'OmniStream
  fait encore de la production ou de la curation ? L'organisation conserve-t-elle
  une identité créative propre quand ses décisions créatives sont réduites à des
  paramètres d'entrée pour un modèle ? La valeur ajoutée organisationnelle se
  déplace — mais vers quoi ? Vers l'ingénierie de prompt, vers le goût éditorial,
  ou simplement vers l'accès au modèle ?
question: >
  Quand une organisation délègue 80% de sa production créative à un système IA,
  reste-t-elle un acteur créatif ou devient-elle un opérateur de pipeline ?
tags:
  - organisation
  - identite-creative
  - sous-traitance
  - valeur-ajoutee
facilitator_note:
  si_silence: "Demandez : si les 15 personnes de l'équipe créative interne quittaient OmniStream demain, est-ce que FAME-GEN pourrait continuer à produire sans elles ?"
  si_debat_bloque: "Retournez vers les clients d'OmniStream : les annonceurs et le public se soucient-ils de savoir si c'est une organisation créative ou un opérateur de pipeline qui produit le contenu ?"
  relance_cle: "La vraie question : quand l'expertise d'une organisation se réduit à paramétrer un modèle, qu'est-ce qui reste de sa raison d'être créative ?"
version: "1.0"
