title: "Qui forma les formateurs de FAME-GEN ?"
content: >
  FAME-GEN a été entraîné sur des millions de créations humaines, sans accord
  explicite de leurs auteurs dans la plupart des cas. Il reproduit des styles,
  des structures, des esthétiques — en les recombinant. La délégation que FAME-GEN
  permet repose sur une extraction préalable de la valeur créative humaine, jamais
  rémunérée ni consentie. Les créateurs qui délèguent aujourd'hui à FAME-GEN
  alimentent un système qui a déjà capturé leur culture créative sans leur accord.
  C'est une délégation à un héritier non mandaté — qui a pris avant qu'on lui donne.
question: >
  Peut-on parler de délégation libre à un système construit sur l'extraction
  non consentie de la créativité humaine — et cela change-t-il les règles du
  consentement pour les usages futurs ?
tags:
  - extraction
  - entrainement
  - consentement
  - propriete-intellectuelle
facilitator_note:
  si_silence: "Demandez : si vous appreniez que votre style créatif a été utilisé sans accord pour entraîner un modèle, est-ce que cela changerait votre rapport à FAME-GEN ?"
  si_debat_bloque: "Retournez vers les juristes de la salle : est-ce que le droit d'auteur tel qu'il existe protège les créateurs contre ce type d'extraction — ou a-t-il besoin d'être reécrit ?"
  relance_cle: "La vraie question : peut-on parler de délégation libre à un système qui a d'abord pris sans demander, et qui continue à prendre chaque fois qu'on l'utilise ?"
version: "1.0"
