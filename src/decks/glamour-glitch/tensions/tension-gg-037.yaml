title: "Le créateur qui ne sait pas ce que sa production coûte"
content: >
  Un créateur utilise FAME-GEN quotidiennement depuis deux ans. Il n'a aucune
  visibilité sur l'empreinte ressource de son activité. Il sait que son smartphone
  consomme de l'énergie, que son cloud a un coût carbone — mais l'inférence
  FAME-GEN pour produire ses 15 clips hebdomadaires représente une consommation
  qu'il ne peut ni mesurer ni comparer. L'information n'est pas rendue disponible
  par OmniStream. Son choix de production ne peut pas intégrer ce facteur puisqu'il
  n'y a pas accès.
question: >
  Un créateur peut-il être tenu responsable de l'empreinte ressource de sa
  production numérique quand l'information nécessaire lui est délibérément
  inaccessible ?
tags:
  - empreinte-individuelle
  - information
  - responsabilite
  - opacite
facilitator_note:
  si_silence: "Demandez : si vous produisez 15 clips par semaine avec FAME-GEN mais qu'OmniStream ne vous dit pas ce que ça consomme en énergie, est-ce que vous pouvez décider de produire moins pour des raisons environnementales — et qui est responsable si vous ne le faites pas ?"
  si_debat_bloque: "Poussez sur l'asymétrie d'information : si OmniStream connaît le coût ressource de chaque inférence et ne le communique pas aux créateurs, est-ce une décision neutre — ou une décision qui protège le volume de production en empêchant les créateurs de faire des choix éclairés ?"
  relance_cle: "La vraie question n'est pas si le créateur est responsable de son empreinte — c'est si on peut exiger une responsabilité individuelle sur une information que l'acteur qui la détient a choisi de ne pas partager."
version: "1.0"
