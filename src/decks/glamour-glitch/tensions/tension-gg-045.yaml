title: "La capacité de production hors-plateforme comme condition de souveraineté"
content: >
  Si FAME-GEN s'effondre, subit une panne, est régulé au point d'être inutilisable,
  ou si OmniStream disparaît — les créateurs, studios et filières entières qui ont
  externalisé leur production n'ont plus les compétences, les outils ni les
  infrastructures pour produire autrement. La dépendance infrastructurelle totale
  crée une fragilité systémique : la perte d'accès à FAME-GEN équivaut à une
  perte de la capacité de créer. Maintenir une capacité de production hors-FAME-GEN
  a un coût — mais c'est aussi une assurance contre la disparition de la capacité
  créative humaine indépendante.
question: >
  Doit-on imposer aux acteurs dépendants de FAME-GEN le maintien d'une capacité
  de production hors-plateforme viable — et si oui, qui porte ce coût ?
tags:
  - dependance-systemique
  - resilience
  - souverainete-creative
  - capacite-hors-ia
facilitator_note:
  si_silence: "Demandez : si FAME-GEN tombait en panne pendant six mois, est-ce que les studios et créateurs qui en dépendent pourraient continuer à produire — et si la réponse est non, est-ce un problème individuel ou un problème systémique ?"
  si_debat_bloque: "Poussez sur le coût de la résilience : si maintenir une capacité de production hors-FAME-GEN coûte cher et que personne n'a d'incitation économique à le faire, qui devrait porter ce coût — les créateurs, OmniStream, ou une régulation publique ?"
  relance_cle: "La vraie question n'est pas si FAME-GEN est fiable — c'est si une filière créative qui a externalisé sa capacité de production à un système qu'elle ne contrôle pas a encore une souveraineté créative, ou si elle l'a échangée contre de la commodité."
version: "1.0"
