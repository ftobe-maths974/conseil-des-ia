slot_theme: organisation
chamber: preuve-vs-simulation
reversibility: green
title: "La responsabilité éditoriale d'un catalogue qu'on ne peut plus vérifier"
content: >
  OmniStream publie 40 000 nouveaux contenus par jour. Vérifier l'authenticité
  de chacun serait techniquement impossible et économiquement prohibitif.
  Le studio ne peut garantir que tous les contenus "Verified Human" dans son
  catalogue le sont réellement. Il maintient ce label car il a de la valeur
  commerciale. Mais l'afficher sans pouvoir le vérifier à l'échelle, c'est
  vendre une garantie qu'on ne peut pas tenir. La question n'est pas la
  mauvaise foi — c'est la limite opérationnelle de la responsabilité éditoriale
  à l'échelle industrielle.
question: >
  Une organisation peut-elle légitimement maintenir des garanties d'authenticité
  sur un catalogue dont elle sait ne plus pouvoir vérifier la totalité ?
tags:
  - responsabilite-editoriale
  - echelle
  - garantie
  - limites
facilitator_note:
  si_silence: "Demandez : si OmniStream affiche le label 'Verified Human' sur des contenus sans pouvoir les vérifier tous, et qu'un abonné paie pour ce label — qu'est-ce qu'il achète exactement ?"
  si_debat_bloque: "Poussez sur la limite entre promesse et tromperie : si maintenir une garantie qu'on sait ne plus pouvoir tenir à l'échelle n'est pas de la mauvaise foi mais une contrainte opérationnelle, à partir de quel moment cela devient-il une promesse mensongère ?"
  relance_cle: "La vraie question n'est pas si OmniStream est de mauvaise foi — c'est si une organisation peut continuer à vendre une garantie d'authenticité dont elle sait qu'elle ne peut plus la vérifier sans que cela devienne structurellement trompeur."
version: "1.0"
