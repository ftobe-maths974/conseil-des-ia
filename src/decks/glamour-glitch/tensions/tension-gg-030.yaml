title: "L'interchangeabilité comme condition de scalabilité"
content: >
  FAME-GEN produit des créateurs "interchangeables" au sens opérationnel : un avatar
  de remplacement peut reprendre le flux d'un créateur absent sans que les abonnés
  le détectent immédiatement. Pour OmniStream, c'est de la résilience opérationnelle.
  Pour le créateur, c'est la preuve que son unicité n'est pas reconnue.
  Paradoxalement, certains créateurs apprécient ce filet de sécurité — savoir
  que leur communauté ne sera pas abandonnée s'ils sont malades ou absents.
  La même capacité produit deux effets opposés selon le rapport au remplacement.
question: >
  La capacité de FAME-GEN à remplacer un créateur sans rupture visible est-elle
  une menace pour son unicité ou une protection de sa communauté — et cette
  question a-t-elle une réponse universelle ?
tags:
  - remplacement
  - singularite
  - resilience
  - communaute
facilitator_note:
  si_silence: "Demandez : si votre créateur préféré était remplacé par un avatar FAME-GEN pendant son absence et que vous ne l'ayez pas su, est-ce que ça change quelque chose pour vous — et pourquoi ?"
  si_debat_bloque: "Poussez sur l'ambivalence : si certains créateurs voient le remplacement comme une protection de leur communauté et d'autres comme une menace pour leur unicité, qui décide quelle vision s'applique — et le contrat de la plateforme le précise-t-il ?"
  relance_cle: "La vraie question n'est pas si le remplacement est techniquement invisible — c'est si une communauté qui croit suivre un créateur humain et suit en réalité un avatar a été trompée, et si cette tromperie est acceptable au nom de la continuité du service."
version: "1.0"
