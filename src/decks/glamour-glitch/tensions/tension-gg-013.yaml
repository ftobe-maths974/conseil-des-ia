title: "Rendre les critères publics sans les rendre manipulables"
content: >
  OmniStream Studios refuse de publier les critères de classement de FAME-GEN
  au motif qu'ils seraient immédiatement exploités par des acteurs cherchant
  à les contourner — produisant des contenus optimisés pour le score, pas pour
  le public. Cette tension est réelle : la transparence des critères peut produire
  une course aux armements entre le système et ceux qui cherchent à le manipuler.
  Mais l'opacité des critères produit une asymétrie de pouvoir qui prive les
  acteurs légitimes de tout moyen de défense. Les deux positions défendent des
  biens légitimes : l'intégrité du système vs le droit des acteurs à comprendre
  les règles qui les gouvernent.
question: >
  Comment rendre les critères de classement FAME-GEN suffisamment transparents
  pour permettre la contestation sans les rendre suffisamment lisibles pour
  permettre leur manipulation industrielle ?
tags:
  - transparence
  - manipulation
  - criteres
  - equilibre
facilitator_note:
  si_silence: "Demandez : est-ce qu'on peut imaginer un niveau de transparence des critères qui satisferait les créateurs légitimes sans être exploitable par les optimiseurs malveillants — ou ces deux exigences sont-elles structurellement incompatibles ?"
  si_debat_bloque: "Changez d'angle vers les créateurs : si les critères devenaient publics et que tous commençaient à les optimiser, est-ce que le contenu serait meilleur ou pire pour le public ?"
  relance_cle: "La vraie question : une transparence qui produit de la manipulation sert-elle encore les droits qu'elle est censée protéger ?"
version: "1.0"
