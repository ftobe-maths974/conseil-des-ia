title: "La dépendance économique qui empêche la contestation"
content: >
  Un créateur dont 85% des revenus proviennent de sa visibilité OmniStream sait
  qu'en contestant publiquement une décision de FAME-GEN, il risque une attention
  accrue du système de modération — ce qu'il appelle "l'effet loupe". Il se
  censure. Il accepte des restrictions dont il pense qu'elles sont injustes.
  Sa dépendance économique à la plateforme ne supprime pas formellement son
  droit de recours — mais elle le neutralise en pratique. Le droit existe ;
  l'exercice du droit est économiquement suicidaire.
question: >
  Un droit de contestation qui ne peut pas être exercé sans mettre en péril
  la source de revenu principale de celui qui l'exerce est-il encore un droit ?
tags:
  - dependance-economique
  - autocensure
  - recours
  - pouvoir
facilitator_note:
  si_silence: "Demandez : ce créateur qui se censure par peur de 'l'effet loupe' — est-ce qu'il exerce encore son droit de recours, ou est-ce qu'il l'a abandonné sans que personne ne le lui retire ?"
  si_debat_bloque: "Retournez vers un acteur différent : qu'est-ce qu'un syndicat de créateurs pourrait faire que le créateur seul ne peut pas faire — et pourquoi n'en existe-t-il pas encore ?"
  relance_cle: "La vraie question : quand la dépendance économique neutralise le droit de contestation, sommes-nous encore dans un rapport contractuel ou dans un rapport de subordination ?"
version: "1.0"
