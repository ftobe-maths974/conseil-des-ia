id: tension-gg-036
phase: tension
slot: 9
slot_theme: systeme
chamber: singularite-vs-standard
reversibility: green
title: "Préserver l'exception ou optimiser l'accès ?"
content: >
  Un régulateur propose qu'OmniStream réserve 15% de son flux de recommandations
  à des contenus hors-FOF. OmniStream répond que cette contrainte réduirait
  l'engagement moyen de 12%, ce qui affecterait ses revenus publicitaires et
  donc les ressources disponibles pour rémunérer les créateurs. Le régulateur
  réplique que l'engagement maximum n'est pas une valeur constitutionnelle.
  Deux conceptions légitimes s'affrontent : optimisation de l'engagement vs
  préservation de la diversité comme intérêt public non réductible à une métrique.
question: >
  La préservation de la diversité créative sur OmniStream est-elle un objectif
  de politique publique légitime qui justifie de contraindre l'optimisation
  commerciale d'un acteur privé ?
tags:
  - quota
  - diversite
  - regulation
  - engagement
facilitator_note:
  si_silence: "Demandez : si imposer 15 % de contenus hors-standard dans le flux d'OmniStream réduit les revenus publicitaires et donc la rémunération des créateurs, est-ce que le régulateur a le droit d'imposer ça — et au nom de quoi ?"
  si_debat_bloque: "Poussez sur la définition de l'intérêt public : si la diversité culturelle est un intérêt public qui ne peut pas être réduit à une métrique d'engagement, qui a le mandat de le défendre face à un acteur privé qui optimise pour ses revenus ?"
  relance_cle: "La vraie question n'est pas si un quota de 15 % est le bon chiffre — c'est si la maximisation de l'engagement commercial peut être la seule boussole d'une infrastructure culturelle qui touche des milliards de personnes chaque jour."
version: "1.0"
