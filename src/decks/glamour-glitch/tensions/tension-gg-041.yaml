title: "La dépendance infrastructurelle qui rend impossible la sortie"
content: >
  OmniStream a internalisé FAME-GEN dans l'ensemble de sa chaîne de production.
  Ses créateurs, ses outils, ses contrats, ses métriques sont construits autour
  du pipeline IA. Si OmniStream voulait réduire substantiellement son empreinte
  ressource, cela impliquerait de démanteler une architecture productive dont
  des milliers d'emplois et de revenus dépendent directement. La dépendance
  infrastructurelle rend la sobriété choisie économiquement catastrophique
  — non pas impossible en théorie, mais suicidaire en pratique pour une entreprise
  cotée avec des obligations fiduciaires envers ses actionnaires.
question: >
  Une organisation peut-elle choisir la sobriété quand son modèle économique,
  ses contrats et ses emplois reposent intégralement sur l'infrastructure
  qu'il faudrait réduire — ou faut-il une contrainte externe pour rendre
  ce choix possible ?
tags:
  - lock-in-infrastructurel
  - dependance
  - sobriete
  - contrainte
facilitator_note:
  si_silence: "Demandez : si OmniStream sait que réduire son empreinte ressource de 50 % impliquerait de licencier des milliers d'emplois et de perdre des milliards de revenus, est-ce qu'on peut lui demander de le faire volontairement — et sinon, qui peut l'y contraindre ?"
  si_debat_bloque: "Poussez sur la limite de la responsabilité volontaire : si l'architecture productive d'OmniStream rend la sobriété choisie économiquement suicidaire pour une entreprise cotée, est-ce que la réglementation est la seule voie — et que doit-elle imposer concrètement ?"
  relance_cle: "La vraie question n'est pas si OmniStream devrait être sobre — c'est si un modèle économique qui rend impossible la sobriété choisie peut être transformé par la volonté de ses dirigeants, ou si seule une contrainte externe peut créer les conditions d'un choix réel."
version: "1.0"
