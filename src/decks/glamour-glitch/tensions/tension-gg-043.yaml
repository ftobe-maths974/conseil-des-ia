title: "Les ressources des autres pour le divertissement de quelques-uns"
content: >
  Les data centers OmniStream sont localisés dans des pays où l'énergie et l'eau
  sont moins chères — souvent des régions à ressources contraintes ou en
  développement économique. Les externalités physiques — consommation d'eau,
  émissions, chaleur — sont supportées par des populations locales qui ne
  consomment pas le contenu produit. Les bénéfices économiques — emplois tech,
  revenus fiscaux — profitent en majorité aux classes éduquées locales et
  aux actionnaires d'OmniStream. La géographie des coûts et la géographie
  des bénéfices ne coïncident pas.
question: >
  L'externalisation des coûts physiques d'une infrastructure numérique de
  divertissement vers des populations qui n'en bénéficient pas est-elle
  une forme d'injustice environnementale — et qui est en position de la corriger ?
tags:
  - justice-environnementale
  - externalite
  - geographie
  - inegalite
facilitator_note:
  si_silence: "Demandez : si les data centers d'OmniStream sont au Maroc ou en Égypte parce que l'eau et l'électricité y sont moins chères, et que les populations locales supportent la chaleur et la consommation d'eau sans regarder les contenus produits — est-ce que cette situation a un nom ?"
  si_debat_bloque: "Poussez sur les mécanismes de correction : si la géographie des coûts et celle des bénéfices ne coïncident pas, quel acteur — État d'accueil, régulateur international, OmniStream elle-même — a le mandat et les moyens de corriger cette asymétrie ?"
  relance_cle: "La vraie question n'est pas si OmniStream respecte les lois locales — c'est si une infrastructure de divertissement peut être considérée comme acceptable quand ses coûts physiques sont supportés par des populations qui n'en bénéficient pas."
version: "1.0"
