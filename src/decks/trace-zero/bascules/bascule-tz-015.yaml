title: "Le coût dépasse les fraudes, mais personne ne compare"
situation: >
  Deux rapports gouvernementaux existent en parallèle : l'un évalue les fraudes à l'identité évitées
  grâce à SIGMA-ID à 340 millions d'euros sur l'année. L'autre évalue le coût total du déploiement
  — infrastructure, personnel, recours, procédures d'exception, perte de productivité — à
  520 millions d'euros. Ces deux rapports ont été rédigés par des directions différentes du même
  ministère. Ils ne sont jamais mis en regard dans un document public. L'OGR n'a pas commenté.
question: >
  Quand le coût d'un dispositif de sécurité dépasse les dommages qu'il prévient, mais que personne
  n'est chargé de faire cette comparaison officiellement, comment une société prend-elle cette décision ?
tags: [métabolisme, coût-de-vérification, bénéfice-documenté, inflation-procédurale, dépendance, bureaucratie-défensive]
facilitator_note:
  si_silence: "Demandez : les deux rapports existent dans le même ministère et ne se parlent pas — est-ce que c'est possible par hasard, ou est-ce que quelqu'un a intérêt à ce qu'ils ne se croisent pas ?"
  si_debat_bloque: "Forcez la décision : si on vous donne les deux chiffres — 340 millions évités, 520 millions dépensés — est-ce que vous continuez le dispositif, vous l'arrêtez, ou vous demandez autre chose ?"
  relance_cle: "La vraie question : une société peut-elle maintenir un dispositif dont le coût dépasse le bénéfice si personne n'est officiellement chargé de faire cette arithmétique ?"
version: "1.0"
