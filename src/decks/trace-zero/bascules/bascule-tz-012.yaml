title: "Le modèle inapplicable dans 30% des communes"
situation: >
  Un audit interne de l'OGR, non publié, révèle que SIGMA-ID a été entraîné sur des données issues
  à 94% de populations urbaines avec un accès stable à l'électricité, un smartphone récent et une
  connexion haut débit. Dans 30% des communes rurales françaises, les conditions techniques minimales
  ne sont pas réunies pour que le système fonctionne dans ses paramètres nominaux. Le taux de faux
  positifs y est 4,7 fois plus élevé qu'en zone urbaine dense. L'audit recommande une refonte partielle.
  Il est classé confidentiel.
question: >
  Déployer à l'échelle nationale un système d'authentification dont on sait qu'il discrimine
  structurellement une partie du territoire, est-ce de l'imprudence ou de l'indifférence délibérée ?
tags: [singularité, équité-biométrique, faux-positif, standard, hors-modèle, exclusion, dérogation-biométrique]
facilitator_note:
  si_silence: "Demandez : l'audit est classé confidentiel — qui a pris cette décision, et est-ce que les élus qui ont voté le déploiement avaient ces chiffres devant eux ?"
  si_debat_bloque: "Poussez vers la responsabilité pénale : si on sait que le système produit un taux d'erreur 4,7 fois plus élevé dans 30% des communes et qu'on déploie quand même, est-ce de la négligence ou autre chose ?"
  relance_cle: "La vraie question : peut-on déployer nationalement un système dont on connaît les inégalités territoriales en se disant qu'on corrigera plus tard, ou est-ce que 'plus tard' n'arrive jamais ?"
version: "1.0"
