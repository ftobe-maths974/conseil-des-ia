title: "Sept fois authentifié, zéro démarche accomplie"
situation: >
  Omar, 41 ans, comptable salarié, a besoin d'accéder à cinq services différents dans la même journée :
  son espace fiscal, sa messagerie pro, son dossier médical en ligne, sa mutuelle et sa caisse de
  retraite complémentaire. Chacun exige une vérification SIGMA-ID indépendante. Total sur la journée :
  sept authentifications, dont deux échouent et déclenchent des relances. Il passe deux heures à gérer
  des vérifications. Il finit par abandonner deux des cinq démarches — les délais sont dépassés.
question: >
  Quand la somme des frictions d'authentification dépasse la capacité d'une personne à accomplir ses
  démarches, est-ce encore un système de sécurité ou une bureaucratie punitive ?
tags: [métabolisme, friction, fatigue-authentification, charge-cognitive, latence-sociale, inflation-procédurale]
facilitator_note:
  si_silence: "Demandez : Omar a abandonné deux démarches parce que les délais étaient dépassés — est-ce qu'il a subi une sanction sans avoir commis aucune faute ?"
  si_debat_bloque: "Déplacez vers la conception : est-ce que sept authentifications indépendantes dans la même journée, c'est un oubli de conception ou une décision consciente de ne pas mutualiser ?"
  relance_cle: "La vraie question : quand la sécurité consomme plus de temps citoyen que les services eux-mêmes, est-ce encore de la protection ou de la punition par friction ?"
version: "1.0"
