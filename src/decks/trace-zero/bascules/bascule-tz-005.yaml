chamber: invisibilite-vs-arbitrage
reversibility: yellow
scope: organisationnel
title: "Le dirigeant en zone grise et la paie bloquée"
situation: >
  La PME Arcoverre Menuiserie emploie 23 personnes. Depuis huit jours, le dirigeant, Bernard Lassalle,
  a un score SIGMA-ID "zone grise" — 58% — consécutif à un incident de phishing dont il a été victime.
  Le système de paie de l'entreprise est couplé à son CVR pour les ordres de virement. Résultat : il
  ne peut pas valider les virements de salaire. Les 23 employés n'ont pas été payés. L'OGR dit que
  le dossier est "en cours d'instruction". Délai estimé : 3 à 4 semaines.
question: >
  Quand la compromission du CVR d'un dirigeant paralyse une organisation entière, qui paie le coût
  de l'opacité du système ?
tags: [invisibilité, zone-grise, profil-contaminé, log-opaque, déclassement, suspicion-latente, score-authenticité]
facilitator_note:
  si_silence: "Demandez : les 23 salariés n'ont rien fait de mal — qui est responsable de leur préjudice, l'OGR, la banque, ou Bernard ?"
  si_debat_bloque: "Changez d'angle : si Bernard avait pu voir son score en temps réel et comprendre pourquoi il chutait, est-ce que la situation aurait été différente ?"
  relance_cle: "La vraie question : quand une erreur dans un CVR peut paralyser une organisation entière en quelques jours, est-ce une défaillance technique ou une conception qui a sous-estimé les dépendances ?"
version: "1.0"
