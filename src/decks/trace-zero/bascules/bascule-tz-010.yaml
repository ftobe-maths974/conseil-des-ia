title: "La voix perdue après la chimio"
situation: >
  David, 48 ans, directeur commercial, a suivi une chimiothérapie lourde il y a six mois. Sa voix
  a changé — plus rauque, avec des variations de timbre inhabituelles. SIGMA-ID ne le reconnaît
  plus via la biométrie vocale. Ses comptes professionnels liés à cette biométrie sont verrouillés.
  Pour débloquer la situation, il doit fournir un "justificatif médical de modification vocale" à
  l'OGR — un document qui n'existe pas comme formulaire standard dans aucun hôpital ou cabinet.
question: >
  Quand un système d'authentification ne reconnaît plus quelqu'un parce qu'il a survécu à une
  maladie, qui a tort — l'homme ou le modèle ?
tags: [singularité, atypie, altération, faux-positif, hors-modèle, présence-non-conforme, accessibilité]
facilitator_note:
  si_silence: "Demandez : David a survécu à sa maladie — est-ce que la première chose qu'on lui demande de prouver, c'est qu'il est encore lui-même ?"
  si_debat_bloque: "Changez d'angle : le formulaire n'existe pas dans aucun hôpital — est-ce un bug administratif ou le signe que le système n'a jamais imaginé que des corps puissent changer ?"
  relance_cle: "La vraie question : un système biométrique qui ne reconnaît plus les personnes dont le corps a évolué — est-ce un système d'identité ou un système de conformité corporelle ?"
version: "1.0"
