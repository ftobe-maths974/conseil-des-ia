title: "L'alerte sans explication"
situation: >
  Laure, 29 ans, graphiste indépendante, reçoit une notification sur son téléphone : "Authentification
  suspecte détectée — votre CVR fait l'objet d'une surveillance renforcée." Elle n'a rien fait de
  différent ce jour-là. Elle a essayé de se connecter à son espace OGR pour comprendre — le site
  lui demande une authentification renforcée qu'elle ne peut pas compléter parce que son score est
  justement en zone grise. Elle tourne en rond depuis deux heures.
question: >
  Quand un système vous signale que vous êtes suspect sans vous dire pourquoi, et que le recours
  exige d'être déjà authentifié, comment sortez-vous du cercle ?
tags: [invisibilité, score-authenticité, zone-grise, défi-silencieux, log-opaque, notification, recours-fantôme]
facilitator_note:
  si_silence: "Demandez : Laure a-t-elle commis une erreur quelque part, ou est-ce le système qui la traite comme suspecte sans raison accessible ?"
  si_debat_bloque: "Déplacez vers le recours : un système qui exige d'être authentifié pour contester une décision d'authentification — c'est concevable comme architecture ou c'est une absurdité délibérée ?"
  relance_cle: "La vraie question : a-t-on le droit de concevoir un système où la porte de sortie est verrouillée de l'intérieur ?"
version: "1.0"
