title: "Garantir le droit à la révocation partielle du certificat biométrique"
body: >
  Toute personne titulaire d'un CVR peut demander à l'OGR la révocation partielle de ses données
  biométriques d'un ou plusieurs opérateurs tiers, sans que cette révocation n'affecte la validité
  du CVR central. L'OGR dispose de 15 jours ouvrés pour exécuter la révocation. Le refus de révocation
  doit être motivé par écrit et ouvre automatiquement droit à recours devant la Commission d'arbitrage
  de l'identité numérique.
mandat_principe: "Le titulaire d'un CVR conserve un droit de reprise partielle sur la délégation de ses données biométriques, indépendamment des contrats conclus par les opérateurs tiers avec l'OGR."
tags: [delegation, révocation, CVR, souveraineté, dépendance-identitaire, certificat, recours]
facilitator_note:
  si_silence: "Demandez : si une personne révoque ses données biométriques d'un opérateur tiers mais que cet opérateur a déjà entraîné un modèle sur ces données, est-ce que la révocation supprime les données brutes ou aussi leur influence dans le modèle déjà construit ?"
  si_debat_bloque: "Poussez sur le délai de 15 jours ouvrés : pour une personne dont l'accès à un service dépend d'un opérateur tiers problématique, 3 semaines c'est long. Est-ce que l'OGR peut garantir ce délai même en période de forte demande, et que se passe-t-il pour la personne pendant ce délai ?"
  relance_cle: "Ce mandat pose la question de la granularité du contrôle sur son identité biométrique : permettre la révocation partielle par opérateur sans affecter le CVR central est une architecture de souveraineté sophistiquée — mais si un opérateur conditionne son service à la délégation biométrique et que la révocation entraîne la perte de ce service, le droit de révocation est-il réellement libre ?"
version: "1.0"
