scope: systemique
title: "Interdire qu'un score d'authenticité inférieur à 90% serve seul de motif de rejet d'une preuve"
body: >
  Il est interdit à toute autorité administrative, judiciaire ou institutionnelle de rejeter une preuve
  produite par une personne physique au seul motif que son score d'authenticité SIGMA-ID est inférieur
  à 90%. Tout rejet fondé partiellement sur un score d'authenticité doit être accompagné d'au moins
  un élément de preuve complémentaire indépendant du score et d'une motivation écrite signée par un
  décideur humain nommé.
mandat_principe: "Un score d'authenticité est un indice, non une vérité — son insuffisance ne constitue pas une preuve de synthèse et ne dispense pas d'un examen humain de la preuve."
tags: [preuve, liveness, certificat-de-présence, chaîne-de-garde, présomption-de-synthèse, score-authenticité]
facilitator_note:
  si_silence: "Demandez : 'au moins un élément de preuve complémentaire indépendant du score' — si tous les éléments de preuve disponibles dans le dossier sont eux-mêmes attestés par SIGMA-ID ou dépendent du même score, comment un décideur humain peut-il trouver un élément réellement indépendant ?"
  si_debat_bloque: "Poussez sur le seuil de 90% : pourquoi 90% et pas 80% ou 95% ? Si ce seuil est perçu comme arbitraire, est-ce que toute valeur choisie aura le même problème — et si oui, comment définir un seuil défendable plutôt qu'une frontière contestable ?"
  relance_cle: "Ce mandat pose la question du score comme indice versus preuve : interdire que le score seul justifie le rejet d'une preuve est une protection contre l'automatisation du doute — mais si 'un élément complémentaire' suffit à compléter le motif de rejet, est-ce que ce mandat empêche vraiment le rejet ou ajoute-t-il seulement une étape documentaire à une décision déjà prise ?"
version: "1.0"
