id: action-tz-002
phase: action
slot: 2
lever_type: limiter
chamber: delegation-vs-souverainete
reversibility: yellow
scope: systemique
title: "Limiter le droit de délégation à SIGMA-ID aux entités maintenant une capacité de reprise autonome"
body: >
  Le droit de déléguer la certification d'identité à SIGMA-ID est réservé aux entités documentant
  et maintenant une procédure de reprise de contrôle humaine opérationnelle, activable en moins de
  30 minutes, sans dépendance technique à SIGMA-ID. Cette procédure est testée trimestriellement
  et le résultat publié. Toute entité ne satisfaisant pas à cette condition perd le droit de délégation
  jusqu'à mise en conformité documentée.
mandat_principe: "Restreindre l'accès à la délégation à SIGMA-ID aux seules entités capables de reprendre le contrôle de leurs décisions d'identité sans dépendance au système délégué."
tags: [delegation, confiance-forcée, opérateur-de-confiance, CVR, validation-tierce, reprise-de-contrôle]
facilitator_note:
  si_silence: "Demandez : si SIGMA-ID est devenu le standard de facto et qu'une entité perd son droit de délégation parce qu'elle n'a pas de procédure de reprise — qu'est-ce qu'elle fait pendant la mise en conformité ? Ses usagers se retrouvent sans certification d'identité, et qui porte ce préjudice ?"
  si_debat_bloque: "Poussez sur la procédure testée trimestriellement : le test confirme que la procédure fonctionne dans un contexte de test — mais si la vraie reprise de contrôle n'a jamais été activée dans un incident réel, est-ce que la limite est opérationnelle ou seulement documentaire ?"
  relance_cle: "Ce mandat pose la question de la délégation comme privilège conditionné : restreindre l'accès à SIGMA-ID aux entités capables de reprendre le contrôle de façon autonome est une logique de sécurité cohérente — mais si la condition de reprise autonome est trop exigeante pour les petites entités publiques, est-ce que ce plafond protège la résilience ou concentre SIGMA-ID chez les seuls acteurs qui ont les moyens de s'en passer ?"
version: "1.0"
