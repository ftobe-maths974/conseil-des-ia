id: action-tz-008
phase: action
slot: 4
lever_type: recours
chamber: invisibilite-vs-arbitrage
reversibility: red
scope: individuel
title: "Garantir une voie de recours humaine opposable dans les 72 heures pour tout déclassement"
body: >
  Toute personne dont le CVR a été déclassé, suspendu ou placé en Contrôle Renforcé dispose d'un droit
  de recours auprès d'un agent OGR humain nommé, joignable dans les 72 heures suivant la notification
  de la mesure, via un canal de contact garanti sans exigence de score d'authenticité minimal. L'agent
  humain a le pouvoir de lever provisoirement la mesure dans l'attente d'un examen complet. Tout refus
  de lever la mesure provisoire doit être motivé par écrit.
mandat_principe: "Interdire que l'opacité d'un calcul d'authenticité tienne lieu de preuve contre la personne évaluée — la charge de la preuve ne peut reposer sur le seul score."
tags: [invisibilité, recours-fantôme, zone-grise, déclassement, agent-humain, délai, suspicion-latente, score-authenticité]
facilitator_note:
  si_silence: "Demandez : le canal de recours est garanti 'sans exigence de score d'authenticité minimal' — mais si la personne déclassée n'a plus accès à internet, à un téléphone, ou à tout outil numérique à cause de sa situation de précarité, comment elle accède concrètement à ce canal dans les 72 heures ?"
  si_debat_bloque: "Poussez sur le pouvoir de l'agent humain de lever provisoirement la mesure : si l'agent peut lever provisoirement et que SIGMA-ID peut immédiatement la réimposer parce que les critères de déclassement persistent, dans quel sens fonctionne réellement la hiérarchie entre l'agent humain et le système ?"
  relance_cle: "Ce mandat pose la question du recours humain comme protection contre le score comme preuve : garantir un accès humain opposable en 72 heures avec pouvoir de levée provisoire est un droit fort — mais si l'agent humain ne dispose pas des mêmes informations que SIGMA-ID pour instruire le dossier, peut-il exercer ce pouvoir en toute connaissance de cause ?"
version: "1.0"
