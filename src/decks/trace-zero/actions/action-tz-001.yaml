id: action-tz-001
phase: action
slot: 1
lever_type: interdire
chamber: delegation-vs-souverainete
reversibility: red
scope: systemique
title: "Interdire toute suspension de CVR sans validation humaine préalable"
body: >
  Il est interdit à l'OGR et à tout opérateur délégué de suspendre, rétrograder ou invalider un Certificat
  de Vie Réelle sans qu'un agent humain habilité ait explicitement validé la décision. Toute suspension
  automatisée de SIGMA-ID est nulle de plein droit jusqu'à confirmation humaine. L'agent validant est
  nominalement responsable et identifiable dans le log de décision.
mandat_principe: "Toute décision de suspension ou de révocation d'un CVR engage la responsabilité nominale d'un agent humain identifié, dont le nom et la qualité sont accessibles à la personne concernée sur simple demande."
tags: [delegation, CVR, validation-humaine, responsabilité, verrou-de-présence, dépendance-identitaire]
facilitator_note:
  si_silence: "Demandez : si l'agent humain valide 200 suspensions par jour, à quel moment la validation devient-elle formelle plutôt que réelle ? Quel est le volume de décisions au-delà duquel la responsabilité nominale ne peut plus être exercée sérieusement ?"
  si_debat_bloque: "Poussez sur la responsabilité nominale : l'agent est 'nominalement responsable et identifiable' — mais si sa hiérarchie lui impose de valider les décisions de SIGMA-ID sans les contester, est-ce que sa responsabilité est réelle ou seulement documentaire ?"
  relance_cle: "Ce mandat pose la question du verrou humain dans une chaîne de décision automatisée : exiger une validation humaine nominale avant toute suspension de CVR est une protection essentielle — mais si SIGMA-ID génère les alertes et que l'agent les approuve systématiquement, la validation humaine est-elle un contrôle réel ou une étape administrative ?"
version: "1.0"
