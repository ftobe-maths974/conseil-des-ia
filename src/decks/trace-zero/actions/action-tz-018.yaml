title: "Limiter le renouvellement de contrat SIGMA-ID aux entités dont le bilan coût-bénéfice est validé"
body: >
  Le renouvellement de contrat SIGMA-ID par une entité publique est limité aux entités dont le bilan
  coût-bénéfice annuel, comparant le coût total d'authentification (infrastructure, personnel, frais
  de recours, coût des procédures d'exception) au montant des fraudes effectivement prévenues, est
  positif et vérifié par la Cour des comptes ou un organisme délégué. Toute entité dont le bilan est
  défavorable pendant deux années consécutives ne peut renouveler son contrat sans dérogation motivée
  et publique.
mandat_principe: "Restreindre le renouvellement de tout contrat SIGMA-ID public aux entités dont le bénéfice documenté excède le coût total mesuré, y compris les coûts portés par les usagers."
tags: [métabolisme, coût-de-vérification, bénéfice-documenté, inflation-procédurale, bilan, dépendance]
facilitator_note:
  si_silence: "Demandez : deux années consécutives de bilan défavorable avant la limite de renouvellement — pendant deux ans, l'entité utilise SIGMA-ID alors que son bilan est négatif. Qui protège les usagers pendant ces deux années, et pourquoi attendre deux cycles avant d'agir ?"
  si_debat_bloque: "Poussez sur la dérogation motivée et publique : une entité peut renouveler malgré un bilan défavorable avec une dérogation. Qui l'accorde, selon quels critères, et si les dérogations sont systématiquement accordées dès qu'une entité argumente le besoin sécuritaire, est-ce que le plafond a une valeur contraignante réelle ?"
  relance_cle: "Ce mandat pose la question du bilan coût-bénéfice comme condition de renouvellement : lier la reconduction à une démonstration de valeur mesurée est une logique de responsabilité publique forte — mais si les coûts sociaux portés par les usagers (friction, accès refusés, recours abandonnés) ne sont pas intégrés dans le calcul officiel, le bilan peut être positif sur le papier tout en étant négatif dans la réalité vécue."
version: "1.0"
