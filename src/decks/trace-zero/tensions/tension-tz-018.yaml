title: "Régulation de l'opacité par l'État ou autorégulation du marché"
content: >
  Deux camps s'affrontent sur la gouvernance des standards d'opacité de SIGMA-ID. Le camp "régulation"
  veut que l'État fixe des obligations légales d'explicabilité, avec des sanctions pour non-respect.
  Les défenseurs de ce camp soulignent que sans obligation légale, aucune entreprise ne réduira
  volontairement son avantage compétitif. Le camp "autorégulation" argue qu'une loi rigide figera
  la technologie et que les acteurs privés, sous pression de marché et de réputation, s'amélioreront
  plus vite. La fraude, elle, n'attend pas les cycles législatifs.
question: >
  Pour réguler l'opacité des systèmes d'authentification biométrique qui touchent l'ensemble de la
  population, la loi est-elle plus efficace que le marché, ou vice versa ?
tags: [invisibilité, régulation, autorégulation, log-opaque, arbitrage, score-authenticité, transparence]
facilitator_note:
  si_silence: "Demandez : si aucune loi n'oblige SIGMA-ID à être explicable mais que les utilisateurs peuvent choisir des alternatives plus transparentes, pensez-vous que la pression de marché forcerait l'OGR à s'améliorer — ou que la plupart des gens n'auraient pas de choix réel ?"
  si_debat_bloque: "Poussez sur l'asymétrie de la pression de marché : si l'opacité de SIGMA-ID est un avantage concurrentiel face aux attaquants comme SYNTH-MEMEX, et que les utilisateurs subissent cette opacité sans pouvoir en partir, est-ce que le marché peut vraiment corriger ce déséquilibre ?"
  relance_cle: "La vraie question n'est pas si la loi ou le marché fonctionne mieux en général — c'est si un système d'authentification qui touche l'ensemble de la population et dont personne ne peut vraiment se passer peut être soumis à la pression de marché comme n'importe quel service commercial."
