title: "N'accepter que des preuves certifiées ou risquer d'exclure l'authentique"
content: >
  Le tribunal administratif de Bordeaux-Métropole a adopté une politique "preuves certifiées uniquement" :
  seules les preuves numériques avec un score SIGMA-ID supérieur à 85% sont acceptées. Depuis, aucune
  preuve synthétique n'a été soumise — mais 12% des preuves authentiques présentées ont été rejetées
  pour score insuffisant. Des victimes de violences filmées sur des téléphones grand public se retrouvent
  sans preuve recevable parce que leurs vidéos ont été enregistrées dans des conditions qui abaissent
  le score (mauvais éclairage, compression automatique, réseau instable).
question: >
  Un seuil de certification des preuves qui rejette une fraction des preuves authentiques est-il
  un progrès de la rigueur judiciaire ou un recul de l'accès à la justice ?
tags: [preuve, attestation, liveness, certificat-de-présence, chaîne-de-garde, faux-positif, justice]
facilitator_note:
  si_silence: "Demandez : si une victime de violence domestique a filmé une scène sur son téléphone dans de mauvaises conditions et que sa vidéo est rejetée parce que le score SIGMA-ID est insuffisant — est-ce que le tribunal a pris la bonne décision ?"
  si_debat_bloque: "Poussez sur le sens du seuil : si un seuil à 85 % rejette 12 % des preuves authentiques pour éliminer les synthétiques, quelle est la justification de ce chiffre — qui l'a fixé, sur quelle base — et existe-t-il un seuil où la rigueur n'exclut plus l'authentique ?"
  relance_cle: "La vraie question n'est pas si des seuils de certification sont nécessaires — c'est si un standard technique fixé pour les cas les plus avancés peut devenir une barrière d'accès à la justice pour ceux qui n'ont pas les moyens de produire des preuves parfaitement certifiées."
