title: "Le confort de ne plus avoir à s'authentifier soi-même"
content: >
  Depuis que SIGMA-ID gère son identité, Nadia ne saisit plus de mot de passe, ne perd plus accès à
  ses comptes, ne subit plus de phishing classique. Elle a délégué le problème à l'OGR et elle en est
  soulagée. Mais cette délégation a un revers : si son CVR est compromis, elle ne peut plus rien faire
  seule. Son accès à l'ensemble de ses services dépend d'un tiers qu'elle ne contrôle pas et dont elle
  ne comprend pas les règles. Elle a gagné de la tranquillité au prix d'une dépendance qu'elle ne mesure
  pas jusqu'au jour où le système la lâche.
question: >
  Déléguer la gestion de son identité à un système fiable, est-ce une protection raisonnable ou
  la création d'une vulnérabilité plus grave encore ?
tags: [delegation, dépendance-identitaire, confiance-forcée, CVR, opérateur-de-confiance]
facilitator_note:
  si_silence: "Demandez : est-ce que quelqu'un dans ce groupe a déjà perdu l'accès à un compte important et ne savait pas quoi faire ?"
  si_debat_bloque: "Déplacez vers l'OGR : si c'est l'opérateur lui-même qui subit la panne, qui répond à Nadia — et dans quel délai ?"
  relance_cle: "La vraie question est celle du recours : quand on a tout délégué, à qui s'adresse-t-on le jour où ça tombe ?"
version: "1.0"
