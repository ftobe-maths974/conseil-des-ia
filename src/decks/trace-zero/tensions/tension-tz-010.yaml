title: "Être alerté sans explication ou ignorer qu'on est observé"
content: >
  Deux régimes coexistent dans l'OGR. Le régime "notification active" : la personne reçoit une alerte
  chaque fois que son score varie significativement — ce qui génère de l'anxiété et des questions sans
  réponse. Le régime "surveillance silencieuse" : aucune notification, mais la personne ne sait pas
  qu'elle est peut-être en zone grise depuis des semaines. Dans le premier cas, elle est informée mais
  perturbée. Dans le second, elle est ignorante mais tranquille — jusqu'à ce qu'un refus de service
  la prévienne que quelque chose ne va pas.
question: >
  Vaut-il mieux être notifié d'une suspicion sans pouvoir l'expliquer, ou ne pas savoir qu'on est
  suspect jusqu'à ce que les conséquences arrivent ?
tags: [invisibilité, notification, score-authenticité, zone-grise, défi-silencieux, suspicion-latente]
facilitator_note:
  si_silence: "Demandez : si vous receviez une alerte 'votre score d'authenticité vient de baisser' sans aucune explication, qu'est-ce que vous feriez — et comment vous sentiriez-vous ?"
  si_debat_bloque: "Poussez sur le paradoxe de l'information : si être notifié sans explication génère de l'anxiété et ne permet pas d'agir, et que ne pas être notifié expose à des conséquences inattendues, est-ce qu'il existe une troisième option — et laquelle ?"
  relance_cle: "La vraie question n'est pas quel régime de notification est préférable — c'est si un système qui ne peut pas expliquer ses alertes a le droit d'en émettre, et si une opacité qui s'habille de transparence est encore de la transparence."
