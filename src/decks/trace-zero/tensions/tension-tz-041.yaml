title: "Externaliser l'authentification à l'OGR ou garder la maîtrise des données"
content: >
  La coopérative agricole Terre-du-Forez gère 3 200 adhérents. Elle peut externaliser entièrement
  ses vérifications d'identité à l'OGR — gain de temps considérable, zéro investissement technique.
  Ou elle peut maintenir son propre système d'authentification interne, moins performant mais sous
  son contrôle : elle conserve la relation directe avec ses adhérents, leurs données restent chez
  elle, et elle peut adapter ses procédures à ses propres valeurs. Le choix OGR crée une dépendance
  institutionnelle. Le choix interne impose une charge technique qu'elle n'a pas forcément les
  moyens d'assumer correctement.
question: >
  Une organisation qui maîtrise moins bien l'authentification mais garde le contrôle de ses données
  est-elle dans une meilleure position qu'une organisation qui externalise efficacement mais perd
  cette maîtrise ?
tags: [métabolisme, dépendance, externalisation, coût-de-vérification, souveraineté, données, bureaucratie-défensive]
facilitator_note:
  si_silence: "Demandez : si Terre-du-Forez externalise à l'OGR, elle gagne du temps mais perd le contact direct avec ses adhérents sur leur identité. Qu'est-ce qui est en jeu dans cette relation de confiance — et est-ce quantifiable ?"
  si_debat_bloque: "Poussez sur la nature de la dépendance : si externaliser crée une dépendance institutionnelle à l'OGR, et que garder en interne impose une charge que la coopérative ne peut pas assumer correctement, est-ce qu'il existe une option qui ne soit pas une forme de vulnérabilité ?"
  relance_cle: "La vraie question n'est pas si l'OGR est plus efficace — c'est si une organisation peut encore décider souverainement de ses propres procédures d'authentification quand les alternatives internes sont hors de sa portée technique et financière."
version: "1.0"
